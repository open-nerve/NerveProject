# workspace 模块的接口（M3 设计 5.1、5.2）。生成的 Go 代码在
# server/internal/modules/workspace/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve workspace API
  version: v0
paths:
  /api/v0/workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspace]
      summary: List the caller's workspaces
      description: >-
        The workspaces of which the caller is an active member, each with the
        caller's role and the number of active members, by name and then by
        id. The whole collection at once: collections are not paginated.
      security: [{bearer: []}]
      x-problem-codes: []
      responses:
        '200':
          description: The caller's workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWorkspace
      tags: [workspace]
      summary: Create a workspace with the caller as its admin
      description: >-
        Creates the workspace and makes the caller its admin and only member;
        nothing else is created with it. While the instance's
        workspace_creation_enabled is false, an authenticated, well-formed
        request answers workspace.creation_disabled before its values are
        looked at, and the server's administrator creates workspaces with
        `nerve workspaces create`. The name has 1–80 characters with a letter
        or a digit and no web address, and a NUL character in it is refused
        (invalid_format); the slug has 1–48 lower-case letters, digits, - and
        _, and is neither reserved (not_allowed) nor another undeleted
        workspace's (workspace.slug_taken). An account deactivated meanwhile
        answers unauthorized.
      security: [{bearer: []}]
      x-problem-codes: [workspace.creation_disabled, validation_failed, workspace.slug_taken]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: The new workspace; the caller is its admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Read a workspace
      description: >-
        A workspace that does not exist, is deleted, or of which the caller
        is not an active member answers the same workspace.not_found.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found]
      responses:
        '200':
          description: The workspace, with the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWorkspace
      tags: [workspace]
      summary: Change a workspace's name, organization size or time zone
      description: >-
        For the workspace's admins. The fields given change and the others
        stay; the values follow createWorkspace's rules (validation_failed),
        checked before the workspace is looked at. The slug never changes: a
        body with slug is refused (bad_request). A workspace that does not
        exist, is deleted, or of which the caller is not an active member
        answers workspace.not_found; a member or a guest, forbidden. The role
        is decided after the workspace row is locked, so a caller demoted
        meanwhile is refused.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, workspace.not_found, forbidden]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: The workspace as changed, with the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteWorkspace
      tags: [workspace]
      summary: Delete a workspace
      description: >-
        For the workspace's admins. The workspace, its members and their
        display settings are soft-deleted in one transaction, at the same
        moment; the slug can name a new workspace at once. Nobody's
        last_workspace_id is cleared. A workspace that does not exist, is
        deleted, or of which the caller is not an active member answers
        workspace.not_found; a member or a guest, forbidden.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found, forbidden]
      responses:
        '204':
          description: The workspace is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/members:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listWorkspaceMembers
      tags: [workspace]
      summary: List a workspace's members
      description: >-
        Every membership of the workspace, those that ended too (is_active
        false), in the order they began, then by id, each with the member's
        public profile. For any active member. The addresses are shown to
        admins and members; to a guest every address is null, his own too.
        A workspace that does not exist, is deleted, or of which the caller
        is not an active member answers workspace.not_found. The whole
        collection at once: collections are not paginated.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found]
      responses:
        '200':
          description: The workspace's memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-slugs/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: checkWorkspaceSlug
      tags: [workspace]
      summary: Tell whether a slug can name a new workspace
      description: >-
        Available, or why not: invalid (not 1–48 lower-case letters, digits,
        - and _), reserved (a path of this site, or held for one), or taken
        (an undeleted workspace has it). It tells nothing about the workspace
        that has it.
      security: [{bearer: []}]
      x-problem-codes: []
      responses:
        '200':
          description: Whether the slug is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugAvailability'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/workspaces/{slug}/preferences:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: getWorkspacePreferences
      tags: [workspace]
      summary: Read the caller's display settings in a workspace
      description: >-
        The caller's own settings of the sidebar's project navigation in the
        workspace, for any active member. Until the caller first changes
        them they are the defaults, ACCORDION and 10, and reading them writes
        nothing. A workspace that does not exist, is deleted, or of which the
        caller is not an active member answers workspace.not_found.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found]
      responses:
        '200':
          description: The caller's settings in the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePreferences'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWorkspacePreferences
      tags: [workspace]
      summary: Change the caller's display settings in a workspace
      description: >-
        The fields given change and the others stay; the first change stores
        the caller's settings, the defaults with the change applied. The
        values are checked before the workspace is looked at
        (validation_failed). A workspace that does not exist, is deleted, or
        of which the caller is not an active member answers
        workspace.not_found.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, workspace.not_found]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspacePreferencesUpdate'
      responses:
        '200':
          description: The caller's settings in the workspace, as changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePreferences'
        default:
          $ref: '#/components/responses/Problem'
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份（M0-P3 交接 3）
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: A workspace's slug, as in the web app's address.
      schema:
        type: string
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited and server_busy.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '../common.yaml#/components/schemas/Problem'
  schemas:
    WorkspaceRole:
      description: A member's role in a workspace, 5 guest, 15 member, 20 admin.
      type: integer
      enum: [5, 15, 20]
    OrganizationSize:
      description: The size of the organization, as the web app's form offers it.
      type: string
      enum: [Just myself, 2-10, 11-50, 51-200, 201-500, 500+]
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, slug, organization_size, timezone, logo_url, role, total_members, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          description: Lower case; it never changes.
          type: string
        organization_size:
          description: One of OrganizationSize's values; null when none was given.
          type: [string, 'null']
        timezone:
          description: An IANA time zone name.
          type: string
        logo_url:
          description: Null until uploads arrive (M5).
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        total_members:
          description: The number of active members.
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
    WorkspaceCreate:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          description: 1–80 characters, with a letter or a digit, without a web address.
          type: string
        slug:
          description: 1–48 lower-case letters, digits, - and _; not reserved.
          type: string
        organization_size:
          $ref: '#/components/schemas/OrganizationSize'
        timezone:
          description: An IANA time zone name, e.g. from GET /api/v0/timezones; UTC when not given.
          type: string
    MemberUser:
      description: >-
        A member's public profile, embedded in the membership: the one way
        v0 shows other accounts (M3 design 5.2).
      type: object
      additionalProperties: false
      required: [id, display_name, first_name, last_name, avatar_url, email]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        avatar_url:
          description: Null until uploads arrive (M5).
          type: [string, 'null']
        email:
          description: The member's address for a caller who is an admin or a member; null for a guest.
          type: [string, 'null']
    WorkspaceMember:
      type: object
      additionalProperties: false
      required: [id, workspace_id, role, is_active, created_at, member]
      properties:
        id:
          description: The membership's id, which /workspace-members/{workspace_member_id} names.
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        is_active:
          description: False once the membership has ended.
          type: boolean
        created_at:
          type: string
          format: date-time
        member:
          $ref: '#/components/schemas/MemberUser'
    WorkspaceMemberList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
    WorkspaceUpdate:
      description: Changes the fields it names; a field left out keeps its value. organization_size cannot be set to null.
      type: object
      additionalProperties: false
      properties:
        name:
          description: 1–80 characters, with a letter or a digit, without a web address.
          type: string
        organization_size:
          $ref: '#/components/schemas/OrganizationSize'
        timezone:
          description: An IANA time zone name.
          type: string
    NavigationControlPreference:
      description: How the sidebar shows the projects, as sections one under another or as tabs.
      type: string
      enum: [ACCORDION, TABBED]
    NavigationProjectLimit:
      description: How many projects the sidebar shows before "more"; 0 shows them all.
      type: integer
      minimum: 0
      maximum: 2147483647
    WorkspacePreferences:
      type: object
      additionalProperties: false
      required: [navigation_control_preference, navigation_project_limit]
      properties:
        navigation_control_preference:
          $ref: '#/components/schemas/NavigationControlPreference'
        navigation_project_limit:
          $ref: '#/components/schemas/NavigationProjectLimit'
    WorkspacePreferencesUpdate:
      type: object
      additionalProperties: false
      properties:
        navigation_control_preference:
          $ref: '#/components/schemas/NavigationControlPreference'
        navigation_project_limit:
          $ref: '#/components/schemas/NavigationProjectLimit'
    SlugAvailability:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available:
          type: boolean
        reason:
          description: Why the slug is not available; absent when it is.
          type: string
          enum: [invalid, reserved, taken]
