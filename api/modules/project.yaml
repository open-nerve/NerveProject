# project 模块的接口（M3 设计 5.1、5.2）。生成的 Go 代码在
# server/internal/modules/project/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve project API
  version: v0
paths:
  /api/v0/workspaces/{slug}/projects:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listProjects
      tags: [project]
      summary: List a workspace's projects that the caller sees
      description: >-
        The workspace's projects that the caller sees, each as he sees it:
        every one, to its admins; to its members, the public ones and those
        they are members of; to its guests, those they are members of. The
        archived projects are left out, unless archived is true, which lists
        them alone. By each project's place in the caller's sidebar, the
        projects without a place in it last, then by name. A workspace that
        does not exist, is deleted, or of which the caller is not an active
        member answers workspace.not_found. The whole collection at once:
        collections are not paginated.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found]
      parameters:
        - name: archived
          in: query
          required: false
          description: true lists the archived projects alone; false, or no value, the others.
          schema:
            type: boolean
      responses:
        '200':
          description: The projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProject
      tags: [project]
      summary: Create a project in a workspace
      description: >-
        For the workspace's admins and members. The project is created with
        the caller, and the lead when one is given, as its admins, the
        project first in each one's sidebar, and with its six states:
        Backlog, the default, Todo, In Progress, Done, Cancelled and Triage.
        The name has 1–255 characters, not blank, without NUL and
        without any of & + , : ; $ ^ } { * = ? @ # | ' < > . ( ) % ! -; the
        identifier, upper-cased, has 1–10 of A-Z, 0-9 and ÇŞĞİÖÜ; the
        network is 0 or 2, public when not given; the time zone is an IANA
        name, the workspace's when not given (validation_failed). The values
        are checked before the workspace is looked at. A workspace that does
        not exist, is deleted, or of which the caller is not an active member
        answers workspace.not_found; a guest, forbidden. The lead must be an
        active admin or member of the workspace (project_lead_id
        not_allowed), which is checked after the caller's role. Neither the
        name nor the identifier may be another undeleted project's of the
        workspace (project.name_taken, project.identifier_taken).
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, workspace.not_found, forbidden, project.identifier_taken, project.name_taken]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: The new project, as the caller, its admin, sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/project-identifiers/{identifier}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - name: identifier
        in: path
        required: true
        description: An identifier asked about, in any case.
        schema:
          type: string
    get:
      operationId: checkProjectIdentifier
      tags: [project]
      summary: Check whether a project identifier is available in a workspace
      description: >-
        For the workspace's admins and members, as createProject. The
        identifier is available when createProject would take it: once
        upper-cased, 1–10 of A-Z, 0-9 and ÇŞĞİÖÜ, and held by no undeleted
        project of the workspace, archived or not. A workspace that does not
        exist, is deleted, or of which the caller is not an active member
        answers workspace.not_found; a guest, forbidden.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found, forbidden]
      responses:
        '200':
          description: Whether the identifier is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierAvailability'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: getProject
      tags: [project]
      summary: Read a project
      description: >-
        For whoever sees the project: its active members, the workspace's
        admins, and for a public project the workspace's members too; a
        caller who is not its member reads it with member_role and sort_order
        null. An archived project is read as any other, with its archived_at.
        A project that does not exist, is deleted, or that the caller does
        not see answers project.not_found; so does one whose workspace he is
        not an active member of.
      security: [{bearer: []}]
      x-problem-codes: [project.not_found]
      responses:
        '200':
          description: The project, as the caller sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateProject
      tags: [project]
      summary: Change a project
      description: >-
        For the project's admins, and its members who are the workspace's
        admins. The fields given change and the others stay; the values
        follow createProject's rules, and archive_in is 0–12
        (validation_failed), checked before the project is looked at. An
        archived project cannot be changed (project.archived): unarchive it
        first. The lead and the default assignee, null to clear either, must
        be active members of the project who are not its guests
        (project_lead_id, default_assignee_id not_allowed), which is checked
        after the caller's role. Neither the name nor the identifier may be
        another undeleted project's of the workspace (project.name_taken,
        project.identifier_taken). A project that does not exist, is deleted,
        or that the caller does not see answers project.not_found; one he
        sees but may not change, forbidden. The role is decided after the
        project row is locked, so a caller demoted meanwhile is refused.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, project.not_found, forbidden, project.archived, project.identifier_taken, project.name_taken]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: The project as changed, as the caller sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteProject
      tags: [project]
      summary: Delete a project
      description: >-
        For the project's admins, and its members who are the workspace's
        admins; an archived project is deleted as any other. The project is
        deleted with its memberships, its members' display settings, its
        states and its labels, all at one moment: it is no longer read,
        listed or changed, and its name and identifier are free again in the
        workspace. A project that does not exist, is deleted, or that the
        caller does not see answers project.not_found; one he sees but may
        not delete, forbidden. The role is decided after the project row is
        locked.
      security: [{bearer: []}]
      x-problem-codes: [project.not_found, forbidden]
      responses:
        '204':
          description: The project is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: archiveProject
      tags: [project]
      summary: Archive a project
      description: >-
        For the project's admins, and its members who are the workspace's
        admins. The project is archived as of the request: listProjects lists
        it among the archived ones, and until it is unarchived updateProject
        alone refuses it (project.archived); deleting it, changing one's
        display settings in it, adding members to it and joining it work as
        on any project. An archived project archived again takes the new
        time. A project that does not exist, is deleted, or that the caller
        does not see answers project.not_found; one he sees but may not
        archive, forbidden. The role is decided after the project row is
        locked.
      security: [{bearer: []}]
      x-problem-codes: [project.not_found, forbidden]
      responses:
        '200':
          description: The project as archived, as the caller sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: unarchiveProject
      tags: [project]
      summary: Unarchive a project
      description: >-
        For the project's admins, and its members who are the workspace's
        admins. The project is no longer archived (archived_at null), and
        can be changed again; one that is not archived stays so. A project
        that does not exist, is deleted, or that the caller does not see
        answers project.not_found; one he sees but may not unarchive,
        forbidden. The role is decided after the project row is locked.
      security: [{bearer: []}]
      x-problem-codes: [project.not_found, forbidden]
      responses:
        '200':
          description: The project as unarchived, as the caller sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}/join:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: joinProject
      tags: [project]
      summary: Join a project
      description: >-
        For the workspace's admins and members who see the project: its
        admins join any project, its members a public one. The caller
        becomes its member with his workspace role; one who was its member
        before has his membership back, with the lesser of the role it had
        and his workspace role. He is given display settings in the
        project unless he has them. One who is an active member already is
        left as he is. An archived project is joined as any other. A
        project that does not exist, is deleted, or that the caller does
        not see answers project.not_found; a workspace guest who sees it,
        as its member, forbidden.
      security: [{bearer: []}]
      x-problem-codes: [project.not_found, forbidden]
      responses:
        '200':
          description: The project as the caller sees it, now its member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}/leave:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: leaveProject
      tags: [project]
      summary: Leave a project
      description: >-
        Every active member of the project leaves it himself. A project that
        does not exist, is deleted, or that the caller does not see answers
        project.not_found; one he sees but is not a member of, forbidden.
        Its only active admin is refused project.sole_admin, also when he is
        its only member: the project gets another admin first, or is
        deleted. A member who is a workspace admin but no admin of the
        project leaves as any member. His membership ends, its row and its
        role kept, at the moment of the request; his display settings in
        the project stay. An archived project is left as any other. The role
        is decided after the workspace and project rows are locked.
      security: [{bearer: []}]
      x-problem-codes: [project.not_found, forbidden, project.sole_admin]
      responses:
        '204':
          description: The caller's membership has ended.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listProjectMembers
      tags: [project]
      summary: List a project's members
      description: >-
        For the project's active members: its active members, each with his
        role in it, in the order they became members. A project that does
        not exist, is deleted, or that the caller does not see answers
        project.not_found; one he sees but is not a member of, forbidden.
      security: [{bearer: []}]
      x-problem-codes: [project.not_found, forbidden]
      responses:
        '200':
          description: The project's active members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: addProjectMembers
      tags: [project]
      summary: Add workspace members to a project
      description: >-
        For the project's admins, and its members who are the workspace's
        admins. Adds 1–100 accounts, each an active member of the workspace,
        with the role given: a workspace admin as an admin (20), a workspace
        guest as a guest (5), a workspace member as any of the three. One
        who was a member of the project before has his membership back, with
        the role given. Each is given display settings in the project, the
        project first in his sidebar, unless he has them. Refused from the
        request alone, before the project is looked at (validation_failed):
        no account, or more than 100 (members too_short, too_long; more than
        100 is the one problem named), an account named twice
        (members[i].member_id duplicate), and a role not one of the three
        (members[i].role invalid_format). Then, after the caller's role, so
        that who may not add learns nothing of the accounts, refused each by
        its place in members (validation_failed): an account that is not an
        active member of the workspace (member_id not_allowed), one that is
        an active member of the project already (member_id duplicate), and a
        role his workspace role does not allow (role not_allowed). An
        archived project's members are added as any other's. A project that
        does not exist, is deleted, or that the caller does not see answers
        project.not_found; one he sees but may not add to, forbidden.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, project.not_found, forbidden]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMembersAdd'
      responses:
        '201':
          description: The accounts' memberships, in the request's order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/project-members/{project_member_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectMemberID'
    patch:
      operationId: updateProjectMember
      tags: [project]
      summary: Change a project member's role
      description: >-
        For the project's admins, and its members who are the workspace's
        admins. The role is checked first (validation_failed). A membership
        that does not exist or is deleted, or whose project the caller does
        not see, answers project.member_not_found; a caller who sees the
        project but may not change roles in it, forbidden, whatever the
        membership. To a caller who may change roles, a membership that has
        ended answers project.member_not_found. One who is not a workspace
        admin cannot change his own role (project.own_membership), nor the
        role of a member whose role is not below his own, nor give a role
        that is not below his own (project.role_too_high): through this
        operation a project admin who is not a workspace admin makes nobody
        an admin and changes no admin's role. The rule is this operation's
        alone: addProjectMembers has none, so he can still add a workspace
        member as an admin, or remove a member whose role is not above his
        own and add him back with any role his workspace role allows. A
        workspace guest's role stays a guest's, whoever changes it
        (validation_failed, role not_allowed). An archived project's members
        have their roles changed as any other's. The role is decided after
        the workspace and project rows are locked.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, project.member_not_found, forbidden, project.own_membership, project.role_too_high]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberUpdate'
      responses:
        '200':
          description: The membership with its new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeProjectMember
      tags: [project]
      summary: Remove a member from a project
      description: >-
        For the project's admins, and its members who are the workspace's
        admins. A membership that does not exist or is deleted, or whose
        project the caller does not see, answers project.member_not_found; a
        caller who sees the project but may not remove its members,
        forbidden, whatever the membership. To a caller who may remove
        members, a membership that has ended answers
        project.member_not_found; his own, project.own_membership; and one
        whose role in the project is above his own, project.role_too_high,
        the workspace's admins included. The membership ends, its row and
        its role kept, at the moment of the request, by the caller; the
        member's display settings in the project stay. An archived project's
        members are removed as any other's. The role is decided after the
        workspace and project rows are locked.
      security: [{bearer: []}]
      x-problem-codes: [project.member_not_found, forbidden, project.own_membership, project.role_too_high]
      responses:
        '204':
          description: The membership has ended.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}/states:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listStates
      tags: [project]
      summary: List a project's states
      description: >-
        For the project's active members: its states, by sequence, the
        lowest first, then by id. The intake's triage state is none of
        them. An archived project lists none. A project that does not exist,
        is deleted, or that the caller does not see answers
        project.not_found; one he sees but is not a member of, forbidden.
        The whole collection at once: collections are not paginated.
      security: [{bearer: []}]
      x-problem-codes: [project.not_found, forbidden]
      responses:
        '200':
          description: The project's states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createState
      tags: [project]
      summary: Create a state in a project
      description: >-
        For the project's admins, and its members who are the workspace's
        admins; an archived project's states are created as any other's.
        The name and the color have 1–255 characters, not blank, without
        NUL; the group is one of the five, and triage is refused
        (group not_allowed): the intake's state is not made here; the
        description has no NUL (validation_failed). The values are checked
        before the project is looked at. The new state comes after the
        project's others: its sequence is the greatest of theirs, the
        intake's triage state's left out, plus 15000, or 65535 when the
        project has none. It is not the default. Its name may not be another
        undeleted state's of the project, the intake's triage state's too,
        compared as written (project.state_name_taken). A project that does
        not exist, is deleted, or that the caller does not see answers
        project.not_found; one he sees but may not change, forbidden. The
        role is decided after the workspace and project rows are locked.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, project.not_found, forbidden, project.state_name_taken]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateCreate'
      responses:
        '201':
          description: The new state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/states/{state_id}:
    parameters:
      - $ref: '#/components/parameters/StateID'
    patch:
      operationId: updateState
      tags: [project]
      summary: Change a state
      description: >-
        For the project's admins, and its members who are the workspace's
        admins; an archived project's states change as any other's. The
        fields given change and the others stay; the values follow
        createState's rules, and the sequence is any number
        (validation_failed), checked before the state is looked at. A state
        that does not exist or is deleted, the intake's triage state, and a
        state whose project the caller does not see answer
        project.state_not_found; a caller who sees the project but may not
        change its states, forbidden, whether or not the state is the
        default or the last of its group. Moving the only state of its group
        to another group is refused (project.state_last_in_group): every
        group keeps a state. Its name may not be another undeleted state's
        of the project, the intake's triage state's too
        (project.state_name_taken). The role is decided after the workspace
        and project rows are locked.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, project.state_not_found, forbidden, project.state_name_taken, project.state_last_in_group]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateUpdate'
      responses:
        '200':
          description: The state as changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteState
      tags: [project]
      summary: Delete a state
      description: >-
        For the project's admins, and its members who are the workspace's
        admins; an archived project's states are deleted as any other's. A
        state that does not exist or is deleted, the intake's triage state,
        and a state whose project the caller does not see answer
        project.state_not_found; a caller who sees the project but may not
        change its states, forbidden, whether or not the state is the
        default or the last of its group. The project's default state is not
        deleted (project.state_default): make another state the default
        first. Nor is the only state of its group
        (project.state_last_in_group): every group keeps a state. A state
        that is both is project.state_default. The state is deleted at the
        moment of the request, by the caller, and its name is free again in
        the project. The role is decided after the workspace and project
        rows are locked.
      security: [{bearer: []}]
      x-problem-codes: [project.state_not_found, forbidden, project.state_default, project.state_last_in_group]
      responses:
        '204':
          description: The state is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/states/{state_id}/mark-default:
    parameters:
      - $ref: '#/components/parameters/StateID'
    post:
      operationId: markDefaultState
      tags: [project]
      summary: Make a state its project's default
      description: >-
        For the project's admins, and its members who are the workspace's
        admins; an archived project's default changes as any other's. The
        state becomes the project's default, and the state that was the
        default is no longer: a project has exactly one. Making the default
        state the default again leaves it so. A state that does not exist
        or is deleted, the intake's triage state, and a state whose project
        the caller does not see answer project.state_not_found; a caller
        who sees the project but may not change its states, forbidden,
        whether or not the state is the default. The role is decided after
        the workspace and project rows are locked.
      security: [{bearer: []}]
      x-problem-codes: [project.state_not_found, forbidden]
      responses:
        '204':
          description: The state is the project's default.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/states:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listWorkspaceStates
      tags: [project]
      summary: List the states of the projects the caller is a member of
      description: >-
        For the workspace's active members: the states of its projects that
        the caller is an active member of, the archived ones left out, by
        project id, then by sequence, the lowest first, then by id; each
        project's as listStates lists them, the intake's triage state none of
        them. A project the caller sees but is not a member of adds none. A
        workspace that does not exist, is deleted, or of which the caller is
        not an active member answers workspace.not_found. The whole
        collection at once: collections are not paginated.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found]
      responses:
        '200':
          description: The states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}/labels:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: createLabel
      tags: [project]
      summary: Create a label in a project
      description: >-
        For the project's admins, and its members who are the workspace's
        admins; an archived project's labels are created as any other's.
        The name has 1–255 characters, not blank, without NUL; the color has
        at most 255, without NUL, and is empty when it is left out
        (validation_failed). The values are checked before the project is
        looked at. The parent, when it is given, is a label of the project
        at the top, not one under another: labels have two levels
        (parent_id not_allowed). The new label comes after the project's
        others: its sort order is the greatest of theirs plus 10000, or
        65535 when the project has none; updateLabel moves it. The name may
        not be another undeleted label's of the project, in any case
        (project.label_name_taken). A project that
        does not exist, is deleted, or that the caller does not see answers
        project.not_found; one he sees but may not change, forbidden. The
        role is decided after the workspace and project rows are locked, and
        the parent is checked after it.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, project.not_found, forbidden, project.label_name_taken]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelCreate'
      responses:
        '201':
          description: The new label.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/labels/{label_id}:
    parameters:
      - $ref: '#/components/parameters/LabelID'
    patch:
      operationId: updateLabel
      tags: [project]
      summary: Change a label
      description: >-
        For the project's admins, and its members who are the workspace's
        admins; an archived project's labels change as any other's. The
        fields given change and the others stay; the values follow
        createLabel's rules, and the sort order is any number
        (validation_failed), checked before the label is looked at. A label
        that does not exist or is deleted, and a label whose project the
        caller does not see, answer project.label_not_found; a caller who
        sees the project but may not change its labels, forbidden. A parent
        given is a label of the project at the top, not the label itself,
        and a label with labels under it takes none: labels have two levels
        (parent_id not_allowed); a null parent moves the label to the top.
        The name may not be another undeleted label's of the project, in any
        case (project.label_name_taken). The role is decided after the
        workspace and project rows are locked, and the parent is checked
        after it.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, project.label_not_found, forbidden, project.label_name_taken]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelUpdate'
      responses:
        '200':
          description: The label as changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteLabel
      tags: [project]
      summary: Delete a label and the labels under it
      description: >-
        For the project's admins, and its members who are the workspace's
        admins; an archived project's labels are deleted as any other's. A
        label that does not exist or is deleted, and a label whose project
        the caller does not see, answer project.label_not_found; a caller
        who sees the project but may not change its labels, forbidden. The
        label and the labels under it are deleted at the moment of the
        request, by the caller, and their names are free again in the
        project. The role is decided after the workspace and project rows
        are locked.
      security: [{bearer: []}]
      x-problem-codes: [project.label_not_found, forbidden]
      responses:
        '204':
          description: The label and the labels under it are deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/projects/{project_id}/preferences:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: getProjectPreferences
      tags: [project]
      summary: Read the caller's display settings in a project
      description: >-
        The caller's own settings in the project, for its active members: the
        tab bar of its header and its place in his sidebar. While he has none
        stored they are the defaults, work_items with nothing hidden and
        65535, and reading them writes nothing. A project that does not
        exist, is deleted, or that the caller does not see answers
        project.not_found; one he sees but is not a member of, forbidden.
      security: [{bearer: []}]
      x-problem-codes: [project.not_found, forbidden]
      responses:
        '200':
          description: The caller's settings in the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPreferences'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateProjectPreferences
      tags: [project]
      summary: Change the caller's display settings in a project
      description: >-
        For the project's active members, their own settings. The fields
        given change and the others stay; navigation is replaced whole, and
        the first change stores the caller's settings, the defaults with the
        change applied. A tab the web app does not have, work_items hidden,
        and a tab hidden twice are refused (validation_failed), before the
        project is looked at. An archived project's settings change as any
        other's. A project that does not exist, is deleted, or that the
        caller does not see answers project.not_found; one he sees but is
        not a member of, forbidden.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, project.not_found, forbidden]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPreferencesUpdate'
      responses:
        '200':
          description: The caller's settings as changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPreferences'
        default:
          $ref: '#/components/responses/Problem'
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份（M0-P3 交接 3）
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: A workspace's slug, as in the web app's address.
      schema:
        type: string
    ProjectID:
      name: project_id
      in: path
      required: true
      description: A project's id (Project.id).
      schema:
        type: string
        format: uuid
    StateID:
      name: state_id
      in: path
      required: true
      description: A state's id (State.id).
      schema:
        type: string
        format: uuid
    ProjectMemberID:
      name: project_member_id
      in: path
      required: true
      description: A project membership's id (ProjectMember.id), not the member's account id.
      schema:
        type: string
        format: uuid
    LabelID:
      name: label_id
      in: path
      required: true
      description: A label's id (Label.id).
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited and server_busy.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '../common.yaml#/components/schemas/Problem'
  schemas:
    ProjectRole:
      description: A member's role in a project, 5 guest, 15 member, 20 admin.
      type: integer
      enum: [5, 15, 20]
    ProjectNetwork:
      description: >-
        Who sees the project besides its members and the workspace's admins:
        0 private, nobody; 2 public, the workspace's members too.
      type: integer
      enum: [0, 2]
    LogoProps:
      description: >-
        A project's icon, the web app's TLogoProps: every field optional, and
        {} no icon.
      type: object
      additionalProperties: false
      properties:
        in_use:
          description: Which of the two icons the project shows.
          type: string
          enum: [emoji, icon]
        emoji:
          $ref: '#/components/schemas/LogoEmoji'
        icon:
          $ref: '#/components/schemas/LogoIcon'
    LogoEmoji:
      type: object
      additionalProperties: false
      properties:
        value:
          description: The emoji, as the web app's picker gives it.
          type: string
        url:
          description: The address of a custom emoji.
          type: string
    LogoIcon:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        color:
          type: string
        background_color:
          type: string
    Project:
      description: >-
        A project, as the caller sees it: member_role and sort_order are his,
        null when he is not an active member.
      type: object
      additionalProperties: false
      required: [id, workspace_id, name, description, identifier, network, project_lead_id, default_assignee_id, cycle_view, module_view,
        issue_views_view, intake_view, guest_view_all_features, archive_in, archived_at, logo_props, timezone, cover_image_url, member_role,
        sort_order, member_ids, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        identifier:
          description: Upper case; it prefixes the numbers of the project's work items.
          type: string
        network:
          $ref: '#/components/schemas/ProjectNetwork'
        project_lead_id:
          type: [string, 'null']
          format: uuid
        default_assignee_id:
          description: Whom a new work item is assigned to when nobody is given.
          type: [string, 'null']
          format: uuid
        cycle_view:
          description: Whether the project shows cycles.
          type: boolean
        module_view:
          description: Whether the project shows modules.
          type: boolean
        issue_views_view:
          description: Whether the project shows views.
          type: boolean
        intake_view:
          description: Whether the project shows intake.
          type: boolean
        guest_view_all_features:
          description: Whether the project's guests see every work item, not only their own.
          type: boolean
        archive_in:
          description: After how many months a closed work item is archived, 0–12; 0 never.
          type: integer
        archived_at:
          description: When the project was archived; null while it is not.
          type: [string, 'null']
          format: date-time
        logo_props:
          $ref: '#/components/schemas/LogoProps'
        timezone:
          description: An IANA time zone name.
          type: string
        cover_image_url:
          description: Null until uploads arrive (M5).
          type: [string, 'null']
        member_role:
          description: The caller's role in the project; null when he is not an active member.
          oneOf:
            - $ref: '#/components/schemas/ProjectRole'
            - type: 'null'
        sort_order:
          description: >-
            The project's place in the caller's sidebar, lowest first; null when
            it has none there: the caller is not an active member of the
            project, or has no display settings in it.
          type: [number, 'null']
        member_ids:
          description: The accounts of the active members, in the order they joined, then by id.
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    IdentifierAvailability:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available:
          type: boolean
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name, identifier]
      properties:
        name:
          description: >-
            1–255 characters, not blank, without any of
            & + , : ; $ ^ } { * = ? @ # | ' < > . ( ) % ! -
          type: string
        identifier:
          description: 1–10 of A-Z, 0-9 and ÇŞĞİÖÜ, once upper-cased.
          type: string
        description:
          type: string
        network:
          $ref: '#/components/schemas/ProjectNetwork'
        project_lead_id:
          description: An active admin or member of the workspace; he becomes an admin of the project.
          type: string
          format: uuid
        logo_props:
          $ref: '#/components/schemas/LogoProps'
        timezone:
          description: An IANA time zone name, e.g. from GET /api/v0/timezones; the workspace's when not given.
          type: string
    ProjectUpdate:
      description: >-
        Changes the fields it names; a field left out keeps its value. Only
        project_lead_id and default_assignee_id can be null, which clears
        them.
      type: object
      additionalProperties: false
      properties:
        name:
          description: >-
            1–255 characters, not blank, without any of
            & + , : ; $ ^ } { * = ? @ # | ' < > . ( ) % ! -
          type: string
        identifier:
          description: 1–10 of A-Z, 0-9 and ÇŞĞİÖÜ, once upper-cased.
          type: string
        description:
          type: string
        network:
          $ref: '#/components/schemas/ProjectNetwork'
        project_lead_id:
          description: An active member of the project who is not its guest; null for none.
          type: [string, 'null']
          format: uuid
        default_assignee_id:
          description: An active member of the project who is not its guest; null for none.
          type: [string, 'null']
          format: uuid
        cycle_view:
          type: boolean
        module_view:
          type: boolean
        issue_views_view:
          type: boolean
        intake_view:
          type: boolean
        guest_view_all_features:
          type: boolean
        archive_in:
          description: After how many months a closed work item is archived, 0–12; 0 never.
          type: integer
        logo_props:
          $ref: '#/components/schemas/LogoProps'
        timezone:
          description: An IANA time zone name.
          type: string
    ProjectTab:
      description: A tab of a project's header.
      type: string
      enum: [work_items, cycles, modules, views, intake]
    ProjectNavigation:
      description: >-
        The tab bar of a project's header, as the caller has it: the tab the
        project opens on, and the tabs moved under "more", each once and
        never work_items.
      type: object
      additionalProperties: false
      required: [default_tab, hide_in_more_menu]
      properties:
        default_tab:
          $ref: '#/components/schemas/ProjectTab'
        hide_in_more_menu:
          type: array
          items:
            $ref: '#/components/schemas/ProjectTab'
    ProjectPreferences:
      description: The caller's display settings in a project.
      type: object
      additionalProperties: false
      required: [navigation, sort_order]
      properties:
        navigation:
          $ref: '#/components/schemas/ProjectNavigation'
        sort_order:
          description: The project's place in the caller's sidebar, lowest first.
          type: number
    ProjectPreferencesUpdate:
      description: >-
        Changes the fields it names; a field left out keeps its value, and
        navigation replaces the tab bar whole.
      type: object
      additionalProperties: false
      properties:
        navigation:
          $ref: '#/components/schemas/ProjectNavigation'
        sort_order:
          description: The project's place in the caller's sidebar, lowest first.
          type: number
    ProjectMember:
      description: An active membership of a project.
      type: object
      additionalProperties: false
      required: [id, project_id, member_id, role, created_at]
      properties:
        id:
          description: The membership's id, which /project-members/{project_member_id} names.
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        member_id:
          description: The member's account.
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/ProjectRole'
        created_at:
          description: When the membership was made; one restored keeps its time.
          type: string
          format: date-time
    ProjectMemberList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
    ProjectMembersAdd:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          description: 1–100 accounts, each named once.
          type: array
          items:
            $ref: '#/components/schemas/ProjectMemberNew'
    ProjectMemberNew:
      type: object
      additionalProperties: false
      required: [member_id, role]
      properties:
        member_id:
          description: An active member of the workspace.
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/ProjectRole'
    ProjectMemberUpdate:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/ProjectRole'
    StateGroup:
      description: >-
        The group a state is in: backlog, unstarted, started, completed or
        cancelled. Every group of a project keeps a state.
      type: string
      enum: [backlog, unstarted, started, completed, cancelled]
    State:
      description: A state of a project, in one of the groups of StateGroup.
      type: object
      additionalProperties: false
      required: [id, workspace_id, project_id, name, description, color, group, default, sequence, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        color:
          description: As the web app's color picker gives it, e.g. "#F59E0B".
          type: string
        group:
          $ref: '#/components/schemas/StateGroup'
        default:
          description: Whether the state is its project's default state; a project has exactly one.
          type: boolean
        sequence:
          description: The state's place among the project's states, the lowest first.
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StateList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/State'
    StateCreate:
      type: object
      additionalProperties: false
      required: [name, color, group]
      properties:
        name:
          description: 1–255 characters, not blank; another undeleted state of the project may not have it.
          type: string
        color:
          description: 1–255 characters, not blank.
          type: string
        group:
          $ref: '#/components/schemas/StateGroup'
        description:
          type: string
    StateUpdate:
      description: Changes the fields it names; a field left out keeps its value.
      type: object
      additionalProperties: false
      properties:
        name:
          description: 1–255 characters, not blank; another undeleted state of the project may not have it.
          type: string
        color:
          description: 1–255 characters, not blank.
          type: string
        group:
          $ref: '#/components/schemas/StateGroup'
        description:
          type: string
        sequence:
          description: The state's place among the project's states, the lowest first.
          type: number
    Label:
      description: A label of a project, at the top or under a label at the top.
      type: object
      additionalProperties: false
      required: [id, workspace_id, project_id, parent_id, name, color, sort_order, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        parent_id:
          description: The label it is under; null for a label at the top.
          type: [string, 'null']
          format: uuid
        name:
          type: string
        color:
          description: As the web app's color picker gives it, e.g. "#F59E0B"; empty for none.
          type: string
        sort_order:
          description: The label's place among the project's labels, the lowest first.
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LabelCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: 1–255 characters, not blank; another undeleted label of the project may not have it, in any case.
          type: string
        color:
          description: At most 255 characters; empty when left out.
          type: string
        parent_id:
          description: A label of the project at the top, which the new label goes under; left out for a label at the top.
          type: string
          format: uuid
    LabelUpdate:
      description: >-
        Changes the fields it names; a field left out keeps its value. Only
        parent_id can be null, which moves the label to the top.
      type: object
      additionalProperties: false
      properties:
        name:
          description: 1–255 characters, not blank; another undeleted label of the project may not have it, in any case.
          type: string
        color:
          description: At most 255 characters; empty for none.
          type: string
        parent_id:
          description: A label of the project at the top, not this one, which the label goes under; null for the top.
          type: [string, 'null']
          format: uuid
        sort_order:
          description: The label's place among the project's labels, the lowest first.
          type: number
