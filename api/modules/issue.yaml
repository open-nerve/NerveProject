          format: date-time
    IssueListOrder:
      type: string
      enum: [created_at, '-created_at', updated_at, '-updated_at', start_date, '-start_date', target_date, '-target_date', priority, '-priority', state_name, '-state_name', label_name, '-label_name', assignee_name, '-assignee_name', sub_issues_count, '-sub_issues_count', sort_order]
    IssueListGroupField:
      description: Project lists exclude project_id; member lists use their narrower page vocabulary.
      type: string
      enum: [state_id, state_group, priority, label_id, assignee_id, created_by_id, target_date, project_id]
    IssueListPage:
      description: >-
        Flat pages and selected group/cell pages have total, data and next_cursor.
        Grouped pages have total and groups. Lanes have total, groups and
        subgroup_totals. Other branch fields are omitted. Arrays are never null.
      type: object
      additionalProperties: false
      required: [total]
      properties:
        total:
          type: integer
          format: int64
        data:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        next_cursor:
          $ref: '../common.yaml#/components/schemas/NextCursor'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/IssueListGroup'
        subgroup_totals:
          type: array
          items:
            $ref: '#/components/schemas/IssueListTotal'
    IssueListGroup:
      description: A group page has data and next_cursor; a lane group has subgroups instead.
      type: object
      additionalProperties: false
      required: [key, total]
      properties:
        key: {type: string}
        total: {type: integer, format: int64}
        data:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        next_cursor:
          $ref: '../common.yaml#/components/schemas/NextCursor'
        subgroups:
          type: array
          items:
            $ref: '#/components/schemas/IssueListSubgroup'
    IssueListSubgroup:
      type: object
      additionalProperties: false
      required: [key, total, data, next_cursor]
      properties:
        key: {type: string}
        total: {type: integer, format: int64}
        data:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        next_cursor:
          $ref: '../common.yaml#/components/schemas/NextCursor'
    IssueListTotal:
      type: object
      additionalProperties: false
      required: [key, total]
      properties:
        key: {type: string}
        total: {type: integer, format: int64}
    IssueCollection:
      description: Work items, all of them, without pages.
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
    SubIssuesAdd:
      type: object
      additionalProperties: false
      required: [sub_issue_ids]
      properties:
        sub_issue_ids:
          description: >-
            1–100 work items of the project, each named once, to put under
            the work item.
          type: array
          items:
            type: string
            format: uuid
    IssueRelationType:
      description: >-
        A relation's type as one of its work items reads it: relates_to and
        duplicate read the same from both; the work item blocked_by another
        reads as blocking from it.
      type: string
      enum: [relates_to, duplicate, blocked_by, blocking]
    IssueRelation:
      description: A relation of a work item to another, as the work item reads it; issue is the other, as a list shows it.
      type: object
      additionalProperties: false
      required: [id, relation_type, issue, created_at]
      properties:
        id:
          type: string
          format: uuid
        relation_type:
          $ref: '#/components/schemas/IssueRelationType'
        issue:
          $ref: '#/components/schemas/Issue'
        created_at:
          type: string
          format: date-time
    IssueRelationCollection:
      description: Relations of a work item, all of them, without pages.
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IssueRelation'
    IssueRelationsCreate:
      type: object
      additionalProperties: false
      required: [relation_type, issue_ids]
      properties:
        relation_type:
          $ref: '#/components/schemas/IssueRelationType'
        issue_ids:
          description: >-
            1–20 work items of the workspace, each named once, to relate the
            work item to.
          type: array
          items:
            type: string
            format: uuid
    IssueCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        description_html:
          description: Sanitized rich text HTML; at most 500000 characters on input.
          type: string
        name:
          description: 1–255 characters without the white space around it, which is not stored.
          type: string
        state_id:
          description: One of the project's states, not its triage state; left out for the project's default state.
          type: string
          format: uuid
        priority:
          $ref: '#/components/schemas/IssuePriority'
        assignee_ids:
          description: >-
            At most 100 accounts, each named once, each an active member of
            the project who is not its guest; left out, or empty, for the
            project's default assignee while he is one, else no one.
          type: array
          items:
            type: string
            format: uuid
        label_ids:
          description: At most 100 of the project's labels, each named once.
          type: array
          items:
            type: string
            format: uuid
        start_date:
          description: The day it starts, as YYYY-MM-DD; left out for none.
          type: string
          format: date
        target_date:
          description: The day it is due, as YYYY-MM-DD, not before start_date; left out for none.
          type: string
          format: date
        parent_id:
          description: >-
            The work item it is under: one of the project's that is not
            archived; left out for none.
          type: string
          format: uuid
    IssueUpdate:
      description: Changes the fields it names; a field left out keeps its value.
      type: object
      additionalProperties: false
      properties:
        sort_order:
          description: Finite sort order; zero allowed, omitted keeps the stored value. Cannot accompany skip_activity.
          type: number
        skip_activity:
          description: Only with description_html alone; preserves audit when content identity is unchanged.
          type: boolean
        description_html:
          description: Sanitized rich text HTML; at most 500000 characters on input.
          type: string
        name:
          description: 1–255 characters without the white space around it, which is not stored.
          type: string
        state_id:
          description: One of the project's states, not its triage state.
          type: string
          format: uuid
        priority:
          $ref: '#/components/schemas/IssuePriority'
        assignee_ids:
          description: >-
            The work item's new assignees, empty for none: at most 100
            accounts, each named once; each it is not assigned to yet an
            active member of the project who is not its guest.
          type: array
          items:
            type: string
            format: uuid
        label_ids:
          description: >-
            The work item's new labels, empty for none: at most 100 of the
            project's labels, each named once.
          type: array
          items:
            type: string
            format: uuid
        start_date:
          description: >-
            The day it starts, as YYYY-MM-DD; null for none. Not after the
            target date the work item then has.
          type: [string, 'null']
          format: date
        target_date:
          description: >-
            The day it is due, as YYYY-MM-DD; null for none. Not before the
            start date the work item then has.
          type: [string, 'null']
          format: date
        parent_id:
          description: >-
            The work item it is under, null for none: one of the project's
            that the caller sees, not archived, and neither this work item
            nor one under it. It is compared with the parent the caller is
            answered, a parent he does not see counting as none: sending
            back the null he was answered changes nothing, and naming a work
            item he does not see is refused as naming one not there.
          type: [string, 'null']
          format: uuid

