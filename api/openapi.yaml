# Nerve 接口描述的入口：列出所有路径，指向各模块的描述文件。
# make gen-web 用 Redocly 把它打包成 dist/openapi.yaml。
openapi: 3.1.0
info:
  title: Nerve API
  version: v0
  description: >-
    The HTTP API of Nerve. The web app is one client of it; every account can
    use every endpoint the same way. Every operation lists the problem codes
    it can answer in x-problem-codes; the top-level x-problem-codes can come
    from every operation, and an operation that needs a bearer token can also
    answer unauthorized.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
# 所有操作都可能返回的平台错误码，只写在这里（M2 设计 3.11）
x-problem-codes: [bad_request, payload_too_large, rate_limited, internal_error]
tags:
  - name: identity
    description: Accounts, sign-in and sessions.
  - name: instance
    description: What this instance runs.
  - name: workspace
    description: Workspaces and their members.
  - name: project
    description: Projects, their members and their states.
paths:
  /api/v0/auth/register:
    $ref: 'modules/identity.yaml#/paths/~1api~1v0~1auth~1register'
  /api/v0/auth/login:
    $ref: 'modules/identity.yaml#/paths/~1api~1v0~1auth~1login'
  /api/v0/auth/refresh:
    $ref: 'modules/identity.yaml#/paths/~1api~1v0~1auth~1refresh'
  /api/v0/auth/logout:
    $ref: 'modules/identity.yaml#/paths/~1api~1v0~1auth~1logout'
  /api/v0/me:
    $ref: 'modules/identity.yaml#/paths/~1api~1v0~1me'
  /api/v0/me/deactivate:
    $ref: 'modules/identity.yaml#/paths/~1api~1v0~1me~1deactivate'
  /api/v0/me/change-password:
    $ref: 'modules/identity.yaml#/paths/~1api~1v0~1me~1change-password'
  /api/v0/me/profile:
    $ref: 'modules/identity.yaml#/paths/~1api~1v0~1me~1profile'
  /api/v0/me/api-tokens:
    $ref: 'modules/identity.yaml#/paths/~1api~1v0~1me~1api-tokens'
  /api/v0/api-tokens/{token_id}:
    $ref: 'modules/identity.yaml#/paths/~1api~1v0~1api-tokens~1{token_id}'
  /api/v0/instance:
    $ref: 'modules/instance.yaml#/paths/~1api~1v0~1instance'
  /api/v0/timezones:
    $ref: 'modules/instance.yaml#/paths/~1api~1v0~1timezones'
  /api/v0/workspaces:
    $ref: 'modules/workspace.yaml#/paths/~1api~1v0~1workspaces'
  /api/v0/workspaces/{slug}:
    $ref: 'modules/workspace.yaml#/paths/~1api~1v0~1workspaces~1{slug}'
  /api/v0/workspaces/{slug}/members:
    $ref: 'modules/workspace.yaml#/paths/~1api~1v0~1workspaces~1{slug}~1members'
  /api/v0/workspaces/{slug}/invitations:
    $ref: 'modules/workspace.yaml#/paths/~1api~1v0~1workspaces~1{slug}~1invitations'
  /api/v0/workspace-members/{workspace_member_id}:
    $ref: 'modules/workspace.yaml#/paths/~1api~1v0~1workspace-members~1{workspace_member_id}'
  /api/v0/workspace-invitations/{invitation_id}:
    $ref: 'modules/workspace.yaml#/paths/~1api~1v0~1workspace-invitations~1{invitation_id}'
  /api/v0/workspace-invitations/{invitation_id}/accept:
    $ref: 'modules/workspace.yaml#/paths/~1api~1v0~1workspace-invitations~1{invitation_id}~1accept'
  /api/v0/workspace-invitations/{invitation_id}/decline:
    $ref: 'modules/workspace.yaml#/paths/~1api~1v0~1workspace-invitations~1{invitation_id}~1decline'
  /api/v0/workspace-slugs/{slug}:
    $ref: 'modules/workspace.yaml#/paths/~1api~1v0~1workspace-slugs~1{slug}'
  /api/v0/me/workspaces/{slug}/preferences:
    $ref: 'modules/workspace.yaml#/paths/~1api~1v0~1me~1workspaces~1{slug}~1preferences'
  /api/v0/workspaces/{slug}/projects:
    $ref: 'modules/project.yaml#/paths/~1api~1v0~1workspaces~1{slug}~1projects'
  /api/v0/workspaces/{slug}/project-identifiers/{identifier}:
    $ref: 'modules/project.yaml#/paths/~1api~1v0~1workspaces~1{slug}~1project-identifiers~1{identifier}'
  /api/v0/projects/{project_id}:
    $ref: 'modules/project.yaml#/paths/~1api~1v0~1projects~1{project_id}'
  /api/v0/projects/{project_id}/archive:
    $ref: 'modules/project.yaml#/paths/~1api~1v0~1projects~1{project_id}~1archive'
  /api/v0/projects/{project_id}/unarchive:
    $ref: 'modules/project.yaml#/paths/~1api~1v0~1projects~1{project_id}~1unarchive'
  /api/v0/projects/{project_id}/join:
    $ref: 'modules/project.yaml#/paths/~1api~1v0~1projects~1{project_id}~1join'
  /api/v0/projects/{project_id}/members:
    $ref: 'modules/project.yaml#/paths/~1api~1v0~1projects~1{project_id}~1members'
  /api/v0/me/projects/{project_id}/preferences:
    $ref: 'modules/project.yaml#/paths/~1api~1v0~1me~1projects~1{project_id}~1preferences'
components:
  # 模块文件的 securitySchemes 在打包时被丢掉，操作引用的 scheme 写在这里（M0-P3 交接 3）
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        An access token (JWT) from register, login or refresh, or a personal
        access token (nrv_pat_…).
