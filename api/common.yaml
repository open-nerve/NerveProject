# 各模块共用的组件，Go 类型生成在 server/internal/platform/httpserver/apigen（make gen-go）。
# 模块这样引用：$ref: '../common.yaml#/components/schemas/<名字>'。
# 只放 schemas 和 parameters，不放 responses：跨文件引用 response 时，oapi-codegen
# 要求共享包也生成 strict server（见 docs/v0/M0-foundation/specs/P3-api-contract.md 2.4）。
openapi: 3.1.0
info:
  title: Nerve common components
  version: v0
components:
  # 分页（M2 设计 3.12）：每个列表接口引用 Limit、Cursor，响应的 next_cursor 是 NextCursor
  parameters:
    Limit:
      name: limit
      in: query
      description: >-
        The page size, 1–100; 50 when absent. Outside that range the answer is
        422 validation_failed on limit.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: >-
        The next_cursor of the page before; absent for the first page. A
        cursor that does not decode, has an unknown version or a payload of
        another shape than this list's, or is not spelled as the server
        writes it is 400 bad_request on cursor.
      schema:
        type: string
  schemas:
    NextCursor:
      description: The cursor of the next page; null on the last page.
      type: [string, 'null']
    Problem:
      description: >-
        RFC 9457 problem details (v0 design 3.5). `title` is the HTTP status
        phrase, `detail` explains this occurrence, and clients branch on `code`.
        Must match httpserver.Problem; the platform's contract test checks it.
      type: object
      additionalProperties: false
      required: [status, code, title]
      properties:
        status:
          description: HTTP status code.
          type: integer
        code:
          description: >-
            Stable error code. Platform codes have no prefix (bad_request,
            unauthorized, forbidden, not_found, payload_too_large,
            validation_failed, rate_limited, server_busy, internal_error,
            not_ready); module codes are prefixed with the module that
            refuses, e.g. identity.email_taken, whichever module's operation
            answers them. Each operation lists the codes it can answer in
            x-problem-codes.
          type: string
        title:
          description: HTTP status phrase, e.g. "Not Found".
          type: string
        detail:
          description: What went wrong in this occurrence.
          type: string
        errors:
          description: The invalid fields of the request.
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      description: >-
        One invalid field of a request. Clients show text looked up by `code`;
        `message` is an English explanation for developers. Must match
        httpserver.FieldError and the field codes of internal/shared.
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          description: >-
            The field's path in the request body, e.g. password or tags[1].name.
            A path longer than 256 bytes is cut short and ends with `…`.
          type: string
        code:
          description: What is wrong with the field.
          type: string
          enum:
            - required
            - invalid_format
            - too_short
            - too_long
            - out_of_range
            - not_allowed
            - duplicate
            - weak_password
            - common_password
            - must_be_future
            - contains_url
        message:
          type: string
    # 链接预览的元数据（M4 设计 3.11）：工作项链接与模块链接共用（M6 设计 3.2）
    LinkMetadataError:
      type: string
      enum: [blocked, failed]
    LinkMetadata:
      type: object
      additionalProperties: false
      properties:
        title:
          type: [string, 'null']
        favicon:
          type: [string, 'null']
        url:
          type: [string, 'null']
        favicon_url:
          type: [string, 'null']
        error:
          oneOf:
            - $ref: '#/components/schemas/LinkMetadataError'
            - type: 'null'
    # 工作项列表的显示设置（M6/P3b spec R5）：项目、迭代、模块三页共用；筛选按页各自，不在这里
    IssueListCalendar:
      type: object
      additionalProperties: false
      required: [layout, show_weekends]
      properties:
        layout:
          type: string
        show_weekends:
          type: boolean
    IssueListDisplayFilters:
      type: object
      additionalProperties: false
      required: [layout, group_by, sub_group_by, order_by, sub_issue, show_empty_groups, calendar]
      properties:
        layout:
          type: string
        group_by:
          type: [string, 'null']
        sub_group_by:
          type: [string, 'null']
        order_by:
          type: string
        sub_issue:
          type: boolean
        show_empty_groups:
          type: boolean
        calendar:
          $ref: '#/components/schemas/IssueListCalendar'
    IssueListDisplayProperties:
      type: object
      additionalProperties: false
      required: [assignee, start_date, due_date, labels, key, priority, state, sub_issue_count, link, attachment_count, created_on, updated_on, cycle, modules]
      properties:
        assignee:
          type: boolean
        start_date:
          type: boolean
        due_date:
          type: boolean
        labels:
          type: boolean
        key:
          type: boolean
        priority:
          type: boolean
        state:
          type: boolean
        sub_issue_count:
          type: boolean
        link:
          type: boolean
        attachment_count:
          description: Whether lists show a work item's number of live ordinary attachments.
          type: boolean
        created_on:
          type: boolean
        updated_on:
          type: boolean
        cycle:
          description: Whether lists show a work item's cycle.
          type: boolean
        modules:
          description: Whether lists show a work item's modules.
          type: boolean
