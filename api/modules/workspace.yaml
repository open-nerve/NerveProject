# workspace 模块的接口（M3 设计 5.1、5.2）。生成的 Go 代码在
# server/internal/modules/workspace/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve workspace API
  version: v0
paths:
  /api/v0/workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspace]
      summary: List the caller's workspaces
      description: >-
        The workspaces of which the caller is an active member, each with the
        caller's role and the number of active members, by name and then by
        id. The whole collection at once: collections are not paginated.
      security: [{bearer: []}]
      x-problem-codes: []
      responses:
        '200':
          description: The caller's workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWorkspace
      tags: [workspace]
      summary: Create a workspace with the caller as its admin
      description: >-
        Creates the workspace and makes the caller its admin and only member;
        nothing else is created with it. While the instance's
        workspace_creation_enabled is false, an authenticated, well-formed
        request answers workspace.creation_disabled before its values are
        looked at, and the server's administrator creates workspaces with
        `nerve workspaces create`. The name has 1–80 characters with a letter
        or a digit and no web address, and a NUL character in it is refused
        (invalid_format); the slug has 1–48 lower-case letters, digits, - and
        _, and is neither reserved (not_allowed) nor another undeleted
        workspace's (workspace.slug_taken). An account deactivated meanwhile
        answers unauthorized.
      security: [{bearer: []}]
      x-problem-codes: [workspace.creation_disabled, validation_failed, workspace.slug_taken]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: The new workspace; the caller is its admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Read a workspace
      description: >-
        A workspace that does not exist, is deleted, or of which the caller
        is not an active member answers the same workspace.not_found.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found]
      responses:
        '200':
          description: The workspace, with the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWorkspace
      tags: [workspace]
      summary: Change a workspace's name, organization size or time zone
      description: >-
        For the workspace's admins. The fields given change and the others
        stay; the values follow createWorkspace's rules (validation_failed),
        checked before the workspace is looked at. The slug never changes: a
        body with slug is refused (bad_request). A workspace that does not
        exist, is deleted, or of which the caller is not an active member
        answers workspace.not_found; a member or a guest, forbidden. The role
        is decided after the workspace row is locked, so a caller demoted
        meanwhile is refused.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, workspace.not_found, forbidden]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: The workspace as changed, with the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteWorkspace
      tags: [workspace]
      summary: Delete a workspace
      description: >-
        For the workspace's admins. The workspace, its invitations, its
        memberships and the members' display settings are soft-deleted in one
        transaction, at the same moment; the members' accounts stay. The slug can name a new
        workspace at once. Nobody's last_workspace_id is cleared. A
        workspace that does not exist, is deleted, or of which the caller is
        not an active member answers workspace.not_found; a member or a
        guest, forbidden.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found, forbidden]
      responses:
        '204':
          description: The workspace is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/members:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listWorkspaceMembers
      tags: [workspace]
      summary: List a workspace's members
      description: >-
        Every membership of the workspace, those that ended too (is_active
        false), in the order they began, then by id, each with the member's
        public profile. For any active member. The addresses are shown to
        admins and members; to a guest every address is null, his own too.
        A workspace that does not exist, is deleted, or of which the caller
        is not an active member answers workspace.not_found. The whole
        collection at once: collections are not paginated.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found]
      responses:
        '200':
          description: The workspace's memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/invitations:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listWorkspaceInvitations
      tags: [workspace]
      summary: List a workspace's invitations
      description: >-
        The workspace's invitations, pending and declined, newest first, then
        by id, each with the token of its link: for the workspace's admins
        alone. An accepted invitation is no longer listed. A workspace that
        does not exist, is deleted, or of which the caller is not an active
        member answers workspace.not_found; a member or a guest, forbidden.
        The whole collection at once: collections are not paginated.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found, forbidden]
      responses:
        '200':
          description: The workspace's invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWorkspaceInvitations
      tags: [workspace]
      summary: Invite addresses to a workspace
      description: >-
        For the workspace's admins. Each address is normalized as at
        registration (surrounding white space removed, lower case) and the
        batch is checked first: 1–100 invitations, each address valid
        (invalid_format) and listed once (duplicate), each role one of the
        three (invalid_format). Then, the workspace looked at: an active
        member's address is not_allowed, and an address with an invitation
        to the workspace, pending or declined, duplicate, also when another
        request invites it at the same time. The batch is refused as a whole,
        one validation_failed naming each invitations[i] of the request as
        sent. A declined invitation holds its address until it is deleted.
        The answer is the new invitations in the request's order, each with
        the token of its link. A workspace that does not exist, is deleted,
        or of which the caller is not an active member answers
        workspace.not_found; a member or a guest, forbidden. A credential
        revoked meanwhile, by a password reset, answers unauthorized, and
        nothing is invited.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, workspace.not_found, forbidden]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitationsCreate'
      responses:
        '201':
          description: The new invitations, in the request's order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-members/{workspace_member_id}:
    parameters:
      - name: workspace_member_id
        in: path
        required: true
        description: A membership's id (WorkspaceMember.id), not the member's account id.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateWorkspaceMember
      tags: [workspace]
      summary: Change a member's role
      description: >-
        For the workspace's admins. The role is checked first
        (validation_failed). A membership that does not exist or is deleted,
        or whose workspace the caller cannot see, answers
        workspace.member_not_found; a member or a guest, forbidden, whatever
        the membership. To a caller who may change roles, a membership that
        has ended answers workspace.member_not_found, and his own
        workspace.own_membership: nobody changes his own role. The role is
        decided after the workspace row is locked, so of two admins who
        demote each other at once only the first succeeds and the workspace
        keeps an admin.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, workspace.member_not_found, forbidden, workspace.own_membership]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberUpdate'
      responses:
        '200':
          description: The membership with its new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
    get:
      operationId: getWorkspaceInvitation
      tags: [workspace]
      summary: Show an invitation to whoever holds its link
      description: >-
        Public: the link's token stands for a credential, and the answer is
        the same with a bearer token or without one. It shows the
        invitation's role, whether it was declined, and its workspace's name
        and slug; never the address invited. A token that is not the
        invitation's, and an invitation that does not exist, is deleted or
        accepted, answer the same workspace.invitation_not_found. Requests
        are limited per client IP.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: The token of the invitation's link (WorkspaceInvitation.token).
          schema:
            type: string
      x-problem-codes: [workspace.invitation_not_found]
      responses:
        '200':
          description: The invitation as its link shows it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWorkspaceInvitation
      tags: [workspace]
      summary: Change an invitation's role
      description: >-
        For the workspace's admins. The role is checked first
        (validation_failed). An invitation that does not exist, is deleted
        or accepted, or whose workspace the caller cannot see, answers
        workspace.invitation_not_found; a member or a guest, forbidden,
        whatever the invitation. To an admin, a declined invitation answers
        workspace.invitation_responded: delete it, then invite the address
        again. The link keeps its token.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, workspace.invitation_not_found, forbidden, workspace.invitation_responded]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitationUpdate'
      responses:
        '200':
          description: The invitation with its new role, and the token of its link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitation'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteWorkspaceInvitation
      tags: [workspace]
      summary: Delete an invitation
      description: >-
        For the workspace's admins. The invitation, pending or declined, is
        soft-deleted: its link stops working, and its address can be invited
        again at once. An invitation that does not exist, is deleted or
        accepted, or whose workspace the caller cannot see, answers
        workspace.invitation_not_found; a member or a guest, forbidden.
      security: [{bearer: []}]
      x-problem-codes: [workspace.invitation_not_found, forbidden]
      responses:
        '204':
          description: The invitation is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-invitations/{invitation_id}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
    post:
      operationId: acceptWorkspaceInvitation
      tags: [workspace]
      summary: Accept an invitation to one's own address
      description: >-
        For the account the invitation was sent to: its address, as it is
        when the request runs, must be the invitation's; another answers
        workspace.invitation_email_mismatch, which does not say whose, and
        nothing changes. The caller becomes a member with the invitation's
        role, or a former member has his membership back with it; an active
        member stays as he is, his role too, and only the invitation is
        used. The invitation is then accepted and deleted: its link stops
        working. A token that is not the invitation's, and an invitation
        that does not exist, is deleted or accepted, answer the same
        workspace.invitation_not_found; a declined one,
        workspace.invitation_responded. An account deactivated meanwhile
        answers unauthorized. The answer is the workspace, with the caller's
        role in it.
      security: [{bearer: []}]
      x-problem-codes: [workspace.invitation_not_found, workspace.invitation_email_mismatch, workspace.invitation_responded]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationResponse'
      responses:
        '200':
          description: The workspace the caller is a member of, with his role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-invitations/{invitation_id}/decline:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
    post:
      operationId: declineWorkspaceInvitation
      tags: [workspace]
      summary: Decline an invitation to one's own address
      description: >-
        For the account the invitation was sent to, as accepting it is, with
        the same answers. The invitation stays, declined: its link shows
        so, and it holds its address until an admin deletes it.
      security: [{bearer: []}]
      x-problem-codes: [workspace.invitation_not_found, workspace.invitation_email_mismatch, workspace.invitation_responded]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationResponse'
      responses:
        '204':
          description: The invitation is declined.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-slugs/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: checkWorkspaceSlug
      tags: [workspace]
      summary: Tell whether a slug can name a new workspace
      description: >-
        Available, or why not: invalid (not 1–48 lower-case letters, digits,
        - and _), reserved (a path of this site, or held for one), or taken
        (an undeleted workspace has it). It tells nothing about the workspace
        that has it.
      security: [{bearer: []}]
      x-problem-codes: []
      responses:
        '200':
          description: Whether the slug is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugAvailability'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/workspaces/{slug}/preferences:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: getWorkspacePreferences
      tags: [workspace]
      summary: Read the caller's display settings in a workspace
      description: >-
        The caller's own settings of the sidebar's project navigation in the
        workspace, for any active member. Until the caller first changes
        them they are the defaults, ACCORDION and 10, and reading them writes
        nothing. A workspace that does not exist, is deleted, or of which the
        caller is not an active member answers workspace.not_found.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found]
      responses:
        '200':
          description: The caller's settings in the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePreferences'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWorkspacePreferences
      tags: [workspace]
      summary: Change the caller's display settings in a workspace
      description: >-
        The fields given change and the others stay; the first change stores
        the caller's settings, the defaults with the change applied. The
        values are checked before the workspace is looked at
        (validation_failed). A workspace that does not exist, is deleted, or
        of which the caller is not an active member answers
        workspace.not_found.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, workspace.not_found]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspacePreferencesUpdate'
      responses:
        '200':
          description: The caller's settings in the workspace, as changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePreferences'
        default:
          $ref: '#/components/responses/Problem'
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份（M0-P3 交接 3）
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: A workspace's slug, as in the web app's address.
      schema:
        type: string
    InvitationID:
      name: invitation_id
      in: path
      required: true
      description: An invitation's id (WorkspaceInvitation.id), the link's invitation_id.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited and server_busy.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '../common.yaml#/components/schemas/Problem'
  schemas:
    WorkspaceRole:
      description: A member's role in a workspace, 5 guest, 15 member, 20 admin.
      type: integer
      enum: [5, 15, 20]
    OrganizationSize:
      description: The size of the organization, as the web app's form offers it.
      type: string
      enum: [Just myself, 2-10, 11-50, 51-200, 201-500, 500+]
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, slug, organization_size, timezone, logo_url, role, total_members, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          description: Lower case; it never changes.
          type: string
        organization_size:
          description: One of OrganizationSize's values; null when none was given.
          type: [string, 'null']
        timezone:
          description: An IANA time zone name.
          type: string
        logo_url:
          description: Null until uploads arrive (M5).
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        total_members:
          description: The number of active members.
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
    WorkspaceCreate:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          description: 1–80 characters, with a letter or a digit, without a web address.
          type: string
        slug:
          description: 1–48 lower-case letters, digits, - and _; not reserved.
          type: string
        organization_size:
          $ref: '#/components/schemas/OrganizationSize'
        timezone:
          description: An IANA time zone name, e.g. from GET /api/v0/timezones; UTC when not given.
          type: string
    MemberUser:
      description: >-
        A member's public profile, embedded in the membership: the one way
        v0 shows other accounts (M3 design 5.2).
      type: object
      additionalProperties: false
      required: [id, display_name, first_name, last_name, avatar_url, email]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        avatar_url:
          description: Null until uploads arrive (M5).
          type: [string, 'null']
        email:
          description: The member's address for a caller who is an admin or a member; null for a guest.
          type: [string, 'null']
    WorkspaceMember:
      type: object
      additionalProperties: false
      required: [id, workspace_id, role, is_active, created_at, member]
      properties:
        id:
          description: The membership's id, which /workspace-members/{workspace_member_id} names.
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        is_active:
          description: False once the membership has ended.
          type: boolean
        created_at:
          type: string
          format: date-time
        member:
          $ref: '#/components/schemas/MemberUser'
    WorkspaceMemberList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
    WorkspaceMemberUpdate:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    WorkspaceUpdate:
      description: Changes the fields it names; a field left out keeps its value. organization_size cannot be set to null.
      type: object
      additionalProperties: false
      properties:
        name:
          description: 1–80 characters, with a letter or a digit, without a web address.
          type: string
        organization_size:
          $ref: '#/components/schemas/OrganizationSize'
        timezone:
          description: An IANA time zone name.
          type: string
    NavigationControlPreference:
      description: How the sidebar shows the projects, as sections one under another or as tabs.
      type: string
      enum: [ACCORDION, TABBED]
    NavigationProjectLimit:
      description: How many projects the sidebar shows before "more"; 0 shows them all.
      type: integer
      minimum: 0
      maximum: 2147483647
    WorkspacePreferences:
      type: object
      additionalProperties: false
      required: [navigation_control_preference, navigation_project_limit]
      properties:
        navigation_control_preference:
          $ref: '#/components/schemas/NavigationControlPreference'
        navigation_project_limit:
          $ref: '#/components/schemas/NavigationProjectLimit'
    WorkspacePreferencesUpdate:
      type: object
      additionalProperties: false
      properties:
        navigation_control_preference:
          $ref: '#/components/schemas/NavigationControlPreference'
        navigation_project_limit:
          $ref: '#/components/schemas/NavigationProjectLimit'
    WorkspaceInvitation:
      description: >-
        An invitation of an address to the workspace, pending or declined
        (responded_at set). Only who may manage the workspace's invitations
        is given one, with the token of its link:
        /workspace-invitations?invitation_id={id}&token={token}.
      type: object
      additionalProperties: false
      required: [id, workspace_id, email, role, accepted, responded_at, created_at, created_by_id, token]
      properties:
        id:
          description: The invitation's id, the link's invitation_id.
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        email:
          description: The address invited, normalized.
          type: string
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        accepted:
          description: False; an invitation is deleted as it is accepted, and never listed again.
          type: boolean
        responded_at:
          description: When the invitation was declined; null while it is pending.
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        created_by_id:
          description: The account that invited; null once that account is gone.
          type: [string, 'null']
          format: uuid
        token:
          description: >-
            nrv_inv_ and 22 base64url characters. The server does not store
            it: it computes it again from the invitation's id with a key
            derived from the instance's signing key, so a new signing key
            gives every invitation a new token and voids the old links.
          type: string
    WorkspaceInvitationList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceInvitation'
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          description: An e-mail address; it is normalized as at registration.
          type: string
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    InvitationPreview:
      description: >-
        What an invitation's link shows whoever holds it. The workspace's
        fields are flat: the holder cannot read the workspace itself. There
        is no address: the holder of a link does not learn which address to
        register with.
      type: object
      additionalProperties: false
      required: [id, role, declined, workspace_name, workspace_slug, workspace_logo_url]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        declined:
          description: True once the invitation was declined; it can no longer be answered.
          type: boolean
        workspace_name:
          type: string
        workspace_slug:
          type: string
        workspace_logo_url:
          description: Null until uploads arrive (M5).
          type: [string, 'null']
    InvitationResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          description: The token of the invitation's link (WorkspaceInvitation.token).
          type: string
    WorkspaceInvitationUpdate:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    WorkspaceInvitationsCreate:
      type: object
      additionalProperties: false
      required: [invitations]
      properties:
        invitations:
          description: 1–100 invitations, created all together or not at all.
          type: array
          items:
            $ref: '#/components/schemas/InvitationCreate'
    SlugAvailability:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available:
          type: boolean
        reason:
          description: Why the slug is not available; absent when it is.
          type: string
          enum: [invalid, reserved, taken]
