# identity 模块的接口（M2 设计 5.1、5.2）。生成的 Go 代码在
# server/internal/modules/identity/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve identity API
  version: v0
paths:
  /api/v0/auth/register:
    post:
      operationId: register
      tags: [identity]
      summary: Create an account and sign in
      description: >-
        Creates an account with its default profile and signs it in: the
        response holds a new session's tokens. While sign-up is off, a
        well-formed request answers identity.signup_disabled before the
        address or the password is looked at, so the answer never depends on
        whether the address is registered. The password needs
        8–128 characters with an upper-case letter, a lower-case letter, a
        digit and a special character, and must not be a common password.
        Registrations have a rate limit of their own per client IP.
      security: []
      x-problem-codes: [identity.signup_disabled, validation_failed, identity.email_taken, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account exists and is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/login:
    post:
      operationId: login
      tags: [identity]
      summary: Sign in with an e-mail address and a password
      description: >-
        Starts a new session and returns its tokens. An unknown address and a
        wrong password get the same identity.invalid_credentials; a
        deactivated account answers identity.account_deactivated only to the
        right password. Logins have rate limits of their own: per client IP,
        and per client IP and address together.
      security: []
      x-problem-codes: [identity.invalid_credentials, identity.account_deactivated, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The new session's tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/refresh:
    post:
      operationId: refreshTokens
      tags: [identity]
      summary: Exchange a refresh token for the next pair
      description: >-
        Returns new tokens of the same session and retires the refresh token
        sent: the next refresh uses the refresh_token of this response. The
        session's end, refresh_token_expires_at, never moves. Any refresh
        token but the current one of a session that has not ended answers
        identity.refresh_token_invalid; one this session issued before under
        the current signing key also ends the session, since someone else
        holds a copy of it.
      security: []
      x-problem-codes: [identity.refresh_token_invalid]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: The session's next tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/logout:
    post:
      operationId: logout
      tags: [identity]
      summary: End the session of a refresh token
      description: >-
        Ends the session when refresh_token is its current one. Any other
        token changes nothing and gets the same answer, which tells nothing
        about the token.
      security: []
      x-problem-codes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Done, whatever the token was.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Read the caller's account
      security: [{bearer: []}]
      x-problem-codes: []
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateMe
      tags: [identity]
      summary: Change the caller's names and time zone
      description: >-
        Changes the fields sent and leaves the others. The e-mail address
        cannot change here: the server's administrator changes it.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: The caller's account, changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/profile:
    get:
      operationId: getProfile
      tags: [identity]
      summary: Read the caller's preferences
      security: [{bearer: []}]
      x-problem-codes: []
      responses:
        '200':
          description: The caller's preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateProfile
      tags: [identity]
      summary: Change the caller's preferences
      description: >-
        Changes the fields sent and leaves the others. The onboarding steps
        sent are merged into the stored ones: a step not sent keeps its value,
        also when another request changes it at the same time.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: The caller's preferences, changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/api-tokens:
    get:
      operationId: listApiTokens
      tags: [identity]
      summary: List the caller's personal access tokens
      description: >-
        The caller's personal access tokens that are not revoked, newest first,
        a page at a time. The tokens themselves are never listed: only
        createApiToken answers one, once.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed]
      parameters:
        - $ref: '../common.yaml#/components/parameters/Limit'
        - $ref: '../common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createApiToken
      tags: [identity]
      summary: Create a personal access token
      description: >-
        Creates a personal access token of the caller and answers the token
        itself, this once. Sent as "Authorization: Bearer", it acts as the
        account in every operation until it expires or is revoked, and it can
        create tokens itself. Any credential may create one; no password is
        asked for.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
      responses:
        '201':
          description: The new token, with the token itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/api-tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeApiToken
      tags: [identity]
      summary: Revoke a personal access token
      description: >-
        Revokes one of the caller's tokens, which stops working at once; a
        token may revoke itself. A token that does not exist, is revoked
        already or belongs to another account is identity.api_token_not_found.
      security: [{bearer: []}]
      x-problem-codes: [identity.api_token_not_found]
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Problem'
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份（M0-P3 交接 3）
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited and server_busy.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer, or
            Bearer error="invalid_token" when the bearer token sent is invalid
            or has expired (RFC 6750 3).
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '../common.yaml#/components/schemas/Problem'
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          description: The sign-in address; stored trimmed and in lower case.
          type: string
          format: email
        password:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          description: The sign-in address, in any case, with or without surrounding blanks.
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          description: The refresh_token of the last AuthTokens of the session.
          type: string
    LogoutRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          description: The refresh_token of the last AuthTokens of the session.
          type: string
    AuthTokens:
      description: >-
        A session's tokens. Send access_token as "Authorization: Bearer"; when
        it expires, exchange refresh_token for the next pair at
        POST /api/v0/auth/refresh.
      type: object
      additionalProperties: false
      required: [token_type, access_token, access_token_expires_in, refresh_token, refresh_token_expires_at]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
        access_token_expires_in:
          description: Seconds from this response until the access token expires.
          type: integer
        refresh_token:
          description: An opaque nrv_rt_ token.
          type: string
        refresh_token_expires_at:
          description: When the session ends; refreshing never extends it.
          type: string
          format: date-time
    User:
      type: object
      additionalProperties: false
      required: [id, email, first_name, last_name, display_name, user_timezone, avatar_url, cover_image_url, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
        user_timezone:
          description: An IANA time zone name.
          type: string
        avatar_url:
          description: Null until uploads arrive (M5).
          type: [string, 'null']
        cover_image_url:
          description: Null until uploads arrive (M5).
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        first_name:
          description: At most 255 characters, without a web address.
          type: string
        last_name:
          description: At most 255 characters, without a web address.
          type: string
        display_name:
          description: 1–255 characters.
          type: string
        user_timezone:
          description: An IANA time zone name, e.g. from GET /api/v0/timezones.
          type: string
    Theme:
      type: string
      enum: [system, light, dark, light-contrast, dark-contrast]
    Language:
      description: The language of the web UI.
      type: string
      enum: [en, zh-CN]
    StartOfTheWeek:
      description: The first day of the week, 0 Sunday to 6 Saturday.
      type: integer
      enum: [0, 1, 2, 3, 4, 5, 6]
    OnboardingSteps:
      type: object
      additionalProperties: false
      required: [profile_complete, workspace_create, workspace_invite, workspace_join]
      properties:
        profile_complete:
          type: boolean
        workspace_create:
          type: boolean
        workspace_invite:
          type: boolean
        workspace_join:
          type: boolean
    OnboardingStepsUpdate:
      description: The steps to set; the others keep their values.
      type: object
      additionalProperties: false
      properties:
        profile_complete:
          type: boolean
        workspace_create:
          type: boolean
        workspace_invite:
          type: boolean
        workspace_join:
          type: boolean
    Profile:
      type: object
      additionalProperties: false
      required: [theme, language, start_of_the_week, onboarding_step, is_onboarded, is_tour_completed, last_workspace_id, updated_at]
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          $ref: '#/components/schemas/Language'
        start_of_the_week:
          $ref: '#/components/schemas/StartOfTheWeek'
        onboarding_step:
          $ref: '#/components/schemas/OnboardingSteps'
        is_onboarded:
          type: boolean
        is_tour_completed:
          type: boolean
        last_workspace_id:
          description: The workspace the web app opens last; null for none. It is not checked to exist.
          type: [string, 'null']
          format: uuid
        updated_at:
          type: string
          format: date-time
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          $ref: '#/components/schemas/Language'
        start_of_the_week:
          $ref: '#/components/schemas/StartOfTheWeek'
        onboarding_step:
          $ref: '#/components/schemas/OnboardingStepsUpdate'
        is_onboarded:
          type: boolean
        is_tour_completed:
          type: boolean
        last_workspace_id:
          description: Null clears it.
          type: [string, 'null']
          format: uuid
    ApiToken:
      description: >-
        A personal access token as lists show it. The token itself appears
        only in ApiTokenCreated.
      type: object
      additionalProperties: false
      required: [id, label, description, expired_at, last_used, created_at]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        description:
          type: string
        expired_at:
          description: When the token stops working; null when it never does.
          type: [string, 'null']
          format: date-time
        last_used:
          description: When the token last authenticated a request, to the minute; null when it never has.
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
    ApiTokenCreate:
      type: object
      additionalProperties: false
      properties:
        label:
          description: 1–255 characters; 32 hexadecimal digits are made up when it is absent.
          type: string
        description:
          type: string
        expired_at:
          description: A time in the future; absent or null for a token that never expires.
          type: [string, 'null']
          format: date-time
    ApiTokenCreated:
      description: >-
        A new personal access token: the fields of ApiToken, and the token
        itself, which is shown this once and cannot be read again.
      type: object
      additionalProperties: false
      required: [id, label, description, expired_at, last_used, created_at, token]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        description:
          type: string
        expired_at:
          description: When the token stops working; null when it never does.
          type: [string, 'null']
          format: date-time
        last_used:
          description: Null; the token has not been used yet.
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        token:
          description: The token, nrv_pat_ and 43 more characters.
          type: string
    ApiTokenPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
        next_cursor:
          $ref: '../common.yaml#/components/schemas/NextCursor'
