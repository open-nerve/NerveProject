# planning 模块的接口（M6 设计 5、P1 spec 2.3）。生成的 Go 代码在
# server/internal/modules/planning/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve planning API
  version: v0
paths:
  /api/v0/projects/{project_id}/cycles:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listCycles
      tags: [planning]
      summary: List a project's cycles
      description: >-
        For the project's admins, members and guests, also a caller who sees
        only his own work items there, whether its cycles are turned on or
        off and whether it is archived. The undeleted cycles that are not
        archived, by sort_order, then creation, then id; or, when archived is
        true, the archived ones alone, the latest archived first, then by id.
        Each with its status on the project's calendar day. A project that
        does not exist, is deleted, or that the caller does not see answers
        project.not_found; one he sees but whose cycles he may not read,
        forbidden. The whole collection at once: collections are not
        paginated.
      security: [{bearer: []}]
      x-problem-codes: [project.not_found, forbidden]
      parameters:
        - name: archived
          in: query
          required: false
          description: true lists the archived cycles alone; false, or no value, the others.
          schema:
            type: boolean
      responses:
        '200':
          description: The project's cycles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCycle
      tags: [planning]
      summary: Create a cycle in a project
      description: >-
        For the project's admins and members, not its guests, and not a
        caller who sees only his own work items there. The name has 1–255
        characters without its surrounding white space, which is dropped,
        and no NUL; the description has no NUL and is empty when it is left
        out; the start and end dates are days of the project's calendar,
        both or neither, the start not after the end (validation_failed).
        The values are checked before the project is looked at. A project
        that does not exist, is deleted, or that the caller does not see
        answers project.not_found; one he sees but whose cycles he may not
        change, forbidden; an archived project, project.archived; a project
        whose cycles are turned off (Project.cycle_view), planning.cycles_disabled.
        A dated cycle may not share a day with another undeleted cycle of
        the project, archived ones too (planning.cycle_dates_overlap). The
        new cycle comes first: its sort order is the lowest of the project's
        undeleted cycles, archived ones too, less 10000, or 65535 when it has
        none. Its owner is the caller. Everything is decided after the
        project's row is locked, and written at one moment by the caller.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, project.not_found, forbidden, project.archived, planning.cycles_disabled, planning.cycle_dates_overlap, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleCreate'
      responses:
        '201':
          description: The new cycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/cycles/{cycle_id}:
    parameters:
      - $ref: '#/components/parameters/CycleID'
    get:
      operationId: getCycle
      tags: [planning]
      summary: Read a cycle
      description: >-
        For its project's admins, members and guests, also a caller who sees
        only his own work items there, whether the project's cycles are
        turned on or off and whether the project or the cycle is archived;
        with its status on the project's calendar day. A cycle that does not
        exist or is deleted, one whose project is deleted, and one whose
        project the caller does not see answer planning.cycle_not_found; one
        whose project he sees but whose cycles he may not read, forbidden.
      security: [{bearer: []}]
      x-problem-codes: [planning.cycle_not_found, forbidden]
      responses:
        '200':
          description: The cycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateCycle
      tags: [planning]
      summary: Change a cycle
      description: >-
        For its project's admins and members, not its guests, and not a
        caller who sees only his own work items there. Each field given is
        changed, each left out kept; start_date and end_date may each be
        given alone or null. The name has 1–255 characters without its
        surrounding white space, which is dropped, and no NUL; the
        description no NUL; the sort order is a number (validation_failed);
        these are checked before the cycle is looked at. A cycle that does
        not exist or is deleted, one whose project is deleted, and one whose
        project the caller does not see answer planning.cycle_not_found; a
        caller who may not change it, forbidden; an archived project,
        project.archived; cycles turned off, planning.cycles_disabled; an
        archived cycle refuses any change, one of nothing too
        (planning.archived); a completed cycle, any field but sort_order,
        even given as it is (planning.cycle_completed). The dates given, each
        else the cycle's, must be both or neither with the start not after the
        end (validation_failed, at the date given alone, or where they part
        when both are given), and may not share a day with another undeleted
        cycle of the project, archived ones too
        (planning.cycle_dates_overlap). A change of nothing writes nothing
        and answers the cycle as it is. Everything is decided after the
        project's row is locked, and written at one moment by the caller.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, planning.cycle_not_found, forbidden, project.archived, planning.cycles_disabled, planning.archived,
        planning.cycle_completed, planning.cycle_dates_overlap, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleUpdate'
      responses:
        '200':
          description: The cycle as changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCycle
      tags: [planning]
      summary: Delete a cycle
      description: >-
        For its project's admins, and for the member who created it; not
        another member, not a guest, and not a caller who sees only his own
        work items there. Whatever its status and archive. A cycle that does
        not exist or is deleted, one whose project is deleted, and one whose
        project the caller does not see answer planning.cycle_not_found; a
        caller who may not delete it, forbidden; an archived project,
        project.archived; cycles turned off, planning.cycles_disabled.
        Decided after the project's row is locked; its deletion and its last
        change are one moment, the caller's. It is read no more.
      security: [{bearer: []}]
      x-problem-codes: [planning.cycle_not_found, forbidden, project.archived, planning.cycles_disabled, server_busy]
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/cycles/{cycle_id}/archive:
    parameters:
      - $ref: '#/components/parameters/CycleID'
    post:
      operationId: archiveCycle
      tags: [planning]
      summary: Archive a completed cycle
      description: >-
        For its project's admins and members, not its guests, and not a
        caller who sees only his own work items there. Only a cycle
        completed on the project's calendar day is archived
        (planning.cycle_not_completed); one archived already is answered as
        it is, nothing written. A cycle that does not exist or is deleted,
        one whose project is deleted, and one whose project the caller does
        not see answer planning.cycle_not_found; a caller who may not change
        it, forbidden; an archived project, project.archived; cycles turned
        off, planning.cycles_disabled. Decided after the project's row is
        locked; archived_at and the cycle's last change are one moment, the
        caller's.
      security: [{bearer: []}]
      x-problem-codes: [planning.cycle_not_found, forbidden, project.archived, planning.cycles_disabled, planning.cycle_not_completed, server_busy]
      responses:
        '200':
          description: The cycle, archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/cycles/{cycle_id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/CycleID'
    post:
      operationId: unarchiveCycle
      tags: [planning]
      summary: Unarchive a cycle
      description: >-
        For its project's admins and members, not its guests, and not a
        caller who sees only his own work items there; whatever the cycle's
        status. One not archived is answered as it is, nothing written. A
        cycle that does not exist or is deleted, one whose project is
        deleted, and one whose project the caller does not see answer
        planning.cycle_not_found; a caller who may not change it, forbidden;
        an archived project, project.archived; cycles turned off,
        planning.cycles_disabled. Decided after the project's row is locked;
        the cycle's last change is the caller's at that moment.
      security: [{bearer: []}]
      x-problem-codes: [planning.cycle_not_found, forbidden, project.archived, planning.cycles_disabled, server_busy]
      responses:
        '200':
          description: The cycle, not archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}/modules:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listModules
      tags: [planning]
      summary: List a project's modules
      description: >-
        For the project's admins, members and guests, also a caller who sees
        only his own work items there, whether its modules are turned on or
        off and whether it is archived. The undeleted modules that are not
        archived, by sort_order, then creation, then id; or, when archived is
        true, the archived ones alone, the latest archived first, then by id.
        Each with its undeleted members, ascending. A project that does not
        exist, is deleted, or that the caller does not see answers
        project.not_found; one he sees but whose modules he may not read,
        forbidden. The whole collection at once: collections are not
        paginated.
      security: [{bearer: []}]
      x-problem-codes: [project.not_found, forbidden]
      parameters:
        - name: archived
          in: query
          required: false
          description: true lists the archived modules alone; false, or no value, the others.
          schema:
            type: boolean
      responses:
        '200':
          description: The project's modules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createModule
      tags: [planning]
      summary: Create a module in a project
      description: >-
        For the project's admins and members, not its guests, and not a
        caller who sees only his own work items there. The name has 1–255
        characters without its surrounding white space, which is dropped,
        and no NUL; the description has no NUL and is empty when it is left
        out; the status is one of ModuleStatus, planned when it is left out;
        the start and target dates are days, each given alone or neither,
        the start not after the target; member_ids names at most 100
        accounts, each once (validation_failed). The values are checked
        before the project is looked at. A project that does not exist, is
        deleted, or that the caller does not see answers project.not_found;
        one he sees but whose modules he may not change, forbidden; an
        archived project, project.archived; a project whose modules are
        turned off (Project.module_view), planning.modules_disabled. After
        the project's row is locked, the lead and each member must be an
        active member of the project who is not its guest
        (validation_failed, at lead_id or member_ids[i]); and no other
        undeleted module of the project, archived ones too, may have the
        name, in any case (planning.module_name_taken). The new module comes
        first: its sort order is the lowest of the project's undeleted
        modules, archived ones too, less 10000, or 65535 when it has none.
        It and its members' rows are written at one moment by the caller.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, project.not_found, forbidden, project.archived, planning.modules_disabled, planning.module_name_taken,
        server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleCreate'
      responses:
        '201':
          description: The new module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/modules/{module_id}:
    parameters:
      - $ref: '#/components/parameters/ModuleID'
    get:
      operationId: getModule
      tags: [planning]
      summary: Read a module
      description: >-
        For its project's admins, members and guests, also a caller who sees
        only his own work items there, whether the project's modules are
        turned on or off and whether the project or the module is archived;
        with its undeleted members, ascending. A module that does not exist
        or is deleted, one whose project is deleted, and one whose project
        the caller does not see answer planning.module_not_found; one whose
        project he sees but whose modules he may not read, forbidden.
      security: [{bearer: []}]
      x-problem-codes: [planning.module_not_found, forbidden]
      responses:
        '200':
          description: The module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateModule
      tags: [planning]
      summary: Change a module
      description: >-
        For its project's admins and members, not its guests, and not a
        caller who sees only his own work items there. Each field given is
        changed, each left out kept; start_date, target_date and lead_id may
        each be given alone, and null clears it. member_ids, given, is the
        module's whole set of members: those it leaves out are removed,
        those it adds are added, those it keeps are left as they are. The
        name has 1–255 characters without its surrounding white space, which
        is dropped, and no NUL; the description no NUL; the status is one of
        ModuleStatus; member_ids names at most 100 accounts, each once; the
        sort order is a number (validation_failed); these are checked before
        the module is looked at. A module that does not exist or is deleted,
        one whose project is deleted, and one whose project the caller does
        not see answer planning.module_not_found; a caller who may not
        change it, forbidden; an archived project, project.archived; modules
        turned off, planning.modules_disabled; an archived module refuses any
        change, one of nothing too (planning.archived). After the project's
        row is locked: the dates given, each else the module's, may not put
        the start after the target (validation_failed, at start_date when it
        is given alone, else at target_date); a lead given anew and each
        member added must be an active member of the project who is not its
        guest (validation_failed, at lead_id or member_ids[i]), while a lead
        or a member kept is not looked at, even one who has left the
        project; and no other undeleted module of the project, archived ones
        too, may have the name, in any case (planning.module_name_taken),
        while its own name in another case is its to take. A change of
        nothing, member_ids naming its members in any order too, writes
        nothing and answers the module as it is. The module's change and its
        removed and added members' rows are written at one moment by the
        caller.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, planning.module_not_found, forbidden, project.archived, planning.modules_disabled, planning.archived,
        planning.module_name_taken, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleUpdate'
      responses:
        '200':
          description: The module as changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteModule
      tags: [planning]
      summary: Delete a module
      description: >-
        For its project's admins, and for the member who created it; not
        another member, not a guest, and not a caller who sees only his own
        work items there. Whatever its status and archive. A module that does
        not exist or is deleted, one whose project is deleted, and one whose
        project the caller does not see answer planning.module_not_found; a
        caller who may not delete it, forbidden; an archived project,
        project.archived; modules turned off, planning.modules_disabled.
        Decided after the project's row is locked; its deletion, the
        deletion of its members and of its links, and its last change are
        one moment, the caller's. It is read no more, nor are its links.
      security: [{bearer: []}]
      x-problem-codes: [planning.module_not_found, forbidden, project.archived, planning.modules_disabled, server_busy]
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/modules/{module_id}/archive:
    parameters:
      - $ref: '#/components/parameters/ModuleID'
    post:
      operationId: archiveModule
      tags: [planning]
      summary: Archive a completed or cancelled module
      description: >-
        For its project's admins and members, not its guests, and not a
        caller who sees only his own work items there. Only a module whose
        status is completed or cancelled is archived
        (planning.module_not_closed); one archived already is answered as it
        is, nothing written. A module that does not exist or is deleted, one
        whose project is deleted, and one whose project the caller does not
        see answer planning.module_not_found; a caller who may not change it,
        forbidden; an archived project, project.archived; modules turned
        off, planning.modules_disabled. Decided after the project's row is
        locked; archived_at and the module's last change are one moment, the
        caller's.
      security: [{bearer: []}]
      x-problem-codes: [planning.module_not_found, forbidden, project.archived, planning.modules_disabled, planning.module_not_closed, server_busy]
      responses:
        '200':
          description: The module, archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/modules/{module_id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ModuleID'
    post:
      operationId: unarchiveModule
      tags: [planning]
      summary: Unarchive a module
      description: >-
        For its project's admins and members, not its guests, and not a
        caller who sees only his own work items there; whatever the module's
        status. One not archived is answered as it is, nothing written. A
        module that does not exist or is deleted, one whose project is
        deleted, and one whose project the caller does not see answer
        planning.module_not_found; a caller who may not change it,
        forbidden; an archived project, project.archived; modules turned
        off, planning.modules_disabled. Decided after the project's row is
        locked; the module's last change is the caller's at that moment.
      security: [{bearer: []}]
      x-problem-codes: [planning.module_not_found, forbidden, project.archived, planning.modules_disabled, server_busy]
      responses:
        '200':
          description: The module, not archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/modules/{module_id}/links:
    parameters:
      - $ref: '#/components/parameters/ModuleID'
    get:
      operationId: listModuleLinks
      tags: [planning]
      summary: List a module's links
      description: >-
        For its project's admins, members and guests, also a caller who sees
        only his own work items there, whether the project's modules are
        turned on or off and whether the project or the module is archived.
        Its undeleted links, the latest created first, then by id
        descending. A module that does not exist or is deleted, one whose
        project is deleted, and one whose project the caller does not see
        answer planning.module_not_found; one whose project he sees but
        whose modules he may not read, forbidden. The whole collection at
        once: collections are not paginated.
      security: [{bearer: []}]
      x-problem-codes: [planning.module_not_found, forbidden]
      responses:
        '200':
          description: The module's links, with an empty data array when it has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleLinkCollection'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createModuleLink
      tags: [planning]
      summary: Add a link to a module
      description: >-
        For its project's admins and members, not its guests, and not a
        caller who sees only his own work items there. The URL has its
        surrounding white space dropped and http:// added when it names no
        scheme; it is an HTTP or HTTPS URL without credentials, zones or
        control characters, of at most 2048 characters; the title, null or
        empty too, has at most 255 characters and no NUL (validation_failed),
        checked before the module is looked at. A module that does not exist
        or is deleted, one whose project is deleted, and one whose project
        the caller does not see answer planning.module_not_found; a caller
        who may not change it, forbidden; an archived project,
        project.archived; modules turned off, planning.modules_disabled; an
        archived module, planning.archived. Another undeleted link of the
        module may not have the URL, as it is spelt
        (planning.module_link_exists). Decided after the project's row is
        locked, and written at one moment by the caller; its preview
        metadata is empty.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, planning.module_not_found, forbidden, project.archived, planning.modules_disabled, planning.archived,
        planning.module_link_exists, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleLinkCreate'
      responses:
        '201':
          description: The new link, with empty preview metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleLink'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/module-links/{module_link_id}:
    parameters:
      - $ref: '#/components/parameters/ModuleLinkID'
    patch:
      operationId: updateModuleLink
      tags: [planning]
      summary: Change a module's link
      description: >-
        For its project's admins and members, not its guests, and not a
        caller who sees only his own work items there, whoever added it. The
        URL and the title are checked as createModuleLink's, each when given,
        before the link is looked at; the title may be given alone, null
        clears it. A link that does not exist or is deleted, one whose module
        or project is deleted, and one whose project the caller does not see
        answer planning.module_link_not_found; a caller who may not change
        it, forbidden; an archived project, project.archived; modules turned
        off, planning.modules_disabled; an archived module, planning.archived,
        for a change of nothing too. Another undeleted link of the module may
        not have the URL (planning.module_link_exists). A change of nothing
        writes nothing and answers the link as it is. A changed URL empties
        its preview metadata; a title alone keeps it. Decided after the
        project's row is locked, and written at one moment by the caller.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, planning.module_link_not_found, forbidden, project.archived, planning.modules_disabled,
        planning.archived, planning.module_link_exists, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleLinkPatch'
      responses:
        '200':
          description: The link as changed, with its current preview metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleLink'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteModuleLink
      tags: [planning]
      summary: Remove a module's link
      description: >-
        For its project's admins and members, not its guests, and not a
        caller who sees only his own work items there, whoever added it. A
        link that does not exist or is deleted, one whose module or project
        is deleted, and one whose project the caller does not see answer
        planning.module_link_not_found; a caller who may not change it,
        forbidden; an archived project, project.archived; modules turned off,
        planning.modules_disabled; an archived module, planning.archived.
        Decided after the project's row is locked; its deletion and its last
        change are one moment, the caller's. It is read no more.
      security: [{bearer: []}]
      x-problem-codes: [planning.module_link_not_found, forbidden, project.archived, planning.modules_disabled, planning.archived, server_busy]
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Problem'
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份（M0-P3 交接 3）
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      description: A project's id (Project.id).
      schema:
        type: string
        format: uuid
    CycleID:
      name: cycle_id
      in: path
      required: true
      description: A cycle's id (Cycle.id).
      schema:
        type: string
        format: uuid
    ModuleID:
      name: module_id
      in: path
      required: true
      description: A module's id (Module.id).
      schema:
        type: string
        format: uuid
    ModuleLinkID:
      name: module_link_id
      in: path
      required: true
      description: A module link's id (ModuleLink.id).
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited and server_busy.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '../common.yaml#/components/schemas/Problem'
  schemas:
    CycleStatus:
      description: >-
        Read from the cycle's dates on the project's calendar day, never
        stored: draft without dates, upcoming before the start, current from
        the start to the end, completed after the end.
      type: string
      enum: [draft, upcoming, current, completed]
    Cycle:
      description: A cycle of a project.
      type: object
      additionalProperties: false
      required: [id, workspace_id, project_id, name, description, start_date, end_date, status, owned_by_id, sort_order, archived_at,
        created_at, updated_at, created_by_id, updated_by_id]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          description: Plain text; empty for none.
          type: string
        start_date:
          description: The day it starts, on the project's calendar; null for a draft.
          type: [string, 'null']
          format: date
        end_date:
          description: The day it ends, on the project's calendar; null for a draft.
          type: [string, 'null']
          format: date
        status:
          $ref: '#/components/schemas/CycleStatus'
        owned_by_id:
          description: The account that created it; null once that account is gone.
          type: [string, 'null']
          format: uuid
        sort_order:
          description: The cycle's place among the project's cycles, the lowest first.
          type: number
        archived_at:
          description: When it was archived; null while it is not.
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_id:
          type: [string, 'null']
          format: uuid
        updated_by_id:
          type: [string, 'null']
          format: uuid
    CycleList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Cycle'
    CycleUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          description: 1–255 characters without the surrounding white space, which is dropped; no NUL.
          type: string
        description:
          description: Plain text without NUL; empty for none.
          type: string
        start_date:
          description: The day it starts, on the project's calendar; null clears it, with end_date.
          type: [string, 'null']
          format: date
        end_date:
          description: The day it ends, not before start_date; null clears it, with start_date.
          type: [string, 'null']
          format: date
        sort_order:
          description: The cycle's place among the project's cycles, the lowest first.
          type: number
    CycleCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: 1–255 characters without the surrounding white space, which is dropped; no NUL.
          type: string
        description:
          description: Plain text without NUL; empty when left out.
          type: string
        start_date:
          description: The day it starts, on the project's calendar; given with end_date, or neither for a draft.
          type: string
          format: date
        end_date:
          description: The day it ends, not before start_date; given with start_date, or neither for a draft.
          type: string
          format: date
    ModuleStatus:
      description: A module's status, set by its writers, never read from its dates.
      type: string
      enum: [backlog, planned, in-progress, paused, completed, cancelled]
    Module:
      description: A module of a project.
      type: object
      additionalProperties: false
      required: [id, workspace_id, project_id, name, description, start_date, target_date, status, lead_id, member_ids, sort_order,
        archived_at, created_at, updated_at, created_by_id, updated_by_id]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          description: Plain text; empty for none.
          type: string
        start_date:
          description: The day it starts; null for none.
          type: [string, 'null']
          format: date
        target_date:
          description: The day it is due, not before start_date; null for none.
          type: [string, 'null']
          format: date
        status:
          $ref: '#/components/schemas/ModuleStatus'
        lead_id:
          description: The account that leads it; null for none, or once that account is gone.
          type: [string, 'null']
          format: uuid
        member_ids:
          description: >-
            Its members' accounts, ascending; one who has left the project
            since is still one.
          type: array
          items:
            type: string
            format: uuid
        sort_order:
          description: The module's place among the project's modules, the lowest first.
          type: number
        archived_at:
          description: When it was archived; null while it is not.
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_id:
          type: [string, 'null']
          format: uuid
        updated_by_id:
          type: [string, 'null']
          format: uuid
    ModuleList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Module'
    ModuleCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: 1–255 characters without the surrounding white space, which is dropped; no NUL.
          type: string
        description:
          description: Plain text without NUL; empty when left out.
          type: string
        start_date:
          description: The day it starts; left out for none.
          type: string
          format: date
        target_date:
          description: The day it is due, not before start_date; left out for none.
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ModuleStatus'
        lead_id:
          description: >-
            An active member of the project who is not its guest; null, or
            left out, for none.
          type: [string, 'null']
          format: uuid
        member_ids:
          description: >-
            At most 100 accounts, each named once, each an active member of
            the project who is not its guest; left out, or empty, for none.
          type: array
          items:
            type: string
            format: uuid
    ModuleUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          description: 1–255 characters without the surrounding white space, which is dropped; no NUL.
          type: string
        description:
          description: Plain text without NUL; empty for none.
          type: string
        start_date:
          description: The day it starts, not after the target date; null clears it.
          type: [string, 'null']
          format: date
        target_date:
          description: The day it is due, not before the start date; null clears it.
          type: [string, 'null']
          format: date
        status:
          $ref: '#/components/schemas/ModuleStatus'
        lead_id:
          description: >-
            Another lead, an active member of the project who is not its
            guest; the lead it has is kept as it is; null clears it.
          type: [string, 'null']
          format: uuid
        member_ids:
          description: >-
            Its members, all of them: at most 100 accounts, each named once;
            each it adds an active member of the project who is not its
            guest; empty for none.
          type: array
          items:
            type: string
            format: uuid
        sort_order:
          description: The module's place among the project's modules, the lowest first.
          type: number
    ModuleLink:
      description: A link of a module.
      type: object
      additionalProperties: false
      required: [id, module_id, url, title, metadata, created_by_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        module_id:
          type: string
          format: uuid
        url:
          type: string
        title:
          description: Null for none; empty text is kept.
          type: [string, 'null']
        metadata:
          $ref: '../common.yaml#/components/schemas/LinkMetadata'
        created_by_id:
          description: The account that added it; null once that account is gone.
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ModuleLinkCollection:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModuleLink'
    ModuleLinkCreate:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          description: HTTP URL, at most 2048 Unicode characters after normalization.
          type: string
        title:
          description: Null, or left out, for none; empty text is kept.
          type: [string, 'null']
          maxLength: 255
    ModuleLinkPatch:
      type: object
      additionalProperties: false
      properties:
        url:
          description: HTTP URL, at most 2048 Unicode characters after normalization.
          type: string
        title:
          description: Null clears it; empty text is kept; left out, it is kept.
          type: [string, 'null']
          maxLength: 255
