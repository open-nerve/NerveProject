# asset 业务接口；原始字节传输单独由 storage-local.json 描述。
openapi: 3.1.0
info:
  title: Nerve asset API
  version: v0
paths:
  /api/v0/drafts/{draft_id}/asset-preparations:
    parameters:
      - name: draft_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listDraftAssetPreparations
      tags: [asset]
      summary: List the author's unbound draft preparations
      description: >-
        Reads the current draft authorization and its author's live unbound
        attachments and description images in one read-only snapshot. Includes
        pending uploads and completed but unbound images. Does not return storage
        keys or capabilities. Missing, deleted or unauthorized drafts answer
        asset.not_found; workspace administrators cannot read another author's
        preparations. Drafts without a project are supported.
        UUID ascending pages default to 50 rows, at most 100. The canonical v1
        cursor is bound to this draft and list; each page rechecks authorization.
        Unknown or repeated parameters, malformed UUIDs, limits and cursors answer
        400; integer limits outside 1..100 answer 422. Pages do not share a
        snapshot, so concurrent new preparations may require a fresh first page.
        This read reserves no state for a later delete or publish operation.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, asset.not_found, asset.scope_changed]
      parameters:
        - $ref: '../common.yaml#/components/parameters/Limit'
        - $ref: '../common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of private preparation metadata, without upload or read capabilities.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DraftAssetPreparationPage'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/assets:
    post:
      operationId: createAsset
      tags: [asset]
      summary: Prepare a private upload
      description: >-
        Creates an unbound asset owned by the caller after authorizing its current
        host. The upload capability is returned only after the record commits.
        Send its exact method and headers with the declared number of bytes.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, forbidden, issue.not_author, project.archived, issue.archived, asset.not_found, asset.scope_changed, asset.too_large, asset.type_unsupported, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAsset'
      responses:
        '201':
          description: Private pending asset and a signed upload request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/assets/{id}:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    get:
      operationId: getAsset
      tags: [asset]
      summary: Read authorized asset metadata
      description: >-
        Reads the asset and its current host authorization in one read-only
        snapshot. Bound issue, comment and draft content follows its host's read
        permission; unbound preparations and profile images remain applicant-only.
        Missing, deleted or invisible assets and hosts answer asset.not_found.
        No storage key or capability is returned.
      security: [{bearer: []}]
      x-problem-codes: [forbidden, asset.not_found, asset.scope_changed]
      responses:
        '200':
          description: Metadata visible under the asset and host permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteAsset
      tags: [asset]
      summary: Delete an authorized attachment or private preparation
      description: >-
        Rechecks current host removal permission. Unbound preparations remain
        applicant-only; bound ordinary attachments follow their host's permission.
        Records a tombstone without deleting objects synchronously or forgetting
        recovery records. Repeated authorized deletion on a still-visible host
        returns 204 with the original audit data. A missing or invisible host
        still answers asset.not_found. Bound description and profile images cannot
        be removed through this endpoint.
      security: [{bearer: []}]
      x-problem-codes: [forbidden, issue.not_author, project.archived, issue.archived, asset.not_found, asset.scope_changed, asset.bound, server_busy]
      responses:
        '204':
          description: Asset deleted or already deleted; objects remain subject to their safe retention periods.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/assets/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    post:
      operationId: completeAsset
      tags: [asset]
      summary: Verify and publish immutable content
      description: >-
        Commits an independent candidate before inspecting, validating and sealing
        the uploaded bytes without database resources. Rechecks current host write
        permission and the candidate lease before publishing. Only the applicant
        may confirm. Ordinary attachments on existing issue, comment or draft
        hosts bind in the final transaction; description and new-comment
        preparations remain unbound. Repeated authorized confirmation returns
        the existing result without changing its audit data, except that a legacy
        uploaded ordinary attachment receives its first binding on a valid retry.
        Failed or losing candidates remain recoverable; a storage failure does not
        mean the object is absent. asset.busy and asset.storage_unavailable
        include Retry-After of one second.
      security: [{bearer: []}]
      x-problem-codes: [forbidden, issue.not_author, project.archived, issue.archived, asset.not_found, asset.scope_changed, asset.too_large, asset.type_unsupported, asset.object_missing, asset.object_changed, asset.content_invalid, asset.busy, asset.storage_unavailable, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: The uniquely published asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/assets/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    post:
      operationId: duplicateAsset
      tags: [asset]
      summary: Copy authorized content to a new asset
      description: >-
        Authorizes the source for reading before the destination for preparation.
        Commits a new pending target and an independent candidate, then validates
        and seals real bytes without database resources. Rechecks both scopes and
        source identity before publishing. A failed copy remains recoverable.
        Ordinary attachments on existing issue, comment or draft hosts bind in
        the final transaction; description and new-comment preparations stay
        private. Every request creates a distinct target; repeating after a lost
        response can create an extra attachment. Only unbound preparations are
        reclaimed by the ordinary preparation expiry rule.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, forbidden, issue.not_author, project.archived, issue.archived, asset.not_found, asset.scope_changed, asset.not_uploaded, asset.too_large, asset.type_unsupported, asset.object_missing, asset.object_changed, asset.content_invalid, asset.storage_unavailable, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateAsset'
      responses:
        '201':
          description: A new uploaded asset with its own immutable object and binding appropriate to its purpose and host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/assets/{id}/content:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    get:
      operationId: resolveAssetContent
      tags: [asset]
      summary: Sign a read of completed content
      description: >-
        Rechecks the caller's credential, asset visibility and current host read
        permission before signing an uploaded asset's immutable final object.
        Bound issue, comment and draft content follows host permissions; unbound
        preparations and profile images remain applicant-only. Does not write database
        rows. Expiry is the next UTC whole hour, or the following hour when fewer
        than five minutes remain. Attachments always download; verified image
        purposes can display inline. A previously issued URL remains a bearer
        capability until its expiry even if permission is subsequently revoked.
      security: [{bearer: []}]
      x-problem-codes: [forbidden, asset.not_found, asset.scope_changed, asset.not_uploaded, server_busy]
      responses:
        '200':
          description: Signed GET URL with its actual expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    AssetID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited and server_busy.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '../common.yaml#/components/schemas/Problem'
  schemas:
    DraftAssetPreparationPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Asset'}
        next_cursor: {$ref: '../common.yaml#/components/schemas/NextCursor'}
    AssetPurpose:
      type: string
      enum: [USER_AVATAR, USER_COVER, WORKSPACE_LOGO, PROJECT_COVER, ISSUE_ATTACHMENT, ISSUE_DESCRIPTION, COMMENT_DESCRIPTION, COMMENT_ATTACHMENT, DRAFT_ISSUE_DESCRIPTION, DRAFT_ISSUE_ATTACHMENT]
    AssetScope:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [user, workspace, project, new_project, issue, comment, new_comment, draft]
        id:
          description: Host UUID; required except for user, which forbids this field. new_project names a workspace; new_comment names an issue.
          type: string
          format: uuid
    NewAsset:
      type: object
      additionalProperties: false
      required: [purpose, scope, name, size, content_type]
      properties:
        purpose:
          $ref: '#/components/schemas/AssetPurpose'
        scope:
          $ref: '#/components/schemas/AssetScope'
        name:
          description: 1–255 Unicode characters, without path separators or control characters.
          type: string
        size:
          description: Exact nonzero byte length; exceeding this instance's file_size_limit answers 413 asset.too_large.
          type: integer
          format: int64
        content_type:
          description: Canonical MIME without parameters. Image purposes accept only image/jpeg, image/png, image/webp and image/gif.
          type: string
    Asset:
      type: object
      additionalProperties: false
      required: [id, purpose, scope, name, size, content_type, state, is_bound, created_at, updated_at, width, height]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/AssetPurpose'
        scope:
          $ref: '#/components/schemas/AssetScope'
        name:
          type: string
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 104857600
        content_type:
          type: string
        state:
          type: string
          enum: [pending, uploaded]
        is_bound:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        width:
          type: [integer, 'null']
          minimum: 1
        height:
          type: [integer, 'null']
          minimum: 1
    PreparedAsset:
      type: object
      additionalProperties: false
      required: [asset, upload]
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        upload:
          $ref: '#/components/schemas/Upload'
    Upload:
      type: object
      additionalProperties: false
      required: [method, url, headers, expires_at]
      properties:
        method:
          type: string
          enum: [PUT]
        url:
          type: string
        headers:
          type: array
          description: Required transport headers, sorted by name with no duplicate names. Set each name/value on the upload request.
          items:
            $ref: '#/components/schemas/UploadHeader'
        expires_at:
          type: string
          format: date-time
    UploadHeader:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: string
    Content:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          type: string
        expires_at:
          type: string
          format: date-time
    DuplicateAsset:
      type: object
      additionalProperties: false
      required: [purpose, scope]
      properties:
        purpose:
          $ref: '#/components/schemas/AssetPurpose'
        scope:
          $ref: '#/components/schemas/AssetScope'
        name:
          type: string
