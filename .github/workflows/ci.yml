name: CI

on:
  push:
  pull_request:

# 其他分支上的新推送取消同一分支较早的运行。main 的每次运行各占一个组：同一组里只保留一个排队的运行，
# 共用一个组时，排队中的运行会被更晚的推送替换掉，只靠 cancel-in-progress 保不住每个提交的结果。
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server (${{ matrix.shard }})
    # 同仓库分支的 PR 已由 push 事件在同一个提交上跑过；pull_request 事件只为 fork 的 PR 运行
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    # Go 整包预算 20m，另留生成、编译、lint 与工具模块的时间。
    timeout-minutes: 25
    # Go 测试分路并行（make test-shard）：bootstrap 包在运行器上已用 919–1185 秒，逼近 20m 的整包期限，
    # 它的测试轮流分到各路，其他包只在第 0 路。负责人 2026-11-08 批准分两路；再改路数须负责人同意。
    strategy:
      # 一路失败不取消另一路，两路的结果都看得到
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/**/go.sum
      - name: Go version
        working-directory: server
        run: go version
      # 生成物与 lint 和测试的分路无关，只在第 0 路检查
      - name: Generated code
        if: matrix.shard == 0
        run: make gen-check-go
      - name: Lint
        if: matrix.shard == 0
        run: make lint-go
      - name: Test
        run: make test-shard SHARD=${{ matrix.shard }} SHARDS=${{ strategy.job-total }}

  web:
    name: web
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Enable corepack
        run: corepack enable
      # pnpm 的包存储按锁文件缓存：锁文件变了就换一个缓存，旧的包不会越积越多
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generated code
        run: make gen-check-web
      - name: Lint
        run: make lint-web
      - name: Unit tests
        run: make test-web
      # 门禁（M1/P3 起）：未使用的文件、导出、依赖和过时的配置都会失败
      - name: Unused code
        run: make knip
      - name: Build
        run: make build-web

  e2e:
    name: e2e
    # server、web 都通过之后才运行；if 与这两个任务相同
    needs: [server, web]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    # 完整故事约21–22分钟（M5 收尾），绿色作业23–24分钟；安装浏览器一步在运行器上偶尔停滞数分钟到二十多分钟。
    # 负责人2026-11-07批准由25改为35分钟（M6 迭代与模块还会加故事）；再改须负责人同意。
    timeout-minutes: 35
    env:
      # 写进 bin/nerve 的版本号，与默认值不同，S3 由此确认 make build 的注入生效
      VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/**/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Enable corepack
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      # 只装无界面的 Chromium、Firefox（A4 的页面测试也在 Firefox 中跑，见 e2e/playwright.config.ts）和它们需要的
      # 系统库；不缓存浏览器：系统库缓存不了，下载和恢复缓存的耗时相当
      - name: Install the Playwright browsers
        working-directory: e2e
        run: pnpm exec playwright install --with-deps --only-shell chromium firefox
      # turbo 的缓存不跨任务保存，前端在这里再构建一次；持续集成中只有这一步完整执行 make build（见 P6 spec 2.9）
      - name: Build
        run: make build
      - name: E2E
        run: make e2e
      # 报告中带着失败用例的操作记录（trace）和截图；test-results/ 中另有每个 worker 的 nerve 日志
      - name: Upload the Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
