# sqlc 配置（M2 设计 3.14）：每个模块一个条目，由 make gen-go 在 server/ 下执行
#   CGO_ENABLED=0 go tool -modfile=tools/go.mod sqlc generate
# schema 只列本模块的迁移：查询碰到别的模块的表，生成时就报错。archtest 的 TestSQLCSchemaScope 核对这份配置。
# 类型覆盖：uuid 用标准库的 uuid.UUID，timestamptz 用 time.Time（db_type 写 timestamptz，写 pg_catalog.timestamptz 不匹配）。
version: "2"
sql:
  - engine: postgresql
    schema:
      - migrations/sql/00001_identity_users.sql
      - migrations/sql/00002_identity_profiles.sql
      - migrations/sql/00003_identity_auth_sessions.sql
      - migrations/sql/00004_identity_api_tokens.sql
    queries: internal/modules/identity/adapter/postgres/queries
    gen:
      go:
        package: gen
        out: internal/modules/identity/adapter/postgres/gen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: {import: uuid, type: UUID}
          - db_type: uuid
            nullable: true
            go_type: {import: uuid, type: UUID, pointer: true}
          - db_type: timestamptz
            go_type: {import: time, type: Time}
          - db_type: timestamptz
            nullable: true
            go_type: {import: time, type: Time, pointer: true}
  - engine: postgresql
    schema:
      - migrations/sql/00006_workspace_workspaces.sql
      - migrations/sql/00007_workspace_workspace_members.sql
      - migrations/sql/00008_workspace_workspace_user_properties.sql
      - migrations/sql/00009_workspace_workspace_member_invites.sql
    queries: internal/modules/workspace/adapter/postgres/queries
    gen:
      go:
        package: gen
        out: internal/modules/workspace/adapter/postgres/gen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: {import: uuid, type: UUID}
          - db_type: uuid
            nullable: true
            go_type: {import: uuid, type: UUID, pointer: true}
          - db_type: timestamptz
            go_type: {import: time, type: Time}
          - db_type: timestamptz
            nullable: true
            go_type: {import: time, type: Time, pointer: true}
  - engine: postgresql
    schema:
      - migrations/sql/00010_project_projects.sql
      - migrations/sql/00011_project_project_members.sql
      - migrations/sql/00012_project_project_user_properties.sql
      - migrations/sql/00013_project_states.sql
      - migrations/sql/00014_project_labels.sql
    queries: internal/modules/project/adapter/postgres/queries
    gen:
      go:
        package: gen
        out: internal/modules/project/adapter/postgres/gen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: {import: uuid, type: UUID}
          - db_type: uuid
            nullable: true
            go_type: {import: uuid, type: UUID, pointer: true}
          - db_type: timestamptz
            go_type: {import: time, type: Time}
          - db_type: timestamptz
            nullable: true
            go_type: {import: time, type: Time, pointer: true}
