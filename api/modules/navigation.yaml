# navigation 模块的接口（M7 设计 §5、P3b spec §2.4）。生成的 Go 代码在
# server/internal/modules/navigation/adapter/http/gen（make gen-go）。
# 一个 View 装两种视图（project_id 为空即工作区视图），filters 是两种键的并集（13 个），
# 哪一种收哪些键、什么值由用例按视图的种类判（422），结构由请求体的检查判（400）。
# 显示的两项与图标引 ../common.yaml（M6/P3b R5、P3b R5）；没有 PUT（D24）。
openapi: 3.1.0
info:
  title: Nerve navigation API
  version: v0
paths:
  /api/v0/projects/{project_id}/views:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listProjectViews
      tags: [navigation]
      summary: List a project's views
      description: >-
        For the project's admins, members and guests, whether its views are
        turned on or off (Project.issue_views_view) and whether it is
        archived. A caller who sees only his own work items there, a guest
        while the project does not show its guests everything, lists only
        the views he owns. The project's undeleted views, the newest first
        by created_at, then by id, both descending. A project that does not
        exist, is deleted, or that the caller does not see answers
        project.not_found; one he sees but is not a member of, forbidden.
        The whole collection at once: collections are not paginated.
      security: [{bearer: []}]
      x-problem-codes: [project.not_found, forbidden]
      responses:
        '200':
          description: The project's views.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProjectView
      tags: [navigation]
      summary: Create a view in a project
      description: >-
        For the project's admins and members, and the workspace's admins who
        are its guests; not its other guests. The values follow
        ViewCreate, the filters and the display filters as a project's
        list's (ViewFilters), every problem in one validation_failed,
        checked before the project is looked at. A project that does not
        exist, is deleted, or that the caller does not see answers
        project.not_found; one he sees but may not create a view in,
        forbidden; a project whose views are turned off
        (Project.issue_views_view), navigation.views_disabled. An archived
        project takes views as any other. The caller owns the new view.
        Everything is decided after the workspace's and the project's rows
        are locked, and written at one moment by the caller.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, project.not_found, forbidden, navigation.views_disabled]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewCreate'
      responses:
        '201':
          description: The new view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/views:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listWorkspaceViews
      tags: [navigation]
      summary: List a workspace's own views
      description: >-
        For the workspace's admins and members, not its guests. The
        workspace's undeleted views of no project, the newest first by
        created_at, then by id, both descending; a project's views are
        listed by listProjectViews. A workspace that does not exist, is
        deleted, or of which the caller is not an active member answers
        workspace.not_found; its guest, forbidden. The whole collection at
        once: collections are not paginated.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found, forbidden]
      responses:
        '200':
          description: The workspace's own views.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWorkspaceView
      tags: [navigation]
      summary: Create a view of a workspace
      description: >-
        For the workspace's admins and members, not its guests: a view of no
        project. The values follow ViewCreate, the filters and the display
        filters as the workspace's list's (ViewFilters), every problem in one
        validation_failed, checked before the workspace is looked at. A
        workspace that does not exist, is deleted, or of which the caller is
        not an active member answers workspace.not_found; its guest,
        forbidden. The caller owns the new view. Everything is decided after
        the workspace's row is locked, and written at one moment by the
        caller.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, workspace.not_found, forbidden]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewCreate'
      responses:
        '201':
          description: The new view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/views/{view_id}:
    parameters:
      - $ref: '#/components/parameters/ViewID'
    get:
      operationId: getView
      tags: [navigation]
      summary: Read a view
      description: >-
        A view of either kind, read first to tell which: a project's view
        for the project's admins, members and guests, whether its views are
        turned on or off and whether it is archived; a workspace's view for
        the workspace's admins and members. A view that does not exist or is
        deleted, one whose project or workspace is deleted or the caller
        does not see, and another's while he sees only his own work items in
        its project answer navigation.view_not_found, the same answer as an
        id that never was. One he sees but whose views he may not read
        answers forbidden.
      security: [{bearer: []}]
      x-problem-codes: [navigation.view_not_found, forbidden]
      responses:
        '200':
          description: The view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateView
      tags: [navigation]
      summary: Change a view
      description: >-
        For its owner alone, while his role still lets him change the views
        of its project, or of its workspace for a workspace's view, as
        createProjectView and createWorkspaceView. Each field given replaces
        that field whole, each left out is kept; null is no value of any. A
        view getView would answer navigation.view_not_found answers it here
        too; then a caller whose role may not change it, or who is not its
        owner, forbidden; then the values, every problem in one
        validation_failed, the filters and the display filters as its kind's
        (ViewFilters). The view is then read again under the locks of its
        workspace's row, its project's and its own, and decided again; a
        project whose views are turned off answers navigation.views_disabled.
        A change that leaves the view as it is, {} among them, writes
        nothing and answers the view, its updated_at kept; any other is
        written at one moment by the caller.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, navigation.view_not_found, forbidden, navigation.views_disabled]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewUpdate'
      responses:
        '200':
          description: The view, changed, or as it is when nothing changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteView
      tags: [navigation]
      summary: Delete a view
      description: >-
        For its owner, while his role still lets him change the views of its
        project or of its workspace, and for its admin: a project's view's,
        the project's admin, or the workspace's admin who is the project's
        member or guest (a guest who sees only his own work items there
        sees no other's view); a workspace's view's, the workspace's admin.
        A view getView would answer navigation.view_not_found answers it
        here too; then a caller who may not delete it, forbidden. The view
        is then read again under the locks of its workspace's row, its
        project's and its own, and decided again; a project whose views are
        turned off answers navigation.views_disabled. The view is deleted
        at one moment by the caller.
      security: [{bearer: []}]
      x-problem-codes: [navigation.view_not_found, forbidden, navigation.views_disabled]
      responses:
        '204':
          description: The view is deleted.
        default:
          $ref: '#/components/responses/Problem'
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份（M0-P3 交接 3）
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: A workspace's slug, as in the web app's address.
      schema:
        type: string
    ProjectID:
      name: project_id
      in: path
      required: true
      description: A project's id (Project.id).
      schema:
        type: string
        format: uuid
    ViewID:
      name: view_id
      in: path
      required: true
      description: A view's id (View.id), a project's view or a workspace's.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited and server_busy.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '../common.yaml#/components/schemas/Problem'
  schemas:
    View:
      description: >-
        A saved view: a project's, or, with project_id null, a workspace's;
        the list settings it shows its work items with, and its owner, the
        account that created it, who alone changes it.
      type: object
      additionalProperties: false
      required: [id, workspace_id, project_id, name, description, logo_props, filters, display_filters, display_properties, owned_by_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          description: The view's project; null for a workspace's view.
          type: [string, 'null']
          format: uuid
        name:
          type: string
        description:
          description: Plain text; empty for none.
          type: string
        logo_props:
          $ref: '../common.yaml#/components/schemas/LogoProps'
        filters:
          $ref: '#/components/schemas/ViewFilters'
        display_filters:
          $ref: '../common.yaml#/components/schemas/IssueListDisplayFilters'
        display_properties:
          $ref: '../common.yaml#/components/schemas/IssueListDisplayProperties'
        owned_by_id:
          description: The account that created the view and owns it.
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          description: When the view was last changed; a change of nothing keeps it.
          type: string
          format: date-time
    ViewList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/View'
    ViewFilters:
      description: >-
        A view's saved filters, each key its alternatives; an empty array is
        kept and filters nothing by its key, a key left out is not stored.
        The keys are those of both kinds: a project's view takes the first
        ten and cycle_id and module_id, with the values listIssues takes; a
        workspace's view the first ten and project_id, with the values
        listWorkspaceIssues takes. A key of the other kind, or a value that
        list does not take, answers validation_failed, not_allowed on
        filters.<key> or filters.<key>[<index>]. Whether sub-issues are
        shown is display_filters.sub_issue, not a filter.
      type: object
      additionalProperties: false
      properties:
        state_id:
          type: array
          items:
            type: string
        state_group:
          type: array
          items:
            type: string
        priority:
          type: array
          items:
            type: string
        label_id:
          type: array
          items:
            type: string
        assignee_id:
          type: array
          items:
            type: string
        created_by_id:
          type: array
          items:
            type: string
        mention_id:
          type: array
          items:
            type: string
        subscriber_id:
          type: array
          items:
            type: string
        start_date:
          type: array
          items:
            type: string
        target_date:
          type: array
          items:
            type: string
        cycle_id:
          description: A project's view's alone, the project's cycles, as listIssues' cycle_id.
          type: array
          items:
            type: string
        module_id:
          description: A project's view's alone, the project's modules, as listIssues' module_id.
          type: array
          items:
            type: string
        project_id:
          description: A workspace's view's alone, the workspace's projects, as listWorkspaceIssues' project_id.
          type: array
          items:
            type: string
    ViewCreate:
      description: >-
        A new view. Left out, logo_props is {}, no icon; filters {}, none;
        display_filters the list's defaults, the list layout without
        grouping, the newest first; display_properties every property
        shown. Its display filters follow its kind's list: a project's
        view's, a project's list's layouts and groupings; a workspace's
        view's, the spreadsheet or list layout, with group_by and
        sub_group_by null. A value either refuses answers validation_failed,
        not_allowed on display_filters.<field>.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: 1–255 characters without the surrounding white space, which is dropped; no NUL.
          type: string
        description:
          description: Plain text of any length without NUL; empty when left out.
          type: string
        logo_props:
          $ref: '../common.yaml#/components/schemas/LogoProps'
        filters:
          $ref: '#/components/schemas/ViewFilters'
        display_filters:
          $ref: '../common.yaml#/components/schemas/IssueListDisplayFilters'
        display_properties:
          $ref: '../common.yaml#/components/schemas/IssueListDisplayProperties'
    ViewUpdate:
      description: >-
        A change of a view: each field given replaces that field whole, by
        ViewCreate's rules; each left out is kept.
      type: object
      additionalProperties: false
      properties:
        name:
          description: 1–255 characters without the surrounding white space, which is dropped; no NUL.
          type: string
        description:
          description: Plain text of any length without NUL; empty for none.
          type: string
        logo_props:
          $ref: '../common.yaml#/components/schemas/LogoProps'
        filters:
          $ref: '#/components/schemas/ViewFilters'
        display_filters:
          $ref: '../common.yaml#/components/schemas/IssueListDisplayFilters'
        display_properties:
          $ref: '../common.yaml#/components/schemas/IssueListDisplayProperties'
