version: "2"

linters:
  # standard = errcheck、govet、ineffassign、staticcheck、unused
  default: standard
  enable:
    - depguard
    # 禁止 init()，对应总体设计 6.3 第 4 条
    - gochecknoinits
  settings:
    depguard:
      rules:
        # 整个项目都禁止使用的库。模块边界和分层方向由 internal/archtest 检查。
        banned:
          deny:
            - pkg: github.com/google/uuid
              desc: 用标准库 uuid
            - pkg: github.com/gofrs/uuid
              desc: 用标准库 uuid
            - pkg: github.com/satori/go.uuid
              desc: 用标准库 uuid
            # oapi-codegen 的运行时只给生成代码绑定参数用。生成的文件（带 "Code generated … DO NOT EDIT." 头）
            # 不受这些规则约束：golangci-lint 默认排除它们的问题（linters.exclusions.generated）
            - pkg: github.com/oapi-codegen/runtime/types
              desc: 它的 UUID 是 google/uuid 的别名；用标准库 uuid
            - pkg: github.com/oapi-codegen/runtime
              desc: 只有生成代码用它绑定参数
            - pkg: github.com/spf13/viper
              desc: 用 koanf（platform/config）
            - pkg: github.com/pkg/errors
              desc: 用标准库 errors
            # 末尾的 $ 表示精确匹配：只禁止 log，不影响 log/slog
            - pkg: log$
              desc: 用 log/slog

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/open-nerve/NerveProject
