openapi: 3.1.0
info:
  title: Nerve API
  version: v0
  description: The HTTP API of Nerve. The web app is one client of it; every account can use every endpoint the same way. Every operation lists the problem codes it can answer in x-problem-codes; the top-level x-problem-codes can come from every operation, and an operation that needs a bearer token can also answer unauthorized.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
tags:
  - name: identity
    description: Accounts, sign-in and sessions.
  - name: instance
    description: What this instance runs.
  - name: workspace
    description: Workspaces and their members.
paths:
  /api/v0/auth/register:
    post:
      operationId: register
      tags:
        - identity
      summary: Create an account and sign in
      description: 'Creates an account with its default profile and signs it in: the response holds a new session''s tokens. While sign-up is off, a well-formed request answers identity.signup_disabled before the address or the password is looked at, so the answer never depends on whether the address is registered. The password needs 8–128 characters with an upper-case letter, a lower-case letter, a digit and a special character, and must not be a common password. Registrations have a rate limit of their own per client IP.'
      security: []
      x-problem-codes:
        - identity.signup_disabled
        - validation_failed
        - identity.email_taken
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account exists and is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/login:
    post:
      operationId: login
      tags:
        - identity
      summary: Sign in with an e-mail address and a password
      description: 'Starts a new session and returns its tokens. An unknown address and a wrong password get the same identity.invalid_credentials; a deactivated account answers identity.account_deactivated only to the right password. Logins have rate limits of their own: per client IP, and per client IP and address together.'
      security: []
      x-problem-codes:
        - identity.invalid_credentials
        - identity.account_deactivated
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The new session's tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/refresh:
    post:
      operationId: refreshTokens
      tags:
        - identity
      summary: Exchange a refresh token for the next pair
      description: 'Returns new tokens of the same session and retires the refresh token sent: the next refresh uses the refresh_token of this response. The session''s end, refresh_token_expires_at, never moves. Any refresh token but the current one of a session that has not ended answers identity.refresh_token_invalid; one this session issued before under the current signing key also ends the session, since someone else holds a copy of it.'
      security: []
      x-problem-codes:
        - identity.refresh_token_invalid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: The session's next tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/logout:
    post:
      operationId: logout
      tags:
        - identity
      summary: End the session of a refresh token
      description: Ends the session when refresh_token is its current one. Any other token changes nothing and gets the same answer, which tells nothing about the token.
      security: []
      x-problem-codes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Done, whatever the token was.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me:
    get:
      operationId: getMe
      tags:
        - identity
      summary: Read the caller's account
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateMe
      tags:
        - identity
      summary: Change the caller's names and time zone
      description: 'Changes the fields sent and leaves the others. The e-mail address cannot change here: the server''s administrator changes it with `nerve users set-email`, which signs every session out.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: The caller's account, changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/deactivate:
    post:
      operationId: deactivateMe
      tags:
        - identity
      summary: Deactivate the caller's account
      description: Any credential may, a personal access token too; no password is asked for. Every session is signed out and onboarding starts over. The password and the personal access tokens stay, but nothing authenticates as the account until the server's administrator activates it again with `nerve users activate`; then its unexpired personal access tokens authenticate again.
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '204':
          description: Deactivated.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/change-password:
    post:
      operationId: changePassword
      tags:
        - identity
      summary: Change the caller's password
      description: 'Needs the current password. The new one follows the rules of registration. Every other session of the account is signed out: all of them when the caller is a personal access token. Personal access tokens keep working. Password changes have a rate limit of their own per account.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - identity.current_password_incorrect
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Changed.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/profile:
    get:
      operationId: getProfile
      tags:
        - identity
      summary: Read the caller's preferences
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The caller's preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateProfile
      tags:
        - identity
      summary: Change the caller's preferences
      description: 'Changes the fields sent and leaves the others. The onboarding steps sent are merged into the stored ones: a step not sent keeps its value, also when another request changes it at the same time.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: The caller's preferences, changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/api-tokens:
    get:
      operationId: listApiTokens
      tags:
        - identity
      summary: List the caller's personal access tokens
      description: 'The caller''s personal access tokens that are not revoked, newest first, a page at a time. The tokens themselves are never listed: only createApiToken answers one, once.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createApiToken
      tags:
        - identity
      summary: Create a personal access token
      description: 'Creates a personal access token of the caller and answers the token itself, this once. Sent as "Authorization: Bearer", it acts as the account in every operation until it expires or is revoked, and it can create tokens itself. Any credential may create one; no password is asked for.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
      responses:
        '201':
          description: The new token, with the token itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/api-tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeApiToken
      tags:
        - identity
      summary: Revoke a personal access token
      description: Revokes one of the caller's tokens, which stops working at once; a token may revoke itself. A token that does not exist, is revoked already or belongs to another account is identity.api_token_not_found.
      security:
        - bearer: []
      x-problem-codes:
        - identity.api_token_not_found
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/instance:
    get:
      operationId: getInstance
      tags:
        - instance
      summary: Describe this instance
      description: 'Reports the product, the build and the API version this instance runs, and the settings clients adapt to. Public: needs no authentication.'
      security: []
      x-problem-codes: []
      responses:
        '200':
          description: What this instance runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceInfo'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/timezones:
    get:
      operationId: listTimezones
      tags:
        - instance
      summary: List the time zones to choose from
      description: 'The time zones the web app offers, each with its offset at the time of the request, sorted by offset and then by label. user_timezone takes any IANA name, not only these. Public: needs no authentication.'
      security: []
      x-problem-codes: []
      responses:
        '200':
          description: The time zones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimezoneList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces:
    get:
      operationId: listWorkspaces
      tags:
        - workspace
      summary: List the caller's workspaces
      description: 'The workspaces of which the caller is an active member, each with the caller''s role and the number of active members, by name and then by id. The whole collection at once: collections are not paginated.'
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The caller's workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWorkspace
      tags:
        - workspace
      summary: Create a workspace with the caller as its admin
      description: Creates the workspace and makes the caller its admin and only member; nothing else is created with it. While the instance's workspace_creation_enabled is false, an authenticated, well-formed request answers workspace.creation_disabled before its values are looked at, and the server's administrator creates workspaces with `nerve workspaces create`. The name has 1–80 characters with a letter or a digit and no web address, and a NUL character in it is refused (invalid_format); the slug has 1–48 lower-case letters, digits, - and _, and is neither reserved (not_allowed) nor another undeleted workspace's (workspace.slug_taken). An account deactivated meanwhile answers unauthorized.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.creation_disabled
        - validation_failed
        - workspace.slug_taken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: The new workspace; the caller is its admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: getWorkspace
      tags:
        - workspace
      summary: Read a workspace
      description: A workspace that does not exist, is deleted, or of which the caller is not an active member answers the same workspace.not_found.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
      responses:
        '200':
          description: The workspace, with the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWorkspace
      tags:
        - workspace
      summary: Change a workspace's name, organization size or time zone
      description: 'For the workspace''s admins. The fields given change and the others stay; the values follow createWorkspace''s rules (validation_failed), checked before the workspace is looked at. The slug never changes: a body with slug is refused (bad_request). A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found; a member or a guest, forbidden. The role is decided after the workspace row is locked, so a caller demoted meanwhile is refused.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - workspace.not_found
        - forbidden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: The workspace as changed, with the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteWorkspace
      tags:
        - workspace
      summary: Delete a workspace
      description: For the workspace's admins. The workspace, its memberships and the members' display settings are soft-deleted in one transaction, at the same moment; the members' accounts stay. The slug can name a new workspace at once. Nobody's last_workspace_id is cleared. A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found; a member or a guest, forbidden.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
      responses:
        '204':
          description: The workspace is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/members:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listWorkspaceMembers
      tags:
        - workspace
      summary: List a workspace's members
      description: 'Every membership of the workspace, those that ended too (is_active false), in the order they began, then by id, each with the member''s public profile. For any active member. The addresses are shown to admins and members; to a guest every address is null, his own too. A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found. The whole collection at once: collections are not paginated.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
      responses:
        '200':
          description: The workspace's memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-members/{workspace_member_id}:
    parameters:
      - name: workspace_member_id
        in: path
        required: true
        description: A membership's id (WorkspaceMember.id), not the member's account id.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateWorkspaceMember
      tags:
        - workspace
      summary: Change a member's role
      description: 'For the workspace''s admins. The role is checked first (validation_failed). A membership that does not exist or is deleted, or whose workspace the caller cannot see, answers workspace.member_not_found; a member or a guest, forbidden, whatever the membership. To a caller who may change roles, a membership that has ended answers workspace.member_not_found, and his own workspace.own_membership: nobody changes his own role. The role is decided after the workspace row is locked, so of two admins who demote each other at once only the first succeeds and the workspace keeps an admin.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - workspace.member_not_found
        - forbidden
        - workspace.own_membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberUpdate'
      responses:
        '200':
          description: The membership with its new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-slugs/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: checkWorkspaceSlug
      tags:
        - workspace
      summary: Tell whether a slug can name a new workspace
      description: 'Available, or why not: invalid (not 1–48 lower-case letters, digits, - and _), reserved (a path of this site, or held for one), or taken (an undeleted workspace has it). It tells nothing about the workspace that has it.'
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: Whether the slug is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugAvailability'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/workspaces/{slug}/preferences:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: getWorkspacePreferences
      tags:
        - workspace
      summary: Read the caller's display settings in a workspace
      description: The caller's own settings of the sidebar's project navigation in the workspace, for any active member. Until the caller first changes them they are the defaults, ACCORDION and 10, and reading them writes nothing. A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
      responses:
        '200':
          description: The caller's settings in the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePreferences'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWorkspacePreferences
      tags:
        - workspace
      summary: Change the caller's display settings in a workspace
      description: The fields given change and the others stay; the first change stores the caller's settings, the defaults with the change applied. The values are checked before the workspace is looked at (validation_failed). A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found.
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - workspace.not_found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspacePreferencesUpdate'
      responses:
        '200':
          description: The caller's settings in the workspace, as changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePreferences'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An access token (JWT) from register, login or refresh, or a personal access token (nrv_pat_…).
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          description: The sign-in address; stored trimmed and in lower case.
          type: string
          format: email
        password:
          type: string
    FieldError:
      description: One invalid field of a request. Clients show text looked up by `code`; `message` is an English explanation for developers. Must match httpserver.FieldError and the field codes of internal/shared.
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          description: The field's path in the request body, e.g. password or tags[1].name. A path longer than 256 bytes is cut short and ends with `…`.
          type: string
        code:
          description: What is wrong with the field.
          type: string
          enum:
            - required
            - invalid_format
            - too_short
            - too_long
            - out_of_range
            - not_allowed
            - duplicate
            - weak_password
            - common_password
            - must_be_future
            - contains_url
        message:
          type: string
    Problem:
      description: RFC 9457 problem details (v0 design 3.5). `title` is the HTTP status phrase, `detail` explains this occurrence, and clients branch on `code`. Must match httpserver.Problem; the platform's contract test checks it.
      type: object
      additionalProperties: false
      required:
        - status
        - code
        - title
      properties:
        status:
          description: HTTP status code.
          type: integer
        code:
          description: Stable error code. Platform codes have no prefix (bad_request, unauthorized, forbidden, not_found, payload_too_large, validation_failed, rate_limited, server_busy, internal_error, not_ready); module codes are prefixed with the module that refuses, e.g. identity.email_taken, whichever module's operation answers them. Each operation lists the codes it can answer in x-problem-codes.
          type: string
        title:
          description: HTTP status phrase, e.g. "Not Found".
          type: string
        detail:
          description: What went wrong in this occurrence.
          type: string
        errors:
          description: The invalid fields of the request.
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    AuthTokens:
      description: 'A session''s tokens. Send access_token as "Authorization: Bearer"; when it expires, exchange refresh_token for the next pair at POST /api/v0/auth/refresh.'
      type: object
      additionalProperties: false
      required:
        - token_type
        - access_token
        - access_token_expires_in
        - refresh_token
        - refresh_token_expires_at
      properties:
        token_type:
          type: string
          enum:
            - Bearer
        access_token:
          type: string
        access_token_expires_in:
          description: Seconds from this response until the access token expires.
          type: integer
        refresh_token:
          description: An opaque nrv_rt_ token.
          type: string
        refresh_token_expires_at:
          description: When the session ends; refreshing never extends it.
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          description: The sign-in address, in any case, with or without surrounding blanks.
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          description: The refresh_token of the last AuthTokens of the session.
          type: string
    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          description: The refresh_token of the last AuthTokens of the session.
          type: string
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - first_name
        - last_name
        - display_name
        - user_timezone
        - avatar_url
        - cover_image_url
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
        user_timezone:
          description: An IANA time zone name.
          type: string
        avatar_url:
          description: Null until uploads arrive (M5).
          type:
            - string
            - 'null'
        cover_image_url:
          description: Null until uploads arrive (M5).
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        first_name:
          description: At most 255 characters, without a web address.
          type: string
        last_name:
          description: At most 255 characters, without a web address.
          type: string
        display_name:
          description: 1–255 characters.
          type: string
        user_timezone:
          description: An IANA time zone name, e.g. from GET /api/v0/timezones.
          type: string
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
    Theme:
      type: string
      enum:
        - system
        - light
        - dark
        - light-contrast
        - dark-contrast
    Language:
      description: The language of the web UI.
      type: string
      enum:
        - en
        - zh-CN
    StartOfTheWeek:
      description: The first day of the week, 0 Sunday to 6 Saturday.
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
    OnboardingSteps:
      type: object
      additionalProperties: false
      required:
        - profile_complete
        - workspace_create
        - workspace_invite
        - workspace_join
      properties:
        profile_complete:
          type: boolean
        workspace_create:
          type: boolean
        workspace_invite:
          type: boolean
        workspace_join:
          type: boolean
    Profile:
      type: object
      additionalProperties: false
      required:
        - theme
        - language
        - start_of_the_week
        - onboarding_step
        - is_onboarded
        - is_tour_completed
        - last_workspace_id
        - updated_at
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          $ref: '#/components/schemas/Language'
        start_of_the_week:
          $ref: '#/components/schemas/StartOfTheWeek'
        onboarding_step:
          $ref: '#/components/schemas/OnboardingSteps'
        is_onboarded:
          type: boolean
        is_tour_completed:
          type: boolean
        last_workspace_id:
          description: The workspace the web app opens last; null for none. It is not checked to exist.
          type:
            - string
            - 'null'
          format: uuid
        updated_at:
          type: string
          format: date-time
    OnboardingStepsUpdate:
      description: The steps to set; the others keep their values.
      type: object
      additionalProperties: false
      properties:
        profile_complete:
          type: boolean
        workspace_create:
          type: boolean
        workspace_invite:
          type: boolean
        workspace_join:
          type: boolean
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          $ref: '#/components/schemas/Language'
        start_of_the_week:
          $ref: '#/components/schemas/StartOfTheWeek'
        onboarding_step:
          $ref: '#/components/schemas/OnboardingStepsUpdate'
        is_onboarded:
          type: boolean
        is_tour_completed:
          type: boolean
        last_workspace_id:
          description: Null clears it.
          type:
            - string
            - 'null'
          format: uuid
    ApiToken:
      description: A personal access token as lists show it. The token itself appears only in ApiTokenCreated.
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - description
        - expired_at
        - last_used
        - created_at
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        description:
          type: string
        expired_at:
          description: When the token stops working; null when it never does.
          type:
            - string
            - 'null'
          format: date-time
        last_used:
          description: When the token last authenticated a request, to the minute; null when it never has.
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    NextCursor:
      description: The cursor of the next page; null on the last page.
      type:
        - string
        - 'null'
    ApiTokenPage:
      type: object
      additionalProperties: false
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    ApiTokenCreate:
      type: object
      additionalProperties: false
      properties:
        label:
          description: 1–255 characters; 32 hexadecimal digits are made up when it is absent.
          type: string
        description:
          type: string
        expired_at:
          description: A time in the future; absent or null for a token that never expires.
          type:
            - string
            - 'null'
          format: date-time
    ApiTokenCreated:
      description: 'A new personal access token: the fields of ApiToken, and the token itself, which is shown this once and cannot be read again.'
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - description
        - expired_at
        - last_used
        - created_at
        - token
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        description:
          type: string
        expired_at:
          description: When the token stops working; null when it never does.
          type:
            - string
            - 'null'
          format: date-time
        last_used:
          description: Null; the token has not been used yet.
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        token:
          description: The token, nrv_pat_ and 43 more characters.
          type: string
    InstanceInfo:
      type: object
      additionalProperties: false
      required:
        - product
        - version
        - commit
        - api_version
        - signup_enabled
        - workspace_creation_enabled
        - file_size_limit
      properties:
        product:
          description: Product name.
          type: string
          examples:
            - Nerve
        version:
          description: Product version of the running build.
          type: string
          examples:
            - 0.1.0-dev
        commit:
          description: Git revision of the running build; "unknown" when the build carries no VCS stamp.
          type: string
        api_version:
          description: Version of this HTTP API; every path starts with /api/{api_version}.
          type: string
          enum:
            - v0
        signup_enabled:
          description: Whether anyone may register (auth.signup_enabled).
          type: boolean
        workspace_creation_enabled:
          description: Whether workspaces can be created (workspace.creation_enabled).
          type: boolean
        file_size_limit:
          description: The largest file an upload may have, in bytes (files.size_limit).
          type: integer
          minimum: 1
    Timezone:
      type: object
      additionalProperties: false
      required:
        - label
        - value
        - utc_offset
        - gmt_offset
      properties:
        label:
          description: A place in the time zone, e.g. Beijing.
          type: string
        value:
          description: The IANA name, what user_timezone takes.
          type: string
          examples:
            - Asia/Shanghai
        utc_offset:
          description: The offset at the time of the request.
          type: string
          examples:
            - UTC+08:00
        gmt_offset:
          description: The same offset, written from GMT.
          type: string
          examples:
            - GMT+08:00
    TimezoneList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Timezone'
    WorkspaceRole:
      description: A member's role in a workspace, 5 guest, 15 member, 20 admin.
      type: integer
      enum:
        - 5
        - 15
        - 20
    Workspace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - organization_size
        - timezone
        - logo_url
        - role
        - total_members
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          description: Lower case; it never changes.
          type: string
        organization_size:
          description: One of OrganizationSize's values; null when none was given.
          type:
            - string
            - 'null'
        timezone:
          description: An IANA time zone name.
          type: string
        logo_url:
          description: Null until uploads arrive (M5).
          type:
            - string
            - 'null'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        total_members:
          description: The number of active members.
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
    OrganizationSize:
      description: The size of the organization, as the web app's form offers it.
      type: string
      enum:
        - Just myself
        - 2-10
        - 11-50
        - 51-200
        - 201-500
        - 500+
    WorkspaceCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          description: 1–80 characters, with a letter or a digit, without a web address.
          type: string
        slug:
          description: 1–48 lower-case letters, digits, - and _; not reserved.
          type: string
        organization_size:
          $ref: '#/components/schemas/OrganizationSize'
        timezone:
          description: An IANA time zone name, e.g. from GET /api/v0/timezones; UTC when not given.
          type: string
    WorkspaceUpdate:
      description: Changes the fields it names; a field left out keeps its value. organization_size cannot be set to null.
      type: object
      additionalProperties: false
      properties:
        name:
          description: 1–80 characters, with a letter or a digit, without a web address.
          type: string
        organization_size:
          $ref: '#/components/schemas/OrganizationSize'
        timezone:
          description: An IANA time zone name.
          type: string
    MemberUser:
      description: 'A member''s public profile, embedded in the membership: the one way v0 shows other accounts (M3 design 5.2).'
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - first_name
        - last_name
        - avatar_url
        - email
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        avatar_url:
          description: Null until uploads arrive (M5).
          type:
            - string
            - 'null'
        email:
          description: The member's address for a caller who is an admin or a member; null for a guest.
          type:
            - string
            - 'null'
    WorkspaceMember:
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - role
        - is_active
        - created_at
        - member
      properties:
        id:
          description: The membership's id, which /workspace-members/{workspace_member_id} names.
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        is_active:
          description: False once the membership has ended.
          type: boolean
        created_at:
          type: string
          format: date-time
        member:
          $ref: '#/components/schemas/MemberUser'
    WorkspaceMemberList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
    WorkspaceMemberUpdate:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    SlugAvailability:
      type: object
      additionalProperties: false
      required:
        - available
      properties:
        available:
          type: boolean
        reason:
          description: Why the slug is not available; absent when it is.
          type: string
          enum:
            - invalid
            - reserved
            - taken
    NavigationControlPreference:
      description: How the sidebar shows the projects, as sections one under another or as tabs.
      type: string
      enum:
        - ACCORDION
        - TABBED
    NavigationProjectLimit:
      description: How many projects the sidebar shows before "more"; 0 shows them all.
      type: integer
      minimum: 0
      maximum: 2147483647
    WorkspacePreferences:
      type: object
      additionalProperties: false
      required:
        - navigation_control_preference
        - navigation_project_limit
      properties:
        navigation_control_preference:
          $ref: '#/components/schemas/NavigationControlPreference'
        navigation_project_limit:
          $ref: '#/components/schemas/NavigationProjectLimit'
    WorkspacePreferencesUpdate:
      type: object
      additionalProperties: false
      properties:
        navigation_control_preference:
          $ref: '#/components/schemas/NavigationControlPreference'
        navigation_project_limit:
          $ref: '#/components/schemas/NavigationProjectLimit'
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: Whole seconds to wait before trying again, rounded up; sent with rate_limited and server_busy.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: 'Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token" (RFC 6750 3) when the bearer token sent is refused before the operation runs, being invalid or expired; plain Bearer for every other 401, including a credential that the operation finds revoked while it runs.'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    Limit:
      name: limit
      in: query
      description: The page size, 1–100; 50 when absent. Outside that range the answer is 422 validation_failed on limit.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the page before; absent for the first page. A cursor that does not decode, has an unknown version or a payload of another shape than this list's, or is not spelled as the server writes it is 400 bad_request on cursor.
      schema:
        type: string
    Slug:
      name: slug
      in: path
      required: true
      description: A workspace's slug, as in the web app's address.
      schema:
        type: string
x-problem-codes:
  - bad_request
  - payload_too_large
  - rate_limited
  - internal_error
