# 本地开发数据库。账号密码只在本机使用，不是机密。
name: nerve-dev

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: nerve
      POSTGRES_PASSWORD: nerve
      POSTGRES_DB: nerve
    ports:
      - "127.0.0.1:${NERVE_DEV_DB_PORT:-55432}:5432"
    volumes:
      # Postgres 18 起数据目录为 /var/lib/postgresql/18/docker，
      # 数据卷必须挂在 /var/lib/postgresql，挂在旧路径 /var/lib/postgresql/data 数据不会进卷。
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nerve -d nerve"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
