openapi: 3.1.0
info:
  title: Nerve API
  version: v0
  description: The HTTP API of Nerve. The web app is one client of it; every account can use every endpoint the same way. Every operation lists the problem codes it can answer in x-problem-codes; the top-level x-problem-codes can come from every operation, and an operation that needs a bearer token can also answer unauthorized.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
tags:
  - name: identity
    description: Accounts, sign-in and sessions.
  - name: instance
    description: What this instance runs.
  - name: workspace
    description: Workspaces and their members.
  - name: project
    description: Projects, their members and their states.
paths:
  /api/v0/auth/register:
    post:
      operationId: register
      tags:
        - identity
      summary: Create an account and sign in
      description: 'Creates an account with its default profile and signs it in: the response holds a new session''s tokens. While sign-up is off, a well-formed request answers identity.signup_disabled before the address is validated or looked up, so the answer never depends on whether the address is registered; unless it names an invitation whose link it holds, pending, to the address it registers (normalized). Every other invitation answers the same identity.signup_disabled, whatever is wrong with it. Once sign-up is allowed (it is on, or the request holds such a link), registration answers as usual: validation_failed for a weak password, identity.email_taken for an address already registered, and neither creates an account. Registering does not accept the invitation. The password needs 8–128 characters with an upper-case letter, a lower-case letter, a digit and a special character, and must not be a common password. Registrations have a rate limit of their own per client IP.'
      security: []
      x-problem-codes:
        - identity.signup_disabled
        - validation_failed
        - identity.email_taken
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account exists and is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/login:
    post:
      operationId: login
      tags:
        - identity
      summary: Sign in with an e-mail address and a password
      description: 'Starts a new session and returns its tokens. An unknown address and a wrong password get the same identity.invalid_credentials; a deactivated account answers identity.account_deactivated only to the right password. Logins have rate limits of their own: per client IP, and per client IP and address together.'
      security: []
      x-problem-codes:
        - identity.invalid_credentials
        - identity.account_deactivated
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The new session's tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/refresh:
    post:
      operationId: refreshTokens
      tags:
        - identity
      summary: Exchange a refresh token for the next pair
      description: 'Returns new tokens of the same session and retires the refresh token sent: the next refresh uses the refresh_token of this response. The session''s end, refresh_token_expires_at, never moves. Any refresh token but the current one of a session that has not ended answers identity.refresh_token_invalid; one this session issued before under the current signing key also ends the session, since someone else holds a copy of it.'
      security: []
      x-problem-codes:
        - identity.refresh_token_invalid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: The session's next tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/logout:
    post:
      operationId: logout
      tags:
        - identity
      summary: End the session of a refresh token
      description: Ends the session when refresh_token is its current one. Any other token changes nothing and gets the same answer, which tells nothing about the token.
      security: []
      x-problem-codes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Done, whatever the token was.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me:
    get:
      operationId: getMe
      tags:
        - identity
      summary: Read the caller's account
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateMe
      tags:
        - identity
      summary: Change the caller's names and time zone
      description: 'Changes the fields sent and leaves the others. The e-mail address cannot change here: the server''s administrator changes it with `nerve users set-email`, which signs every session out.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: The caller's account, changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/deactivate:
    post:
      operationId: deactivateMe
      tags:
        - identity
      summary: Deactivate the caller's account
      description: Any credential may, a personal access token too; no password is asked for. Every session is signed out and onboarding starts over. The password and the personal access tokens stay, but nothing authenticates as the account until the server's administrator activates it again with `nerve users activate`; then its unexpired personal access tokens authenticate again.
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '204':
          description: Deactivated.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/change-password:
    post:
      operationId: changePassword
      tags:
        - identity
      summary: Change the caller's password
      description: 'Needs the current password. The new one follows the rules of registration. Every other session of the account is signed out: all of them when the caller is a personal access token. Personal access tokens keep working. Password changes have a rate limit of their own per account.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - identity.current_password_incorrect
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Changed.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/profile:
    get:
      operationId: getProfile
      tags:
        - identity
      summary: Read the caller's preferences
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The caller's preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateProfile
      tags:
        - identity
      summary: Change the caller's preferences
      description: 'Changes the fields sent and leaves the others. The onboarding steps sent are merged into the stored ones: a step not sent keeps its value, also when another request changes it at the same time.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: The caller's preferences, changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/api-tokens:
    get:
      operationId: listApiTokens
      tags:
        - identity
      summary: List the caller's personal access tokens
      description: 'The caller''s personal access tokens that are not revoked, newest first, a page at a time. The tokens themselves are never listed: only createApiToken answers one, once.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createApiToken
      tags:
        - identity
      summary: Create a personal access token
      description: 'Creates a personal access token of the caller and answers the token itself, this once. Sent as "Authorization: Bearer", it acts as the account in every operation until it expires or is revoked, and it can create tokens itself. Any credential may create one; no password is asked for.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
      responses:
        '201':
          description: The new token, with the token itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/api-tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeApiToken
      tags:
        - identity
      summary: Revoke a personal access token
      description: Revokes one of the caller's tokens, which stops working at once; a token may revoke itself. A token that does not exist, is revoked already or belongs to another account is identity.api_token_not_found.
      security:
        - bearer: []
      x-problem-codes:
        - identity.api_token_not_found
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/instance:
    get:
      operationId: getInstance
      tags:
        - instance
      summary: Describe this instance
      description: 'Reports the product, the build and the API version this instance runs, and the settings clients adapt to. Public: needs no authentication.'
      security: []
      x-problem-codes: []
      responses:
        '200':
          description: What this instance runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceInfo'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/timezones:
    get:
      operationId: listTimezones
      tags:
        - instance
      summary: List the time zones to choose from
      description: 'The time zones the web app offers, each with its offset at the time of the request, sorted by offset and then by label. user_timezone takes any IANA name, not only these. Public: needs no authentication.'
      security: []
      x-problem-codes: []
      responses:
        '200':
          description: The time zones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimezoneList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces:
    get:
      operationId: listWorkspaces
      tags:
        - workspace
      summary: List the caller's workspaces
      description: 'The workspaces of which the caller is an active member, each with the caller''s role and the number of active members, by name and then by id. The whole collection at once: collections are not paginated.'
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The caller's workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWorkspace
      tags:
        - workspace
      summary: Create a workspace with the caller as its admin
      description: Creates the workspace and makes the caller its admin and only member; nothing else is created with it. While the instance's workspace_creation_enabled is false, an authenticated, well-formed request answers workspace.creation_disabled before its values are looked at, and the server's administrator creates workspaces with `nerve workspaces create`. The name has 1–80 characters with a letter or a digit and no web address, and a NUL character in it is refused (invalid_format); the slug has 1–48 lower-case letters, digits, - and _, and is neither reserved (not_allowed) nor another undeleted workspace's (workspace.slug_taken). An account deactivated meanwhile answers unauthorized.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.creation_disabled
        - validation_failed
        - workspace.slug_taken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: The new workspace; the caller is its admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: getWorkspace
      tags:
        - workspace
      summary: Read a workspace
      description: A workspace that does not exist, is deleted, or of which the caller is not an active member answers the same workspace.not_found.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
      responses:
        '200':
          description: The workspace, with the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWorkspace
      tags:
        - workspace
      summary: Change a workspace's name, organization size or time zone
      description: 'For the workspace''s admins. The fields given change and the others stay; the values follow createWorkspace''s rules (validation_failed), checked before the workspace is looked at. The slug never changes: a body with slug is refused (bad_request). A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found; a member or a guest, forbidden. The role is decided after the workspace row is locked, so a caller demoted meanwhile is refused.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - workspace.not_found
        - forbidden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: The workspace as changed, with the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteWorkspace
      tags:
        - workspace
      summary: Delete a workspace
      description: For the workspace's admins. The workspace, its invitations, its memberships, the members' display settings, and its projects with their memberships, display settings and states are soft-deleted in one transaction, at the same moment; the members' accounts stay. The slug can name a new workspace at once. Nobody's last_workspace_id is cleared. A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found; a member or a guest, forbidden.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
      responses:
        '204':
          description: The workspace is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/members:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listWorkspaceMembers
      tags:
        - workspace
      summary: List a workspace's members
      description: 'Every membership of the workspace, those that ended too (is_active false), in the order they began, then by id, each with the member''s public profile. For any active member. The addresses are shown to admins and members; to a guest every address is null, his own too. A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found. The whole collection at once: collections are not paginated.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
      responses:
        '200':
          description: The workspace's memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/invitations:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listWorkspaceInvitations
      tags:
        - workspace
      summary: List a workspace's invitations
      description: 'The workspace''s invitations, pending and declined, newest first, then by id, each with the token of its link: for the workspace''s admins alone. An accepted invitation is no longer listed. A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found; a member or a guest, forbidden. The whole collection at once: collections are not paginated.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
      responses:
        '200':
          description: The workspace's invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWorkspaceInvitations
      tags:
        - workspace
      summary: Invite addresses to a workspace
      description: 'For the workspace''s admins. Each address is normalized as at registration (surrounding white space removed, lower case) and the batch is checked first: 1–100 invitations, each address valid (invalid_format) and listed once (duplicate), each role one of the three (invalid_format). Then, the workspace looked at: an active member''s address is not_allowed, and an address with an invitation to the workspace, pending or declined, duplicate, also when another request invites it at the same time. The batch is refused as a whole, one validation_failed naming each invitations[i] of the request as sent; a batch that loses the race to another request, which commits its addresses between this one''s check and its insert, names only the first of them in the order of the normalized addresses. A declined invitation holds its address until it is deleted. The answer is the new invitations in the request''s order, each with the token of its link. A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found; a member or a guest, forbidden. A credential revoked meanwhile, by a password reset, answers unauthorized, and nothing is invited.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - workspace.not_found
        - forbidden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitationsCreate'
      responses:
        '201':
          description: The new invitations, in the request's order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-members/{workspace_member_id}:
    parameters:
      - name: workspace_member_id
        in: path
        required: true
        description: A membership's id (WorkspaceMember.id), not the member's account id.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateWorkspaceMember
      tags:
        - workspace
      summary: Change a member's role
      description: 'For the workspace''s admins. The role is checked first (validation_failed). A membership that does not exist or is deleted, or whose workspace the caller cannot see, answers workspace.member_not_found; a member or a guest, forbidden, whatever the membership. To a caller who may change roles, a membership that has ended answers workspace.member_not_found, and his own workspace.own_membership: nobody changes his own role. The role is decided after the workspace row is locked, so of two admins who demote each other at once only the first succeeds and the workspace keeps an admin. A change to guest also makes the member a guest in every project of the workspace he has a membership of, ended ones too, in the same transaction.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - workspace.member_not_found
        - forbidden
        - workspace.own_membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberUpdate'
      responses:
        '200':
          description: The membership with its new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeWorkspaceMember
      tags:
        - workspace
      summary: Remove a member
      description: 'For the workspace''s admins. A membership that does not exist or is deleted, or whose workspace the caller cannot see, answers workspace.member_not_found; a member or a guest, forbidden, whatever the membership. To a caller who may remove members, a membership that has ended answers workspace.member_not_found, and his own workspace.own_membership: one leaves a workspace through leaveWorkspace. The workspace''s pending invitation to the member''s address is deleted, so that he needs a new one to come back; a declined one stays. His membership ends, its row kept, and so do his memberships of the workspace''s projects, all at the same moment, in one transaction. Were he the only active admin of a project of the workspace that has other active members, project.sole_admin, and nothing changes.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.member_not_found
        - forbidden
        - workspace.own_membership
        - project.sole_admin
      responses:
        '204':
          description: The membership has ended.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
    get:
      operationId: getWorkspaceInvitation
      tags:
        - workspace
      summary: Show an invitation to whoever holds its link
      description: 'Public: the link''s token stands for a credential, and the answer is the same with a bearer token or without one. It shows the invitation''s role, whether it was declined, and its workspace''s name and slug; never the address invited. A token that is not the invitation''s, and an invitation that does not exist, is deleted or accepted, answer the same workspace.invitation_not_found. Requests are limited per client IP.'
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: The token of the invitation's link (WorkspaceInvitation.token).
          schema:
            type: string
      x-problem-codes:
        - workspace.invitation_not_found
      responses:
        '200':
          description: The invitation as its link shows it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWorkspaceInvitation
      tags:
        - workspace
      summary: Change an invitation's role
      description: 'For the workspace''s admins. The role is checked first (validation_failed). An invitation that does not exist, is deleted or accepted, or whose workspace the caller cannot see, answers workspace.invitation_not_found; a member or a guest, forbidden, whatever the invitation. To an admin, a declined invitation answers workspace.invitation_responded: delete it, then invite the address again. The link keeps its token.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - workspace.invitation_not_found
        - forbidden
        - workspace.invitation_responded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitationUpdate'
      responses:
        '200':
          description: The invitation with its new role, and the token of its link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitation'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteWorkspaceInvitation
      tags:
        - workspace
      summary: Delete an invitation
      description: 'For the workspace''s admins. The invitation, pending or declined, is soft-deleted: its link stops working, and its address can be invited again at once. An invitation that does not exist, is deleted or accepted, or whose workspace the caller cannot see, answers workspace.invitation_not_found; a member or a guest, forbidden.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.invitation_not_found
        - forbidden
      responses:
        '204':
          description: The invitation is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-invitations/{invitation_id}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
    post:
      operationId: acceptWorkspaceInvitation
      tags:
        - workspace
      summary: Accept an invitation to one's own address
      description: 'For the account the invitation was sent to: its address, as it is when the request runs, must be the invitation''s; another answers workspace.invitation_email_mismatch, which does not say whose, and nothing changes. The caller becomes a member with the invitation''s role, or a former member has his membership back with it; an active member stays as he is, his role too, and only the invitation is used. The invitation is then accepted and deleted: its link stops working. A token that is not the invitation''s, and an invitation that does not exist, is deleted or accepted, answer the same workspace.invitation_not_found; a declined one, workspace.invitation_responded. An account deactivated meanwhile answers unauthorized. The answer is the workspace, with the caller''s role in it. A former member whose membership comes back as a guest is also made a guest in every project of the workspace he has a membership of, ended ones too, in the same transaction.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.invitation_not_found
        - workspace.invitation_email_mismatch
        - workspace.invitation_responded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationResponse'
      responses:
        '200':
          description: The workspace the caller is a member of, with his role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-invitations/{invitation_id}/decline:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
    post:
      operationId: declineWorkspaceInvitation
      tags:
        - workspace
      summary: Decline an invitation to one's own address
      description: 'For the account the invitation was sent to, as accepting it is, with the same answers. The invitation stays, declined: its link shows so, and it holds its address until an admin deletes it.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.invitation_not_found
        - workspace.invitation_email_mismatch
        - workspace.invitation_responded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationResponse'
      responses:
        '204':
          description: The invitation is declined.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-slugs/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: checkWorkspaceSlug
      tags:
        - workspace
      summary: Tell whether a slug can name a new workspace
      description: 'Available, or why not: invalid (not 1–48 lower-case letters, digits, - and _), reserved (a path of this site, or held for one), or taken (an undeleted workspace has it). It tells nothing about the workspace that has it.'
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: Whether the slug is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugAvailability'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/workspaces/{slug}/preferences:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: getWorkspacePreferences
      tags:
        - workspace
      summary: Read the caller's display settings in a workspace
      description: The caller's own settings of the sidebar's project navigation in the workspace, for any active member. Until the caller first changes them they are the defaults, ACCORDION and 10, and reading them writes nothing. A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
      responses:
        '200':
          description: The caller's settings in the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePreferences'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWorkspacePreferences
      tags:
        - workspace
      summary: Change the caller's display settings in a workspace
      description: The fields given change and the others stay; the first change stores the caller's settings, the defaults with the change applied. The values are checked before the workspace is looked at (validation_failed). A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found.
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - workspace.not_found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspacePreferencesUpdate'
      responses:
        '200':
          description: The caller's settings in the workspace, as changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePreferences'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/projects:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listProjects
      tags:
        - project
      summary: List a workspace's projects that the caller sees
      description: 'The workspace''s projects that the caller sees, each as he sees it: every one, to its admins; to its members, the public ones and those they are members of; to its guests, those they are members of. The archived projects are left out, unless archived is true, which lists them alone. By each project''s place in the caller''s sidebar, the projects without a place in it last, then by name. A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found. The whole collection at once: collections are not paginated.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
      parameters:
        - name: archived
          in: query
          required: false
          description: true lists the archived projects alone; false, or no value, the others.
          schema:
            type: boolean
      responses:
        '200':
          description: The projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProject
      tags:
        - project
      summary: Create a project in a workspace
      description: 'For the workspace''s admins and members. The project is created with the caller, and the lead when one is given, as its admins, the project first in each one''s sidebar, and with its six states: Backlog, the default, Todo, In Progress, Done, Cancelled and Triage. The name has 1–255 characters, not blank, without NUL and without any of & + , : ; $ ^ } { * = ? @ # | '' < > . ( ) % ! -; the identifier, upper-cased, has 1–10 of A-Z, 0-9 and ÇŞĞİÖÜ; the network is 0 or 2, public when not given; the time zone is an IANA name, the workspace''s when not given (validation_failed). The values are checked before the workspace is looked at. A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found; a guest, forbidden. The lead must be an active admin or member of the workspace (project_lead_id not_allowed), which is checked after the caller''s role. Neither the name nor the identifier may be another undeleted project''s of the workspace (project.name_taken, project.identifier_taken).'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - workspace.not_found
        - forbidden
        - project.identifier_taken
        - project.name_taken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: The new project, as the caller, its admin, sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/project-identifiers/{identifier}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - name: identifier
        in: path
        required: true
        description: An identifier asked about, in any case.
        schema:
          type: string
    get:
      operationId: checkProjectIdentifier
      tags:
        - project
      summary: Check whether a project identifier is available in a workspace
      description: 'For the workspace''s admins and members, as createProject. The identifier is available when createProject would take it: once upper-cased, 1–10 of A-Z, 0-9 and ÇŞĞİÖÜ, and held by no undeleted project of the workspace, archived or not. A workspace that does not exist, is deleted, or of which the caller is not an active member answers workspace.not_found; a guest, forbidden.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
      responses:
        '200':
          description: Whether the identifier is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierAvailability'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: getProject
      tags:
        - project
      summary: Read a project
      description: 'For whoever sees the project: its active members, the workspace''s admins, and for a public project the workspace''s members too; a caller who is not its member reads it with member_role and sort_order null. An archived project is read as any other, with its archived_at. A project that does not exist, is deleted, or that the caller does not see answers project.not_found; so does one whose workspace he is not an active member of.'
      security:
        - bearer: []
      x-problem-codes:
        - project.not_found
      responses:
        '200':
          description: The project, as the caller sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateProject
      tags:
        - project
      summary: Change a project
      description: 'For the project''s admins, and its members who are the workspace''s admins. The fields given change and the others stay; the values follow createProject''s rules, and archive_in is 0–12 (validation_failed), checked before the project is looked at. An archived project cannot be changed (project.archived): unarchive it first. The lead and the default assignee, null to clear either, must be active members of the project who are not its guests (project_lead_id, default_assignee_id not_allowed), which is checked after the caller''s role. Neither the name nor the identifier may be another undeleted project''s of the workspace (project.name_taken, project.identifier_taken). A project that does not exist, is deleted, or that the caller does not see answers project.not_found; one he sees but may not change, forbidden. The role is decided after the project row is locked, so a caller demoted meanwhile is refused.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - project.not_found
        - forbidden
        - project.archived
        - project.identifier_taken
        - project.name_taken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: The project as changed, as the caller sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteProject
      tags:
        - project
      summary: Delete a project
      description: 'For the project''s admins, and its members who are the workspace''s admins; an archived project is deleted as any other. The project is deleted with its memberships, its members'' display settings and its states, all at one moment: it is no longer read, listed or changed, and its name and identifier are free again in the workspace. A project that does not exist, is deleted, or that the caller does not see answers project.not_found; one he sees but may not delete, forbidden. The role is decided after the project row is locked.'
      security:
        - bearer: []
      x-problem-codes:
        - project.not_found
        - forbidden
      responses:
        '204':
          description: The project is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: archiveProject
      tags:
        - project
      summary: Archive a project
      description: 'For the project''s admins, and its members who are the workspace''s admins. The project is archived as of the request: listProjects lists it among the archived ones, and until it is unarchived updateProject alone refuses it (project.archived); deleting it, changing one''s display settings in it, adding members to it and joining it work as on any project. An archived project archived again takes the new time. A project that does not exist, is deleted, or that the caller does not see answers project.not_found; one he sees but may not archive, forbidden. The role is decided after the project row is locked.'
      security:
        - bearer: []
      x-problem-codes:
        - project.not_found
        - forbidden
      responses:
        '200':
          description: The project as archived, as the caller sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: unarchiveProject
      tags:
        - project
      summary: Unarchive a project
      description: For the project's admins, and its members who are the workspace's admins. The project is no longer archived (archived_at null), and can be changed again; one that is not archived stays so. A project that does not exist, is deleted, or that the caller does not see answers project.not_found; one he sees but may not unarchive, forbidden. The role is decided after the project row is locked.
      security:
        - bearer: []
      x-problem-codes:
        - project.not_found
        - forbidden
      responses:
        '200':
          description: The project as unarchived, as the caller sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}/join:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: joinProject
      tags:
        - project
      summary: Join a project
      description: 'For the workspace''s admins and members who see the project: its admins join any project, its members a public one. The caller becomes its member with his workspace role; one who was its member before has his membership back, with the lesser of the role it had and his workspace role. He is given display settings in the project unless he has them. One who is an active member already is left as he is. An archived project is joined as any other. A project that does not exist, is deleted, or that the caller does not see answers project.not_found; a workspace guest who sees it, as its member, forbidden.'
      security:
        - bearer: []
      x-problem-codes:
        - project.not_found
        - forbidden
      responses:
        '200':
          description: The project as the caller sees it, now its member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listProjectMembers
      tags:
        - project
      summary: List a project's members
      description: 'For the project''s active members: its active members, each with his role in it, in the order they became members. A project that does not exist, is deleted, or that the caller does not see answers project.not_found; one he sees but is not a member of, forbidden.'
      security:
        - bearer: []
      x-problem-codes:
        - project.not_found
        - forbidden
      responses:
        '200':
          description: The project's active members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: addProjectMembers
      tags:
        - project
      summary: Add workspace members to a project
      description: 'For the project''s admins, and its members who are the workspace''s admins. Adds 1–100 accounts, each an active member of the workspace, with the role given: a workspace admin as an admin (20), a workspace guest as a guest (5), a workspace member as any of the three. One who was a member of the project before has his membership back, with the role given. Each is given display settings in the project, the project first in his sidebar, unless he has them. Refused from the request alone, before the project is looked at (validation_failed): no account, or more than 100 (members too_short, too_long; more than 100 is the one problem named), an account named twice (members[i].member_id duplicate), and a role not one of the three (members[i].role invalid_format). Then, after the caller''s role, so that who may not add learns nothing of the accounts, refused each by its place in members (validation_failed): an account that is not an active member of the workspace (member_id not_allowed), one that is an active member of the project already (member_id duplicate), and a role his workspace role does not allow (role not_allowed). An archived project''s members are added as any other''s. A project that does not exist, is deleted, or that the caller does not see answers project.not_found; one he sees but may not add to, forbidden.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - project.not_found
        - forbidden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMembersAdd'
      responses:
        '201':
          description: The accounts' memberships, in the request's order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/projects/{project_id}/preferences:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: getProjectPreferences
      tags:
        - project
      summary: Read the caller's display settings in a project
      description: 'The caller''s own settings in the project, for its active members: the tab bar of its header and its place in his sidebar. While he has none stored they are the defaults, work_items with nothing hidden and 65535, and reading them writes nothing. A project that does not exist, is deleted, or that the caller does not see answers project.not_found; one he sees but is not a member of, forbidden.'
      security:
        - bearer: []
      x-problem-codes:
        - project.not_found
        - forbidden
      responses:
        '200':
          description: The caller's settings in the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPreferences'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateProjectPreferences
      tags:
        - project
      summary: Change the caller's display settings in a project
      description: For the project's active members, their own settings. The fields given change and the others stay; navigation is replaced whole, and the first change stores the caller's settings, the defaults with the change applied. A tab the web app does not have, work_items hidden, and a tab hidden twice are refused (validation_failed), before the project is looked at. An archived project's settings change as any other's. A project that does not exist, is deleted, or that the caller does not see answers project.not_found; one he sees but is not a member of, forbidden.
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - project.not_found
        - forbidden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPreferencesUpdate'
      responses:
        '200':
          description: The caller's settings as changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPreferences'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An access token (JWT) from register, login or refresh, or a personal access token (nrv_pat_…).
  schemas:
    RegisterInvitation:
      description: 'The invitation a registration names, from its link (/workspace-invitations?invitation_id=…&token=…): while sign-up is off, it lets the address it was sent to register.'
      type: object
      additionalProperties: false
      required:
        - id
        - token
      properties:
        id:
          description: The link's invitation_id.
          type: string
          format: uuid
        token:
          description: The link's token.
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          description: The sign-in address; stored trimmed and in lower case.
          type: string
          format: email
        password:
          type: string
        invitation:
          $ref: '#/components/schemas/RegisterInvitation'
    FieldError:
      description: One invalid field of a request. Clients show text looked up by `code`; `message` is an English explanation for developers. Must match httpserver.FieldError and the field codes of internal/shared.
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          description: The field's path in the request body, e.g. password or tags[1].name. A path longer than 256 bytes is cut short and ends with `…`.
          type: string
        code:
          description: What is wrong with the field.
          type: string
          enum:
            - required
            - invalid_format
            - too_short
            - too_long
            - out_of_range
            - not_allowed
            - duplicate
            - weak_password
            - common_password
            - must_be_future
            - contains_url
        message:
          type: string
    Problem:
      description: RFC 9457 problem details (v0 design 3.5). `title` is the HTTP status phrase, `detail` explains this occurrence, and clients branch on `code`. Must match httpserver.Problem; the platform's contract test checks it.
      type: object
      additionalProperties: false
      required:
        - status
        - code
        - title
      properties:
        status:
          description: HTTP status code.
          type: integer
        code:
          description: Stable error code. Platform codes have no prefix (bad_request, unauthorized, forbidden, not_found, payload_too_large, validation_failed, rate_limited, server_busy, internal_error, not_ready); module codes are prefixed with the module that refuses, e.g. identity.email_taken, whichever module's operation answers them. Each operation lists the codes it can answer in x-problem-codes.
          type: string
        title:
          description: HTTP status phrase, e.g. "Not Found".
          type: string
        detail:
          description: What went wrong in this occurrence.
          type: string
        errors:
          description: The invalid fields of the request.
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    AuthTokens:
      description: 'A session''s tokens. Send access_token as "Authorization: Bearer"; when it expires, exchange refresh_token for the next pair at POST /api/v0/auth/refresh.'
      type: object
      additionalProperties: false
      required:
        - token_type
        - access_token
        - access_token_expires_in
        - refresh_token
        - refresh_token_expires_at
      properties:
        token_type:
          type: string
          enum:
            - Bearer
        access_token:
          type: string
        access_token_expires_in:
          description: Seconds from this response until the access token expires.
          type: integer
        refresh_token:
          description: An opaque nrv_rt_ token.
          type: string
        refresh_token_expires_at:
          description: When the session ends; refreshing never extends it.
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          description: The sign-in address, in any case, with or without surrounding blanks.
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          description: The refresh_token of the last AuthTokens of the session.
          type: string
    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          description: The refresh_token of the last AuthTokens of the session.
          type: string
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - first_name
        - last_name
        - display_name
        - user_timezone
        - avatar_url
        - cover_image_url
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
        user_timezone:
          description: An IANA time zone name.
          type: string
        avatar_url:
          description: Null until uploads arrive (M5).
          type:
            - string
            - 'null'
        cover_image_url:
          description: Null until uploads arrive (M5).
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        first_name:
          description: At most 255 characters, without a web address.
          type: string
        last_name:
          description: At most 255 characters, without a web address.
          type: string
        display_name:
          description: 1–255 characters.
          type: string
        user_timezone:
          description: An IANA time zone name, e.g. from GET /api/v0/timezones.
          type: string
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
    Theme:
      type: string
      enum:
        - system
        - light
        - dark
        - light-contrast
        - dark-contrast
    Language:
      description: The language of the web UI.
      type: string
      enum:
        - en
        - zh-CN
    StartOfTheWeek:
      description: The first day of the week, 0 Sunday to 6 Saturday.
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
    OnboardingSteps:
      type: object
      additionalProperties: false
      required:
        - profile_complete
        - workspace_create
        - workspace_invite
        - workspace_join
      properties:
        profile_complete:
          type: boolean
        workspace_create:
          type: boolean
        workspace_invite:
          type: boolean
        workspace_join:
          type: boolean
    Profile:
      type: object
      additionalProperties: false
      required:
        - theme
        - language
        - start_of_the_week
        - onboarding_step
        - is_onboarded
        - is_tour_completed
        - last_workspace_id
        - updated_at
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          $ref: '#/components/schemas/Language'
        start_of_the_week:
          $ref: '#/components/schemas/StartOfTheWeek'
        onboarding_step:
          $ref: '#/components/schemas/OnboardingSteps'
        is_onboarded:
          type: boolean
        is_tour_completed:
          type: boolean
        last_workspace_id:
          description: The workspace the web app opens last; null for none. It is not checked to exist.
          type:
            - string
            - 'null'
          format: uuid
        updated_at:
          type: string
          format: date-time
    OnboardingStepsUpdate:
      description: The steps to set; the others keep their values.
      type: object
      additionalProperties: false
      properties:
        profile_complete:
          type: boolean
        workspace_create:
          type: boolean
        workspace_invite:
          type: boolean
        workspace_join:
          type: boolean
    ProfileUpdate:
      type: object
      additionalProperties: false
