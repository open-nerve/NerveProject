# issue 模块的接口（M4 设计 5.1、5.2）。生成的 Go 代码在
# server/internal/modules/issue/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve issue API
  version: v0
paths:
  /api/v0/workspaces/{slug}/drafts:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listDrafts
      tags: [issue]
      summary: List your personal issue drafts
      description: Personal drafts only, including archived projects. Unknown or repeated scalar queries answer 422.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found, forbidden, validation_failed]
      parameters:
        - $ref: '../common.yaml#/components/parameters/Limit'
        - $ref: '../common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DraftPage'}
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createDraft
      tags: [issue]
      summary: Save an unfinished issue draft
      description: Saves structure without create validation; workspace admins and members may save their own drafts.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found, forbidden, validation_failed, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftCreate'}
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Draft'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/drafts/{draft_id}:
    parameters:
      - $ref: '#/components/parameters/DraftID'
    get:
      operationId: getDraft
      tags: [issue]
      summary: Read your issue draft
      security: [{bearer: []}]
      x-problem-codes: [issue.draft_not_found, forbidden]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Draft'}
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateDraft
      tags: [issue]
      summary: Replace fields of your issue draft
      security: [{bearer: []}]
      x-problem-codes: [issue.draft_not_found, forbidden, validation_failed, issue.draft_changed, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftUpdate'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Draft'}
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteDraft
      tags: [issue]
      summary: Delete your issue draft
      security: [{bearer: []}]
      x-problem-codes: [issue.draft_not_found, forbidden, issue.draft_changed, server_busy]
      responses:
        '204':
          description: Success
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/members/{user_id}/issues:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - name: user_id
        in: path
        required: true
        description: The target account UUID, not a workspace membership row UUID.
        schema: {type: string, format: uuid}
    get:
      operationId: listMemberIssues
      tags: [issue]
      summary: List a workspace member's work item relationships
      description: >-
        Workspace admins and members may read; workspace guests are forbidden.
        A target needs an undeleted workspace membership, active or ended.
        Only projects the caller actively belongs to that are undeleted and
        unarchived are included, applying the caller's OwnOnly restriction.
        Deleted, archived and triage work items are excluded. project_id only
        intersects this scope. Relationship filtering uses the path account,
        never the caller's identity or the target's project permissions.
        CSV alternatives use OR; different filters and repeated dates use AND.
        Unknown parameters and repeated non-date parameters answer 422.
        Binding precedes authentication: malformed paths or a missing relation
        answer 400; repeated declared non-date queries answer 422 even without
        a token. A group continuation retains filters and returns a flat page.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, workspace.not_found, workspace.member_not_found, forbidden]
      parameters:
        - name: relation
          in: query
          required: true
          description: The target account's relationship; visibility always follows the caller.
          schema: {type: string, enum: [assigned, created, subscribed]}
        - name: project_id
          in: query
          description: UUID alternatives intersected with the caller's ordinary visible projects.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
        - name: state_group
          in: query
          description: backlog, unstarted, started, completed or cancelled. CSV; repeated parameters are not allowed.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
        - name: priority
          in: query
          description: urgent, high, medium, low or none. CSV; repeated parameters are not allowed.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
        - name: label_id
          in: query
          description: UUID or none alternatives. CSV; repeated parameters are not allowed.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
        - name: start_date
          in: query
          description: A day, a..b, ..b, a.. or none; repeated conditions use AND.
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
        - name: target_date
          in: query
          description: A day, a..b, ..b, a.. or none; repeated conditions use AND.
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
        - name: sub_issue
          in: query
          description: Whether to include child work items. Only the strings true and false are allowed.
          schema: {type: string, default: 'true'}
        - name: group_by
          in: query
          schema:
            $ref: '#/components/schemas/IssueListGroupField'
        - name: order_by
          in: query
          schema:
            $ref: '#/components/schemas/IssueListOrder'
        - name: group_key
          in: query
          description: The selected group key; checked against its grouping field.
          schema: {type: string}
        - $ref: '../common.yaml#/components/parameters/Limit'
        - $ref: '../common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: A flat page or grouped pages. Group continuation returns a flat page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueListPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/projects/{project_id}/issues:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listIssues
      tags: [issue]
      summary: List a project's work items
      description: >-
        Active work items require issue.read; archived=true selects archived
        work items and requires issue.archive. An archived project remains
        readable. Only the explicit project's grant applies, including the
        caller's OwnOnly restriction. Deleted and triage work items are excluded.
        CSV alternatives use OR, different filters use AND; repeated date
        conditions also use AND. Unknown parameters, invalid business values
        and repeated non-date parameters are 422 not_allowed. Parameter binding
        precedes authentication: malformed paths and non-integer limits are 400,
        repeated non-date query parameters are 422 even without a token.
        Group and cell continuation retains the original filters and returns
        the flat envelope with the selected group or cell total.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, project.not_found, forbidden]
      parameters:
        - name: state_id
          in: query
          description: UUID alternatives. CSV; repeated parameters are not allowed.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
        - name: state_group
          in: query
          description: backlog, unstarted, started, completed or cancelled. CSV; repeated parameters are not allowed.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
        - name: priority
          in: query
          description: urgent, high, medium, low or none. CSV; repeated parameters are not allowed.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
        - name: label_id
          in: query
          description: UUID or none alternatives. CSV; repeated parameters are not allowed.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
        - name: assignee_id
          in: query
          description: UUID, me or none alternatives. CSV; repeated parameters are not allowed.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
        - name: created_by_id
          in: query
          description: UUID or me alternatives. CSV; repeated parameters are not allowed.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
        - name: mention_id
          in: query
          description: UUID or me alternatives. CSV; repeated parameters are not allowed.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
        - name: subscriber_id
          in: query
          description: UUID or me alternatives. CSV; repeated parameters are not allowed.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
        - name: start_date
          in: query
          description: A day, a..b, ..b, a.. or none; repeated conditions use AND.
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
        - name: target_date
          in: query
          description: A day, a..b, ..b, a.. or none; repeated conditions use AND.
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
        - name: sub_issue
          in: query
          description: Whether to include child work items. Only the strings true and false are allowed.
          schema: {type: string, default: 'true'}
        - name: archived
          in: query
          description: Select only archived work items when true. Only the strings true and false are allowed.
          schema: {type: string, default: 'false'}
        - name: group_by
          in: query
          schema:
            $ref: '#/components/schemas/IssueListGroupField'
        - name: sub_group_by
          in: query
          schema:
            $ref: '#/components/schemas/IssueListGroupField'
        - name: order_by
          in: query
          schema:
            $ref: '#/components/schemas/IssueListOrder'
        - name: group_key
          in: query
          description: The selected group key; checked against its grouping field.
          schema: {type: string}
        - name: sub_group_key
          in: query
          description: The selected group key; checked against its grouping field.
          schema: {type: string}
        - $ref: '../common.yaml#/components/parameters/Limit'
        - $ref: '../common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: A flat page, grouped pages, or lanes. Absent branches are omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueListPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createIssue
      tags: [issue]
      summary: Create a work item in a project
      description: >-
        For the project's admins and members; not in an archived project
        (project.archived). The name, without the white space around it, has
        1–255 characters, without NUL, and is stored so; at most 100
        assignees and 100 labels, each named once; the start date not after
        the target date (validation_failed), checked before the project is
        looked at. A project that does not exist, is deleted, or that the
        caller does not see answers project.not_found; one he sees but may
        not create work items in, forbidden; both are answered before the
        project is locked, and with the project locked the role is decided
        again. Then the state, when it is given, is one of the project's,
        not its triage state; each assignee is an active member of the
        project who is not its guest; each label is one of the project's;
        the parent, when it is given, is a work item of the project that is
        not archived and that the caller sees (validation_failed, every
        problem at once). Left out, the state is the project's default, the
        priority none, and the assignee the project's default assignee while
        he is still an active member of it who is not its guest, else no
        one. The work item takes the project's next number, never used
        again, also after a deletion; it comes after its state's work items,
        archived ones too: its sort order is their greatest plus 10000, or
        65535 for the state's first; in a state of the completed group it is
        completed at its creation. The caller and the assignees subscribe to
        it; its activity says it was created, and assigned to each assignee.
        Every row it writes is the caller's, at one moment. A project with
        too many writes on its work items at once answers server_busy, with
        Retry-After: try again then.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, project.not_found, forbidden, project.archived, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreate'
      responses:
        '201':
          description: The new work item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issues/{issue_id}:
    parameters:
      - $ref: '#/components/parameters/IssueID'
    get:
      operationId: getIssue
      tags: [issue]
      summary: Read a work item
      description: >-
        For the admins, members and guests of its project, archived or not;
        an archived work item is read as any other. A guest of a project
        that does not show its guests every work item
        (guest_view_all_features false) reads only the work items he
        created. A work item that does not exist, is deleted, whose project
        the caller does not see, or that he, such a guest, did not create,
        answers issue.not_found; one he sees the project of but may not
        read, forbidden.
      security: [{bearer: []}]
      x-problem-codes: [issue.not_found, forbidden]
      responses:
        '200':
          description: The work item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateIssue
      tags: [issue]
      summary: Change a work item
      description: >-
        For the admins and members of its project. The fields given change
        and the others stay; a list given is the work item's new list, empty
        for none. The values follow createIssue's rules, but for the order of
        the dates (validation_failed), checked before the work item is looked
        at. A work item that does not exist, is deleted, whose project the
        caller does not see, or that he did not create as a guest who sees
        only his own (getIssue) answers issue.not_found, whatever his role
        may do; one whose project he sees but whose work items he may not
        change, forbidden; both are answered before the project is locked,
        and with the project locked the role is decided again. A work item of
        an archived project cannot be changed (project.archived), nor then an
        archived work item (issue.archived), even by a change that changes
        nothing. Then the state, when it changes, is one of the project's,
        not its triage state; each account the work item is newly assigned to
        is an active member of the project who is not its guest, while one it
        keeps stays assigned whatever has become of him; each label added is
        one of the project's; the start date the work item then has is not
        after its target date, each as given or, not given, as it is: at
        start_date when the start date alone is given, else at target_date;
        the parent, when it changes to a work item, is one of the project's
        that is not archived and that the caller sees, and neither the work
        item nor one under it (validation_failed, every problem at once). A
        change that changes nothing writes nothing, and the work item is
        answered as it is. Otherwise the work item is changed last by the
        caller; moved into a state of the completed group, it is completed
        at the change, and moved into another, not completed; the accounts
        newly assigned subscribe to it; its activity says what changed: the
        name, the parent, the priority, the state, the start and the target
        dates, and each label and each assignee added and removed. Every row
        it writes is the caller's, at one moment. A project with too many
        writes on its work items at once answers server_busy, with
        Retry-After: try again then.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, issue.not_found, forbidden, project.archived, issue.archived, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdate'
      responses:
        '200':
          description: The work item as changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteIssue
      tags: [issue]
      summary: Delete a work item
      description: >-
        For the admins of its project, and for the member of it who created
        the work item, while he is an admin or a member of the project. A
        work item that does not exist, is deleted, whose project the caller
        does not see, or that he did not create as a guest who sees only
        his own (getIssue) answers issue.not_found, whatever his role may
        do; one whose project he sees but that he may not delete,
        forbidden; both are answered before the project is locked, and with
        the project locked the role is decided again. A work item of an
        archived project cannot be deleted (project.archived); an archived
        work item is deleted as any other. The work item and each work item
        under it, however deep, archived ones too, with their assignees,
        labels, relations, subscribers and activity, are deleted by the
        caller at one moment; their numbers are not used again. A project
        with too many writes on its work items at once answers server_busy,
        with Retry-After: try again then.
      security: [{bearer: []}]
      x-problem-codes: [issue.not_found, forbidden, project.archived, server_busy]
      responses:
        '204':
          description: The work item is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issues/{issue_id}/archive:
    parameters:
      - $ref: '#/components/parameters/IssueID'
    post:
      operationId: archiveIssue
      tags: [issue]
      summary: Archive a work item
      description: >-
        For the admins and members of its project. A work item that does not
        exist, is deleted, whose project the caller does not see, or that he
        did not create as a guest who sees only his own (getIssue) answers
        issue.not_found, whatever his role may do; one whose project he sees
        but whose work items he may not archive, forbidden; both are
        answered before the project is locked, and with the project locked
        the role is decided again. A work item of an archived project
        cannot be archived (project.archived). An archived work item is
        answered as it is, and nothing is written. Only a work item in a
        state of the completed or the cancelled group is archived
        (issue.not_archivable). It is archived at the moment of the
        request, and changed last by the caller then; its activity says it
        was archived, by the caller then. A project with too many writes on
        its work items at once answers server_busy, with Retry-After: try
        again then.
      security: [{bearer: []}]
      x-problem-codes: [issue.not_found, forbidden, project.archived, issue.not_archivable, server_busy]
      responses:
        '200':
          description: The work item, archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issues/{issue_id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/IssueID'
    post:
      operationId: unarchiveIssue
      tags: [issue]
      summary: Unarchive a work item
      description: >-
        For the admins and members of its project, as archiveIssue. A work
        item of an archived project cannot be unarchived
        (project.archived). A work item that is not archived is answered as
        it is, and nothing is written. Whatever its state, it is unarchived
        at the moment of the request, and changed last by the caller then;
        its activity says it was restored, by the caller then. A project
        with too many writes on its work items at once answers server_busy,
        with Retry-After: try again then.
      security: [{bearer: []}]
      x-problem-codes: [issue.not_found, forbidden, project.archived, server_busy]
      responses:
        '200':
          description: The work item, not archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issues/{issue_id}/sub-issues:
    parameters:
      - $ref: '#/components/parameters/IssueID'
    get:
      operationId: listSubIssues
      tags: [issue]
      summary: List the work items under a work item
      description: >-
        For the admins, members and guests of its project, as getIssue,
        which answers the same refusals: issue.not_found, forbidden. The
        work items directly under it, not those under them, that are not
        archived and that the caller sees: a guest of a project that does
        not show its guests every work item sees only those he created.
        They come in the order they were created in, the first first, all
        of them, without pages; an archived work item's too.
      security: [{bearer: []}]
      x-problem-codes: [issue.not_found, forbidden]
      responses:
        '200':
          description: The work items under it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueCollection'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: addSubIssues
      tags: [issue]
      summary: Put work items under a work item
      description: >-
        For the admins and members of its project. Refused from the request
        alone, before the work item is looked at (validation_failed): no
        work item, or more than 100 (sub_issue_ids too_short, too_long;
        more than 100 is the one problem named), and a work item named
        twice (sub_issue_ids[i] duplicate). A work item that does not
        exist, is deleted, whose project the caller does not see, or that
        he did not create as a guest who sees only his own (getIssue)
        answers issue.not_found, whatever his role may do; one whose
        project he sees but whose work items he may not change, forbidden;
        both are answered before the project is locked, and with the
        project locked the role is decided again. A work item of an
        archived project takes none under it (project.archived), nor then
        an archived work item (issue.archived). Then each work item named
        is one of the project's that is not archived and that the caller
        sees, and neither this work item nor one above it
        (sub_issue_ids[i] not_allowed, every problem at once). One under
        another work item moves under this one; one under it already stays
        as it is. Each that moves is changed last by the caller, and its
        activity says its parent changed, from the one it was under. Every
        row it writes is the caller's, at one moment. A project with too
        many writes on its work items at once answers server_busy, with
        Retry-After: try again then.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, issue.not_found, forbidden, project.archived, issue.archived, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubIssuesAdd'
      responses:
        '200':
          description: The work items that moved under it, in the order of their ids; none when each was under it already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueCollection'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issues/{issue_id}/relations:
    parameters:
      - $ref: '#/components/parameters/IssueID'
    get:
      operationId: listIssueRelations
      tags: [issue]
      summary: List a work item's relations
      description: >-
        For the admins, members and guests of its project, as getIssue,
        which answers the same refusals: issue.not_found, forbidden. Its
        relations, all of them, without pages, in the order they were made,
        the first first, each as this work item reads it, whose other work
        item the caller sees, as getIssue would answer it, of any project of
        the workspace, and is not archived, nor of an archived project other
        than this work item's: one left out so shows again once it, or its
        project, is unarchived. An archived work item's are listed too, as
        are those of a work item of an archived project.
      security: [{bearer: []}]
      x-problem-codes: [issue.not_found, forbidden]
      responses:
        '200':
          description: The relations, as this work item reads them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueRelationCollection'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createIssueRelations
      tags: [issue]
      summary: Relate a work item to others
      description: >-
        For the admins and members of its project. Refused from the request
        alone, before the work item is looked at (validation_failed): a type
        that is none of the four (relation_type invalid_format), no work
        item or more than 20 (issue_ids too_short, too_long; more than 20 is
        the one problem of issue_ids named), and a work item named twice
        (issue_ids[i] duplicate). A work item that does not exist, is
        deleted, whose project the caller does not see, or that he did not
        create as a guest who sees only his own (getIssue) answers
        issue.not_found, whatever his role may do; one whose project he
        sees but whose work items he may not change, forbidden. Both are
        answered before any project is locked, and so is whether he sees
        each work item named: one he does not takes no lock, and is refused
        below. Then the work item's project and those of the work items
        named are locked together, and his role is decided again. A work
        item of an archived project relates to none (project.archived), nor
        then an archived work item (issue.archived). Each work item named is
        another work item of the workspace, of any of its projects, that the
        caller sees, as getIssue would answer it, not archived, of a project
        not archived (issue_ids[i] not_allowed), and that does not relate to
        this one yet, of any type, either way (issue_ids[i] duplicate):
        every problem at once. Two work items have one relation at most. A
        work item blocking another is stored the other way round, as the
        other's blocked_by, and reads as blocking from this one alone. Both
        work items of each relation are changed last by the caller, and the
        activity of each says it relates to the other, with the type it
        reads. Every row it writes is the caller's, at one moment. A project
        with too many writes on its work items at once answers server_busy,
        with Retry-After: try again then.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, issue.not_found, forbidden, project.archived, issue.archived, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRelationsCreate'
      responses:
        '201':
          description: The relations made, as this work item reads them, in the order of the other work items' ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueRelationCollection'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issue-relations/{relation_id}:
    parameters:
      - $ref: '#/components/parameters/RelationID'
    delete:
      operationId: deleteIssueRelation
      tags: [issue]
      summary: Delete a relation
      description: >-
        For whoever may change either of its work items, as updateIssue:
        the admins and members of the project of one of them, each work
        item decided on its own project, the guest rule first. A relation
        that does not exist, is deleted, or neither of whose work items the
        caller sees answers issue.relation_not_found, whatever his role may
        do; one of which he sees a work item but may change neither,
        forbidden. Both are answered before any project is locked. Then the
        projects of both work items are locked together, and his role is
        decided again. Either work item of an archived project answers
        project.archived; then either archived work item, issue.archived.
        Both work items are changed last by the caller, and the activity of
        each says it no longer relates to the other, with the type it
        read. Every row it writes is the caller's, at one moment. A project
        with too many writes on its work items at once answers server_busy,
        with Retry-After: try again then.
      security: [{bearer: []}]
      x-problem-codes: [issue.relation_not_found, forbidden, project.archived, issue.archived, server_busy]
      responses:
        '204':
          description: The relation is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/issues/{identifier}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/IssueIdentifier'
    get:
      operationId: getIssueByIdentifier
      tags: [issue]
      summary: Read a work item by its identifier
      description: >-
        For the workspace's active members, then as getIssue. The
        identifier is the project's identifier, a hyphen and the work
        item's number: WEB-12. The number is written in decimal with the
        digits 0 to 9, without a sign or a leading zero, from 1 to
        2147483647. The project's identifier is compared with those of the
        workspace's undeleted projects in any case, i, ı, I and İ as one
        letter; when more than one project's identifier matches it, the one
        that is it upper-cased letter for letter (i and ı as I, İ as İ) is
        taken, and when none is, none. A workspace that does not exist, is
        deleted, or of which the caller is not an active member answers
        workspace.not_found. An identifier that is not one, that names no
        project of the workspace, or a number of no undeleted work item of
        the project answers issue.not_found, as does a work item whose
        project the caller does not see, or that he did not create as a
        guest who sees only his own (getIssue): the same answer for each.
        One whose project he sees but may not read answers forbidden. An
        archived work item is read as any other.
      security: [{bearer: []}]
      x-problem-codes: [workspace.not_found, issue.not_found, forbidden]
      responses:
        '200':
          description: The work item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issues/{issue_id}/reactions:
    parameters:
      - $ref: '#/components/parameters/IssueID'
    get:
      operationId: listIssueReactions
      tags: [issue]
      summary: List reactions on a visible work item
      description: Uses issue.read, including guest visibility. Live reactions are ordered by (created_at,id) ascending in one independent read snapshot.
      security: [{bearer: []}]
      x-problem-codes: [issue.not_found, forbidden]
      responses:
        '200':
          description: Live reactions, including an empty data array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueReactionCollection'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: addIssueReaction
      tags: [issue]
      summary: Add the caller's reaction
      description: >-
        Admins, members and guests may react to visible issues. Invalid decimal
        codes answer validation_failed before reads. Visibility and role are checked
        before the write gate and again under the project lock. Project archival
        precedes issue archival, then an existing live reaction of this caller
        answers issue.reaction_exists. Success updates the issue audit and adds
        the reaction at one moment, without activity or subscription changes.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, issue.not_found, forbidden, project.archived, issue.archived, issue.reaction_exists, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionCreate'
      responses:
        '201':
          description: The new reaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueReaction'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issues/{issue_id}/reactions/{reaction}:
    parameters:
      - $ref: '#/components/parameters/IssueID'
      - name: reaction
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9]{1,7}(-[0-9]{1,7}){0,15}$'
          maxLength: 128
    delete:
      operationId: removeIssueReaction
      tags: [issue]
      summary: Remove the caller's reaction
      description: >-
        Uses addIssueReaction's role, visibility, validation and archive order.
        Only the caller's own live reaction is removed; absence answers
        issue.reaction_not_found, even when another actor has the same reaction.
        Success updates the issue audit and soft-deletes the reaction at one
        moment, without activity or subscription changes.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, issue.not_found, forbidden, project.archived, issue.archived, issue.reaction_not_found, server_busy]
      responses:
        '204':
          description: The caller's reaction was removed.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issue-comments/{comment_id}/reactions:
    parameters:
      - name: comment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addCommentReaction
      tags: [issue]
      summary: Add the caller's reaction
      description: >-
        Admins, members and guests may react to visible comments, regardless of comment author. Invalid decimal
        codes answer validation_failed before reads. Visibility and role are checked
        before the write gate and again under the project lock. Project archival
        precedes issue archival, then an existing live reaction of this caller
        answers issue.reaction_exists. Success adds only the reaction, preserving all issue and comment audit fields, activities and subscriptions.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, issue.comment_not_found, forbidden, project.archived, issue.archived, issue.reaction_exists, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionCreate'
      responses:
        '201':
          description: The new reaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentReaction'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issue-comments/{comment_id}/reactions/{reaction}:
    parameters:
      - name: comment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reaction
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9]{1,7}(-[0-9]{1,7}){0,15}$'
          maxLength: 128
    delete:
      operationId: removeCommentReaction
      tags: [issue]
      summary: Remove the caller's reaction
      description: >-
        Uses addCommentReaction's role, visibility, validation and archive order.
        Only the caller's own live reaction is removed; absence answers
        issue.reaction_not_found, even when another actor has the same reaction.
        Success soft-deletes only the reaction, preserving all parent audit fields, activities and subscriptions.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, issue.comment_not_found, forbidden, project.archived, issue.archived, issue.reaction_not_found, server_busy]
      responses:
        '204':
          description: The caller's reaction was removed.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issues/{issue_id}/links:
    parameters:
      - $ref: '#/components/parameters/IssueID'
    get:
      operationId: listIssueLinks
      tags: [issue]
      summary: List links on a visible work item
      description: >-
        Uses issue.read and its guest visibility rule in one read snapshot.
        Links are in descending (created_at, id) order, without pagination.
      security: [{bearer: []}]
      x-problem-codes: [issue.not_found, forbidden]
      responses:
        '200':
          description: Links, with an empty data array when none exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueLinkCollection'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createIssueLink
      tags: [issue]
      summary: Create a link on a visible work item
      description: >-
        Uses issue.update, with hidden work items answering issue.not_found
        before forbidden. Domain validation precedes permission and the write
        gate. Locks the project, repeats authorization, and refuses archived
        projects before archived work items. URLs trim surrounding whitespace
        and default to http; HTTP scheme recognition ignores case while stored
        URL casing is preserved. At most 2048 Unicode characters after
        normalization, without credentials, zones or control characters.
        Duplicate live URLs on this issue answer issue.link_exists. Titles
        retain whitespace and permit null or empty text, at most 255 characters.
        All business, activity and event rows share one actor and moment.
        Busy projects answer 503 server_busy with Retry-After.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, issue.not_found, forbidden, issue.link_exists, project.archived, issue.archived, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueLinkCreate'
      responses:
        '201':
          description: The new link, with empty preview metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueLink'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issue-links/{link_id}:
    parameters:
      - name: link_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateIssueLink
      tags: [issue]
      summary: Update a link on a visible work item
      description: >-
        Uses issue.update, including the parent work item's guest visibility.
        Members may edit another member's link. Validates supplied fields before
        permissions and the write gate; rereads the link under the project lock.
        Archived projects precede archived work items, even for a no-op.
        Omitted title stays unchanged, null clears it, and empty text is kept.
        URL changes clear preview metadata; title-only changes preserve current
        database metadata and emit an updated event without a URL activity.
        Busy projects answer 503 server_busy with Retry-After.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, issue.link_not_found, forbidden, issue.link_exists, project.archived, issue.archived, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueLinkPatch'
      responses:
        '200':
          description: The current link after the update, including current metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueLink'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteIssueLink
      tags: [issue]
      summary: Delete a link on a visible work item
      description: >-
        Uses issue.update and the parent work item's guest visibility, without an
        author restriction. Rereads the live link under the project lock.
        Refuses archived projects before archived work items. Soft deletion,
        audit, activity and event share one actor and moment in one transaction.
        Busy projects answer 503 server_busy with Retry-After.
      security: [{bearer: []}]
      x-problem-codes: [issue.link_not_found, forbidden, project.archived, issue.archived, server_busy]
      responses:
        '204':
          description: The link was deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issues/{issue_id}/comments:
    parameters:
      - $ref: '#/components/parameters/IssueID'
    get:
      operationId: listIssueComments
      tags: [issue]
      summary: List comments on a visible work item
      description: >-
        Uses issue.read, including its guest visibility rule. Comments are in
        ascending (created_at, id) order. The cursor is only an exclusive
        position and never grants access to its source work item. Invalid
        cursor (400 bad_request) is checked before limit (422 validation_failed).
        The target, authorization and page are read in one snapshot.
      security: [{bearer: []}]
      x-problem-codes: [bad_request, validation_failed, issue.not_found, forbidden]
      parameters:
        - $ref: '../common.yaml#/components/parameters/Limit'
        - $ref: '../common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Comments, with null next_cursor on the final page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueCommentPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createIssueComment
      tags: [issue]
      summary: Create a comment on a visible work item
      description: >-
        For the project's admins, members and guests who can read the work item.
        Missing or hidden work items answer issue.not_found before forbidden.
        The project is locked first and the decision repeated. An archived
        project refuses with project.archived before an archived issue with
        issue.archived. Sanitized content must contain text, a mention or image;
        otherwise validation_failed on comment_html, required. At most 500000
        Unicode characters before sanitization. The caller and active mentioned
        members who can read it automatically subscribe. Existing subscriptions
        keep their identity and timestamps. All new rows have one writer and
        moment; this creates no activity or issue_mentions. Busy projects answer
        503 server_busy with Retry-After.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, issue.not_found, forbidden, project.archived, issue.archived, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCommentCreate'
      responses:
        '201':
          description: The new comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueComment'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issue-comments/{comment_id}:
    parameters:
      - name: comment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateIssueComment
      tags: [issue]
      summary: Edit a comment as its author
      description: >-
        Uses issue_comment.write for project admins, members and guests, then
        checks the comment author before the write gate and again under the
        project lock. Missing or hidden comments and parent work items answer
        issue.comment_not_found before issue.not_author. Only the comment author
        can edit, even for project admins. Project archiving refuses before issue
        archiving, and both refuse before unchanged sanitized HTML. Identical
        sanitized HTML writes nothing and preserves edited_at. Changed HTML sets
        edited_at and updated_at together, updates the work item and subscribes
        newly mentioned visible members without removing subscriptions. No
        activity is created. Busy projects answer 503 with Retry-After.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, issue.comment_not_found, forbidden, issue.not_author, project.archived, issue.archived, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCommentCreate'
      responses:
        '200':
          description: The edited or unchanged comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueComment'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteIssueComment
      tags: [issue]
      summary: Delete a comment as its author or project administrator
      description: >-
        Uses issue_comment.write then checks author or ProjectAdmin, before the
        write gate and again under the project lock. Missing or hidden comments
        and parent work items answer issue.comment_not_found before
        issue.not_author. Project archiving refuses before issue archiving.
        Soft-deletes only the live comment, updates its parent work item using
        the same writer and moment, and creates no activity. Busy projects answer
        503 server_busy with Retry-After.
      security: [{bearer: []}]
      x-problem-codes: [issue.comment_not_found, forbidden, issue.not_author, project.archived, issue.archived, server_busy]
      responses:
        '204':
          description: The comment was deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issues/{issue_id}/activities:
    parameters:
      - $ref: '#/components/parameters/IssueID'
    get:
      operationId: listIssueActivities
      tags: [issue]
      summary: List a work item's visible activity
      description: >-
        Uses issue.read,
        after the work item guest visibility rule. Hidden or missing work items
        answer issue.not_found before forbidden. Archived projects and work items
        remain readable. Visibility and page reads share one independent read
        snapshot. Activities are ordered by (created_at,id) ascending; a cursor
        is only a position and cannot expand the target's rows. For parent and
        relation fields, each nonnull identifier must name an existing issue in
        an active historical membership, respecting that project's guest scope.
        Soft deletion and archival of references and their projects do not hide
        history. Hidden or physically missing references remove the entire row
        before pagination. Only the eleven activity fields are returned.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, issue.not_found, forbidden]
      parameters:
        - $ref: '../common.yaml#/components/parameters/Limit'
        - $ref: '../common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Visible activity, with null next_cursor on the last page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueActivityPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issues/{issue_id}/description-versions:
    parameters:
      - $ref: '#/components/parameters/IssueID'
    get:
      operationId: listDescriptionVersions
      tags: [issue]
      summary: List a work item's saved descriptions
      description: >-
        Uses issue_description_version.read for project admins and members,
        after the work item guest visibility rule. Hidden or missing work items
        answer issue.not_found before forbidden. Archived projects and work items
        remain readable. Visibility and page reads share one independent read
        snapshot. Versions are ordered by (last_saved_at,id) descending; a cursor
        is only a position and cannot expand the target's rows. No HTML is listed.
      security: [{bearer: []}]
      x-problem-codes: [validation_failed, issue.not_found, forbidden]
      parameters:
        - $ref: '../common.yaml#/components/parameters/Limit'
        - $ref: '../common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Saved descriptions, with null next_cursor on the last page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescriptionVersionPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/issue-description-versions/{version_id}:
    parameters:
      - name: version_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDescriptionVersion
      tags: [issue]
      summary: Read one saved description
      description: >-
        Uses the same role and guest visibility rules as listDescriptionVersions.
        Missing, deleted and hidden versions or parents answer the identical
        issue.description_version_not_found problem before role refusal. Archived
        resources remain readable. To restore the HTML, use the ordinary issue
        PATCH, including its archive refusal and 600-second version merge policy.
      security: [{bearer: []}]
      x-problem-codes: [issue.description_version_not_found, forbidden]
      responses:
        '200':
          description: The saved description including its HTML.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescriptionVersionDetail'
        default:
          $ref: '#/components/responses/Problem'
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份（M0-P3 交接 3）
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    DraftID:
      name: draft_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Slug:
      name: slug
      in: path
      required: true
      description: A workspace's slug, as in the web app's address.
      schema:
        type: string
    IssueIdentifier:
      name: identifier
      in: path
      required: true
      description: >-
        A work item's identifier: its project's identifier, in any case, a
        hyphen and its number (IssueDetail.sequence_id), as WEB-12.
      schema:
        type: string
    ProjectID:
      name: project_id
      in: path
      required: true
      description: A project's id (Project.id).
      schema:
        type: string
        format: uuid
    IssueID:
      name: issue_id
      in: path
      required: true
      description: A work item's id (IssueDetail.id).
      schema:
        type: string
        format: uuid
    RelationID:
      name: relation_id
      in: path
      required: true
      description: A relation's id (IssueRelation.id).
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited and server_busy.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '../common.yaml#/components/schemas/Problem'
  schemas:
    IssueDraftPayload:
      description: Unfinished issue input. Saving checks structure, not create semantics.
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        description_html: {type: string}
        state_id: {type: string, format: uuid}
        priority: {type: string}
        assignee_ids:
          type: array
          items: {type: string, format: uuid}
        label_ids:
          type: array
          items: {type: string, format: uuid}
        start_date: {type: string, format: date}
        target_date: {type: string, format: date}
        parent_id: {type: string, format: uuid}
    DraftCreate:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        project_id: {type: [string, 'null'], format: uuid}
        payload: {$ref: '#/components/schemas/IssueDraftPayload'}
    DraftUpdate:
      description: Omission keeps a value; project null clears it; payload replaces the complete object.
      type: object
      additionalProperties: false
      properties:
        project_id: {type: [string, 'null'], format: uuid}
        payload: {$ref: '#/components/schemas/IssueDraftPayload'}
    Draft:
      type: object
      additionalProperties: false
      required: [id, workspace_id, project_id, payload, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        project_id: {type: [string, 'null'], format: uuid}
        payload: {$ref: '#/components/schemas/IssueDraftPayload'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DraftPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor, total]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Draft'}
        next_cursor: {$ref: '../common.yaml#/components/schemas/NextCursor'}
        total: {type: integer, format: int64}
    IssuePriority:
      description: A work item's priority, from the most to the least urgent.
      type: string
      enum: [urgent, high, medium, low, none]
    IssueDetail:
      description: A work item of a project.
      type: object
      additionalProperties: false
      required: [description_html, id, workspace_id, project_id, sequence_id, name, state_id, priority, start_date, target_date, parent_id, sort_order,
        completed_at, archived_at, assignee_ids, label_ids, sub_issues_count, created_by_id, updated_by_id, created_at, updated_at]
      properties:
        description_html:
          description: Sanitized rich text HTML; at most 500000 characters on input.
          type: string
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        sequence_id:
          description: Its number in its project, from 1; with the project's identifier, as in WEB-12.
          type: integer
        name:
          type: string
        state_id:
          type: string
          format: uuid
        priority:
          $ref: '#/components/schemas/IssuePriority'
        start_date:
          description: The day it starts; null for none.
          type: [string, 'null']
          format: date
        target_date:
          description: The day it is due, not before its start date; null for none.
          type: [string, 'null']
          format: date
        parent_id:
          description: >-
            The work item it is under, in the same project; null for none, or
            for one the caller does not see (a guest who sees only his own
            work items).
          type: [string, 'null']
          format: uuid
        sort_order:
          description: Its place among its state's work items, the lowest first.
          type: number
        completed_at:
          description: When it was put in a state of the completed group; null in any other state.
          type: [string, 'null']
          format: date-time
        archived_at:
          description: When it was archived; null when it is not.
          type: [string, 'null']
          format: date-time
        assignee_ids:
          description: >-
            The accounts it is assigned to, by id; one who has left the
            project since is still one.
          type: array
          items:
            type: string
            format: uuid
        label_ids:
          description: Its labels, by id.
          type: array
          items:
            type: string
            format: uuid
        sub_issues_count:
          description: >-
            The number of the work items directly under it that are not
            archived and that the caller sees: a guest of the project who
            sees only his own work items counts only his own.
          type: integer
        created_by_id:
          description: The account that created it; null for none.
          type: [string, 'null']
          format: uuid
        updated_by_id:
          description: The account that changed it last; null for none.
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Issue:
